appId: com.nirs4all.webapp
productName: nirs4all Studio
copyright: Copyright 2025-2026

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  # dist-electron/main.cjs loads the pinned Python runtime, the package
  # catalogue and the system trust helper from the application root.
  - scripts/python-runtime-config.cjs
  - scripts/tls-trust.cjs
  - recommended-config.json
  # Bind the packaged application to the exact resolved build source.
  - version.json
  - "!**/*.map"

# Installers ship no Python. Beside the Rust sidecar they carry what Studio
# needs to create and use the user's environment: uv, the wheels of the
# required packages and the document adapters. electron-builder.offline.yml
# adds the offline payload.
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: LICENSES/
    to: LICENSES/
    filter:
      - "**/*"
  - from: backend-dist/
    to: backend/
    filter:
      - "native/**/*"
      - "tools/**/*"
      - "wheels/**/*"
      - "adapters/**/*"

asar: true

# On macOS, pre-sign the native Methods library in the copied .app and rewrite
# its content contract before electron-builder signs the remaining bundle.
afterPack: scripts/macos-attested-runtime.cjs

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: public/nirs4all.ico
  artifactName: "${productName}-${version}-win-${arch}.${ext}"

nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  installerIcon: public/nirs4all.ico
  uninstallerIcon: public/nirs4all.ico
  installerHeaderIcon: public/nirs4all.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: nirs4all Studio

mac:
  target:
    - target: dmg
  icon: public/nirs4all_icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # These exact bytes are pre-signed and re-attested by afterPack. The Rust
  # sidecar and uv do not match this expression and are signed normally.
  signIgnore:
    - '[\\/]Contents[\\/]Resources[\\/]backend[\\/]native[\\/]libn4m\.dylib$'
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

linux:
  target:
    - target: deb
      arch:
        - x64
  icon: public/nirs4all_icon.png
  category: Science
  maintainer: nirs4all
  artifactName: "${productName}-${version}-linux-${arch}.${ext}"

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1

publish:
  provider: github
  owner: GBeurier
  repo: nirs4all-studio
