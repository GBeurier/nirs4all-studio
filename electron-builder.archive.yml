appId: com.nirs4all.webapp
productName: nirs4all Studio
copyright: Copyright 2025-2026

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  # dist-electron/main.cjs loads the shared Python runtime config at startup.
  - scripts/python-runtime-config.cjs
  - recommended-config.json
  - "!**/*.map"
  # Renderer/UI libraries are bundled into dist/ by Vite and are NEVER require()d
  # from node_modules at runtime (the main process only loads @sentry/electron and
  # its closure, which stay). Drop the heavy ones from the asar — they otherwise
  # ship a second, dead copy. Keep @sentry/* and @opentelemetry/* (crash reporting).
  - "!node_modules/three/**"
  - "!node_modules/three-stdlib/**"
  - "!node_modules/stats-gl/**"
  - "!node_modules/hls.js/**"
  - "!node_modules/@mediapipe/**"
  - "!node_modules/@react-three/**"
  - "!node_modules/recharts/**"
  - "!node_modules/date-fns/**"
  - "!node_modules/lucide-react/**"
  - "!node_modules/regl/**"
  - "!node_modules/framer-motion/**"
  - "!node_modules/@radix-ui/**"
  - "!node_modules/@dnd-kit/**"
  - "!node_modules/@fontsource/**"
  - "!node_modules/@tanstack/**"

# Standalone archives embed the fully baked backend-dist/, including python-runtime/.
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: LICENSES/
    to: LICENSES/
    filter:
      - "**/*"
  - from: backend-dist/
    to: backend/
    filter:
      - "**/*"

# Ship only en/fr Chromium locales instead of all ~50. Include both "en" (macOS
# .lproj basename) and "en-US" (Linux/Windows .pak basename) so English survives
# on every platform.
electronLanguages:
  - en
  - en-US
  - fr

asar: true

# On macOS, pre-sign closure Mach-O members in the copied .app and rewrite
# their content contract before electron-builder signs the remaining bundle.
afterPack: scripts/macos-attested-runtime.cjs

win:
  target:
    - target: zip
      arch:
        - x64
  icon: public/nirs4all.ico
  artifactName: "${productName}-${version}-all-in-one-win-${arch}.${ext}"

mac:
  target:
    - target: zip
  icon: public/nirs4all_icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # These exact bytes are pre-signed and re-attested by afterPack. The Rust
  # sidecar does not match these expressions and is signed normally.
  signIgnore:
    - '[\\/]Contents[\\/]Resources[\\/]backend[\\/]python-runtime[\\/]python[\\/]'
    - '[\\/]Contents[\\/]Resources[\\/]backend[\\/]native[\\/]libn4m\.dylib$'
  artifactName: "${productName}-${version}-all-in-one-mac-${arch}.${ext}"

linux:
  target:
    - target: dir
      arch:
        - x64
  icon: public/nirs4all_icon.png
  category: Science
  maintainer: nirs4all
  artifactName: "${productName}-${version}-all-in-one-linux-${arch}.${ext}"

publish:
  provider: github
  owner: GBeurier
  repo: nirs4all-webapp
