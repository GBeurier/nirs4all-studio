[package]
name = "studio-sidecar"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "R1 native sidecar skeleton for nirs4all Studio"
license = "(CECILL-2.1 OR AGPL-3.0-or-later)"
publish = false

[[bin]]
name = "studio-sidecar"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[dependencies]
atomicwrites = "0.4.4"
base64 = "0.22"
cap-std = "3"
# Complete immutable snapshot of selected Core commit 46a51a4; see its
# provenance and offline inventory/test gates. Its final descendant must be
# relocked against published dag-ml-data 0.2.10 before LOCK-RELEASE.
nirs4all = { version = "=0.3.25", path = "vendor/nirs4all-core-46a51a4/upstream/bindings/rust/nirs4all" }
# Complete immutable snapshot of selected IO commit f41967d; see its provenance
# and offline inventory/test gates. It must become a published identity by LOCK-RELEASE.
nirs4all-io = { version = "=0.1.7", path = "vendor/nirs4all-io-f419/upstream/crates/nirs4all-io" }
percent-encoding = "2.3"
rusqlite = { version = "0.32.1", features = ["bundled", "serialize"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10.9"
tempfile = "3"
tungstenite = { version = "0.26.2", default-features = false, features = ["handshake"] }
url = "2.5.4"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["process", "signal"] }

[target.'cfg(windows)'.dependencies]
studio-windows-job = { path = "crates/studio-windows-job" }

# Core 0.3.25 pins the locally qualified DagML 0.3.23 and n4m 0.1.4 train,
# which is not yet available from crates.io. Keep the exact qualified Cargo
# package payloads and replace these patches with registry identities before
# LOCK-RELEASE.
[patch.crates-io]
dag-ml = { path = "vendor/dag-ml-6800c4f/upstream/dag-ml-0.3.23" }
dag-ml-core = { path = "vendor/dag-ml-6800c4f/upstream/dag-ml-core-0.3.23" }
n4m = { path = "vendor/n4m-48ad1e5/upstream/n4m-0.1.4" }
