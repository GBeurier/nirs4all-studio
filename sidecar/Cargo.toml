[package]
name = "studio-sidecar"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "R1 native sidecar skeleton for nirs4all Studio"
license = "(CECILL-2.1 OR AGPL-3.0-or-later)"
publish = false

[[bin]]
name = "studio-sidecar"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[dependencies]
atomicwrites = "0.4.4"
base64 = "0.22"
cap-std = "3"
# Complete immutable snapshot of selected Core commit 6b25b63; see its
# provenance and offline inventory/test gates. Its final descendant must be
# relocked against published dag-ml-data 0.2.10 before LOCK-RELEASE.
nirs4all = { version = "=0.3.25", path = "vendor/nirs4all-core-6b25b63/upstream/bindings/rust/nirs4all" }
# Historical role-tagged reader retained for the frozen scientific-submission
# resolver.
nirs4all-io = { version = "=0.1.7", path = "vendor/nirs4all-io-f419/upstream/crates/nirs4all-io" }
# Complete immutable snapshot of selected IO commit 54fa4f5; its native
# DatasetPackage handoff remains a local publish=false qualification patch.
nirs4all-io-data002 = { package = "nirs4all-io", version = "=0.1.12", path = "vendor/nirs4all-io-54fa/upstream/crates/nirs4all-io" }
percent-encoding = "2.3"
rusqlite = { version = "0.32.1", features = ["bundled", "serialize"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10.9"
tempfile = "3"
tungstenite = { version = "0.26.2", default-features = false, features = ["handshake"] }
url = "2.5.4"

[dev-dependencies]
# Registry hold: final DagML release commit b7d643f has the exact same selected
# crate trees as this qualified package payload. Keep the path until 0.3.23 is
# published, then switch this dependency to the registry identity.
dag-ml-core = { version = "=0.3.23", path = "vendor/dag-ml-dafb8b6/upstream/dag-ml-core-0.3.23" }
nirs4all-io-data002 = { package = "nirs4all-io", version = "=0.1.12", path = "vendor/nirs4all-io-54fa/upstream/crates/nirs4all-io" }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["process", "signal"] }

[target.'cfg(windows)'.dependencies]
studio-windows-job = { path = "crates/studio-windows-job" }

# Core 0.3.25 pins DagML 0.3.23 and n4m 0.1.4, which are not yet all available
# from crates.io. DagML final commit b7d643f has the exact same selected crate
# trees as the qualified payload below. Keep these local holds until the exact
# registry packages are published, then remove every path patch.
[patch.crates-io]
dag-ml = { path = "vendor/dag-ml-dafb8b6/upstream/dag-ml-0.3.23" }
dag-ml-core = { path = "vendor/dag-ml-dafb8b6/upstream/dag-ml-core-0.3.23" }
dag-ml-data = { path = "vendor/dag-ml-data-1f60/upstream/crates/dag-ml-data" }
dag-ml-data-core = { path = "vendor/dag-ml-data-1f60/upstream/crates/dag-ml-data-core" }
dag-ml-data-provider = { path = "vendor/dag-ml-data-1f60/upstream/crates/dag-ml-data-provider" }
nirs4all-io = { path = "vendor/nirs4all-io-54fa/upstream/crates/nirs4all-io" }
nirs4all-io-dagml = { path = "vendor/nirs4all-io-54fa/upstream/crates/nirs4all-io-dagml" }
n4m = { path = "vendor/n4m-48ad1e5/upstream/n4m-0.1.4" }
