[package]
name = "studio-sidecar"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "R1 native sidecar skeleton for nirs4all Studio"
license = "(CECILL-2.1 OR AGPL-3.0-or-later)"
publish = false

[[bin]]
name = "studio-sidecar"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[dependencies]
atomicwrites = "0.4.4"
base64 = "0.22"
nirs4all = "=0.3.22"
percent-encoding = "2.3"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde_json = "1.0"
serde_yaml = "0.9"
tungstenite = { version = "0.26.2", default-features = false, features = ["handshake"] }
url = "2.5.4"
