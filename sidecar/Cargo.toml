[package]
name = "studio-sidecar"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "R1 native sidecar skeleton for nirs4all Studio"
license = "(CECILL-2.1 OR AGPL-3.0-or-later)"
publish = false

[[bin]]
name = "studio-sidecar"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[dependencies]
atomicwrites = "0.4.4"
base64 = "0.22"
cap-std = "3"
# Public owner crates at minor granularity; Cargo.lock selects the exact
# cohort, shared with Core so one Rust IO version resolves.
nirs4all = "0.6"
nirs4all-io = "0.3"
percent-encoding = "2.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32.1", features = ["bundled", "serialize"] }
same-file = "1"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { package = "yaml_serde", version = "0.10.7" }
sha2 = "0.10.9"
tempfile = "3"
tungstenite = { version = "0.26.2", default-features = false, features = ["handshake"] }
url = "2.5.4"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["process", "signal"] }

[target.'cfg(windows)'.dependencies]
studio-windows-job = { path = "crates/studio-windows-job" }
