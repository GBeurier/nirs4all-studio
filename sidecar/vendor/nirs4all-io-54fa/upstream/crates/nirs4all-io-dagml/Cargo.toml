[package]
name = "nirs4all-io-dagml"
description = "Bridge from a nirs4all-io AssembledDataset to a dag-ml-data CoordinatorDataPlanEnvelope."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "emit-dagml"
path = "src/bin/emit_dagml.rs"

[dependencies]
nirs4all-io = { path = "../nirs4all-io" }
dag-ml-data.workspace = true
dag-ml-data-provider.workspace = true
serde_json = "1.0"
sha2.workspace = true
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
