# EPIC 12.1 — direct parity oracle: the pyo3 binding's Rust→SpectroDataset must
# equal nirs4all's own DatasetConfigs (tests/test_parity.py). Needs the sibling
# nirs4all + dag-ml + dag-ml-data; this gate must run for real on main.
name: Parity oracle
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.11"
      - name: Fetch parity oracle repos
        run: |
          git clone --depth 1 https://github.com/GBeurier/nirs4all.git ../nirs4all
          git clone --depth 1 https://github.com/GBeurier/dag-ml.git ../dag-ml
          git clone --depth 1 https://github.com/GBeurier/dag-ml-data.git ../dag-ml-data
      - name: Build the binding wheel + run the parity oracle
        run: |
          pip install maturin pytest
          maturin build -m bindings/python/Cargo.toml --interpreter python3 --out dist
          # The binding (nirs4all_io) + real nirs4all — no pure-Python MVP here.
          pip install dist/*.whl
          mkdir -p ../dag-ml/dist
          maturin build -m ../dag-ml/crates/dag-ml-py/Cargo.toml --interpreter python3 --out ../dag-ml/dist
          pip install ../dag-ml/dist/*.whl
          mkdir -p ../dag-ml-data/dist
          maturin build -m ../dag-ml-data/crates/dag-ml-data-py/Cargo.toml --interpreter python3 --out ../dag-ml-data/dist
          pip install ../dag-ml-data/dist/*.whl
          pip install -e ../nirs4all
          python -m pytest tests/test_parity.py -m parity -v
