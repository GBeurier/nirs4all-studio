name: WASM binding
on:
  push:
    branches: [main, 'rc/**']
  pull_request:
    branches: [main, 'rc/**']
  workflow_dispatch: {}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          # Keep the build action's wasm-pack aligned with the release workflow:
          # unpinned wasm-pack releases have shipped incompatible wasm-opt.
          version: 'v0.15.0'
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Verify WASM Cargo lock
        run: cargo metadata --manifest-path bindings/wasm/Cargo.toml --locked --format-version 1 > /dev/null
      - name: Verify release legal payloads mirror the canonical inventory
        run: node scripts/stage_wasm_package.mjs --check-legal
      - name: Build (nodejs target)
        run: wasm-pack build bindings/wasm --target nodejs --out-dir pkg --locked
      - name: Node smoke
        run: node bindings/wasm/tests/node_smoke.cjs
