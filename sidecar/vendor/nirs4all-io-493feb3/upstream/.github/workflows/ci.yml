name: CI

on:
  push:
    branches: [main, 'rc/**']
  pull_request:

jobs:
  rust-security:
    name: Rust security (all lockfiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.1
      - name: Audit root and binding dependency graphs
        run: bash scripts/audit_rust_locks.sh

  rust:
    name: Rust green gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build (no default features)
        run: cargo build --workspace --no-default-features

  python:
    name: Python green gate + contract goldens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Checkout datasets sibling
        run: git clone --depth 1 https://github.com/GBeurier/nirs4all-datasets ../nirs4all-datasets
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.11"
      - name: Install
        # The `dev` extra pulls the nirs4all / nirs4all-formats oracles, which
        # are not on PyPI; a clean runner only has this repo. Install the
        # available runtime + data extras + tooling, and skip the parity oracle
        # (the only `parity`/`formats`-marked tests; `importorskip`-guarded too).
        run: pip install -e ".[parquet,excel]" scipy pytest ruff mypy pydantic python-dotenv matplotlib requests typer
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy .
      - name: Pytest (incl. canonical + contract goldens)
        run: pytest -m "not parity"

  python-binding:
    name: Published Python wheel gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.11"
      - name: Build abi3 wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest
          maturin build -m bindings/python/Cargo.toml --interpreter python3 --out dist
      - name: Install and test published Python surface
        run: |
          python -m pip install dist/*.whl
          python -m pytest bindings/python/tests -q
