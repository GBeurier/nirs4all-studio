# SPDX-License-Identifier: CECILL-2.1 OR AGPL-3.0-or-later
[workspace]
resolver = "2"
members = [
    "crates/nirs4all-io-core",
    "crates/nirs4all-io",
    "crates/nirs4all-io-capi",
    "crates/nirs4all-io-cli",
    "crates/nirs4all-io-dagml",
]
# Language bindings build with their own toolchains (maturin / cargo-ndk /
# wasm-pack) and are intentionally excluded from the cargo workspace.
exclude = [
    "bindings/python",
    "bindings/wasm",
]

[workspace.package]
version = "0.1.18"
edition = "2021"
# Rust crates are dual-licensed because they port nirs4all-derived logic
# (D-R5); see COPY_PROVENANCE.md.
license = "CECILL-2.1 OR AGPL-3.0-or-later"
authors = ["Gregory Beurier <gregory.beurier@cirad.fr>"]
repository = "https://github.com/GBeurier/nirs4all-io"
homepage = "https://github.com/GBeurier/nirs4all-io"
readme = "README.md"

[workspace.dependencies]
# Internal crates (path deps so members reference them via `.workspace = true`).
# A `version` is REQUIRED for crates.io publishing: cargo strips the `path` at
# publish time and resolves the dep from crates.io via this version. It MUST
# track [workspace.package] version — scripts/bump_version.sh keeps it in sync.
nirs4all-io-core = { path = "crates/nirs4all-io-core", version = "0.1.18" }
nirs4all-io = { path = "crates/nirs4all-io", version = "0.1.18" }
# DATA-002 consumes the paired 0.2.11 provider surface. 0.2.11 is qualified
# from the exact sibling candidate until it is published; keep Cargo.lock on
# the last registry release rather than manufacturing a release lock entry.
dag-ml-data = "0.2.11"
dag-ml-data-provider = "0.2.11"
# Third-party. serde_json enables `preserve_order` so that *input* object order
# mirrors Python dict insertion order (load-bearing for legacy-config
# normalization, where input order can leak into output list order). Canonical
# JSON therefore sorts object keys EXPLICITLY (see canonical_json.rs) rather than
# relying on the map type.
serde = { version = "1.0", features = ["derive"] }
# preserve_order: input map order mirrors Python dicts (canonical_json sorts keys
# explicitly). float_roundtrip: serde_json's default float parser is only
# 1-ULP-correct, so re-parsing canonical JSON could diverge from CPython's json
# (and std parse) on float-bearing values; this makes parsing correctly-rounded,
# matching Python for cross-language parity (emit/ryu is unaffected).
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
regex = "1.10"
toml = "0.8"
indexmap = { version = "2.2", features = ["serde"] }
csv = "1.3"
