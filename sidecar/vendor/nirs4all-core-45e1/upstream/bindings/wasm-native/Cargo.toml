[package]
name = "nirs4all-core-wasm-native"
version = "0.3.22"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Archive V2 validation bridge for nirs4all-core WASM"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dag-ml-core = { version = "=0.3.18", default-features = false }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
wasm-bindgen = "0.2"
