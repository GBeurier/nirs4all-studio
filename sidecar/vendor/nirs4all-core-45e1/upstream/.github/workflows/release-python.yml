# Build native abi3 nirs4all-core wheels + an sdist and publish them to PyPI
# via OIDC Trusted Publishing.
#
# nirs4all-core exposes a Rust/PyO3 extension (`nirs4all_core._native`), so its
# wheels must be built for each supported platform.  In particular, Linux
# wheels must be produced by maturin's manylinux build environment; a runner
# native `linux_x86_64` wheel is rejected by PyPI.
#
# PyPI name is `nirs4all-core` (NOT `nirs4all`): the `nirs4all` PyPI project is
# the FULL Python library, so the aggregate ships under its own distribution
# name. The canonical import is `nirs4all_core`; `n4a` is the short facade.
#
# Publishing uses GitHub OIDC Trusted Publishing (id-token: write) through the
# `pypi` GitHub environment — NO API token. The maintainer must create a NEW
# Trusted Publisher on pypi.org for project `nirs4all-core` with:
#   owner = GBeurier, repo = nirs4all-core,
#   workflow = release-python.yml, environment = pypi
# (the SAME convention as nirs4all-formats / nirs4all-io / nirs4all-methods).
#
# Triggers
# --------
# - push tag v*.*.*  -> build + (non-pre-release) publish to PyPI
# - workflow_dispatch defaults to a dry-run.  A maintainer can explicitly
#   republish a failed tag build with `publish=true` and its exact release tag;
#   this is deliberately useful when PyPI rejected packaging metadata before
#   accepting any distribution.
name: release-python

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the exact release_tag after rebuilding artifacts"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Existing production tag to rebuild (for example v0.3.15)"
        required: false
        type: string
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.11"
      - name: Build portable wheels
        env:
          CIBW_BUILD: "cp311-*"
          CIBW_SKIP: "*-musllinux_*"
          # The official n4m Rust binding intentionally rejects 32-bit C
          # targets: its C ABI transports matrix dimensions as 64-bit values.
          # Do not ask cibuildwheel for a cp311-win32 wheel it cannot build.
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_TEST_COMMAND: >-
            python -c "import nirs4all_core;
            assert hasattr(nirs4all_core, 'read_portable_predictor_package_v2');
            assert hasattr(nirs4all_core, 'write_archive_v2_from_native_payloads')"
        run: |
          python -m pip install --upgrade pip cibuildwheel
          cibuildwheel --output-dir dist bindings/python
      - name: twine check
        shell: bash
        run: |
          python -m pip install twine
          python -m twine check dist/*.whl
      - name: Validate tag matches the built version
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
        shell: bash
        run: |
          set -euo pipefail
          # The tag minus the leading 'v' must equal the PEP 440 version baked
          # into the wheel + sdist. PEP 440 alpha/beta/rc spellings (0.1.0a1,
          # 0.1.0b2, 0.1.0rc1) are allowed; the publish step below only fires
          # for non-pre-release tags. scripts/bump_version.sh keeps the version
          # in sync with the Rust-crate SoT.
          release_tag="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          tag_version="${release_tag#v}"
          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_tag ${release_tag} is not a production tag (vX.Y.Z)" >&2
            exit 1
          fi
          dist_file=$(ls dist/nirs4all_core-*.whl 2>/dev/null | head -n1 || true)
          if [[ -z "${dist_file}" ]]; then
            echo "::error::no nirs4all_core wheel found in dist/ to validate" >&2
            ls -la dist/ >&2 || true
            exit 1
          fi
          base=$(basename "${dist_file}")
          rest="${base#nirs4all_core-}"
          dist_version="${rest%%-*}"        # nirs4all_core-0.1.0-py3-... -> 0.1.0
          if [[ "${tag_version}" != "${dist_version}" ]]; then
            echo "::error::Tag version (${tag_version}) != built package version (${dist_version}). Run scripts/bump_version.sh and re-tag." >&2
            exit 1
          fi
          echo "tag ${release_tag} matches built package version ${dist_version}."
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: python-wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade build twine
          python -m build --sdist bindings/python --outdir dist
          python -m twine check dist/*.tar.gz
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI (OIDC)
    needs: [build, sdist]
    runs-on: ubuntu-latest
    # Production tags only. Pre-release tags (anything containing '-', e.g.
    # v0.1.0-alpha.1) are excluded so they never reach PyPI; and never on a
    # workflow_dispatch dry run — only a real tag push publishes. Mirrors the
    # nirs4all-io / nirs4all-formats / nirs4all-methods convention.
    if: ${{ (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && github.event_name != 'workflow_dispatch') || (github.event_name == 'workflow_dispatch' && inputs.publish && startsWith(inputs.release_tag, 'v') && !contains(inputs.release_tag, '-')) }}
    # Use the `pypi` GitHub environment so the OIDC token carries an
    # `environment: pypi` claim, matching the Trusted Publisher on pypi.org.
    environment:
      name: pypi
      url: https://pypi.org/p/nirs4all-core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - name: Validate Trusted Publisher release tuple
        run: |
          set -euo pipefail
          expected_repo="GBeurier/nirs4all-core"
          if [[ "${GITHUB_REPOSITORY}" != "${expected_repo}" ]]; then
            echo "::error::PyPI Trusted Publisher for project nirs4all-core must target owner=GBeurier repo=nirs4all-core workflow=release-python.yml environment=pypi; current repository is ${GITHUB_REPOSITORY}." >&2
            exit 1
          fi
          case "${GITHUB_WORKFLOW_REF}" in
            */.github/workflows/release-python.yml@*)
              ;;
            *)
              echo "::error::Expected GITHUB_WORKFLOW_REF to point at .github/workflows/release-python.yml, got ${GITHUB_WORKFLOW_REF}." >&2
              exit 1
              ;;
          esac
      - name: Validate tag is a production release version (vX.Y.Z)
        run: |
          set -euo pipefail
          release_tag="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          tag_version="${release_tag#v}"
          if [[ ! "${tag_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag ${release_tag} is not a production release version (vX.Y.Z); pre-releases are not auto-published to PyPI" >&2
            exit 1
          fi
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
