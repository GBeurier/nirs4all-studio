[package]
name = "nirs4all-core-python-native"
version = "0.3.25"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Native Archive V2/V3 and Methods replay bridge for the nirs4all-core Python facade"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
nirs4all = { path = "../rust/nirs4all" }
pyo3 = { version = "0.22", features = ["abi3-py311", "extension-module"] }
pythonize = "0.22"
serde_json = "1"
