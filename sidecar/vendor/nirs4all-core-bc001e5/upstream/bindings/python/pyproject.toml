[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "nirs4all-core"
version = "0.3.24"
description = "Portable nirs4all aggregate binding over formats, IO, methods, dag-ml, and dag-ml-data (datasets optional)"
readme = "README.md"
requires-python = ">=3.11"
license = "CECILL-2.1 OR AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "nirs4all contributors" }]
keywords = ["nirs", "spectroscopy", "chemometrics", "wasm", "bindings"]
# License is declared via the SPDX `license` expression above (PEP 639);
# no license trove classifier is listed to avoid contradicting it.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dag-ml = ["dag-ml>=0.3.0"]
dag-ml-data = ["dag-ml-data>=0.2.9"]
formats = ["nirs4all-formats>=0.2.7"]
io = ["nirs4all-io>=0.1.11"]
# nirs4all-datasets is kept EXTERNAL/OPTIONAL (to avoid bloat): it is its own
# extra and is intentionally NOT part of the bundled `all` aggregate below.
datasets = ["nirs4all-datasets>=0.3.5"]
methods = ["nirs4all-methods>=1.0.9", "pls4all>=1.0.9", "scikit-learn>=1.3"]
# The bundled aggregate = methods + formats + io (+ dag-ml / dag-ml-data).
# Datasets is deliberately excluded; install nirs4all-core[datasets] (or
# [everything]) to opt in.
all = [
    "dag-ml>=0.3.0",
    "dag-ml-data>=0.2.9",
    "nirs4all-formats>=0.2.7",
    "nirs4all-io>=0.1.11",
    "nirs4all-methods>=1.0.9",
    "pls4all>=1.0.9",
    "scikit-learn>=1.3",
]
everything = ["nirs4all-core[all,datasets]"]

[project.urls]
Homepage = "https://nirs4all.org"
Documentation = "https://nirs4all-core.readthedocs.io/en/latest/"
Repository = "https://github.com/GBeurier/nirs4all-core"
Issues = "https://github.com/GBeurier/nirs4all-core/issues"

# The wheel ships the canonical aggregate package (`nirs4all_core`) plus the
# additive, non-shadowing brand facade (`n4a`). The full Python `nirs4all`
# library remains a separate distribution until its production cutover.
[tool.maturin]
manifest-path = "../python-native/Cargo.toml"
module-name = "nirs4all_core._native"
python-source = "src"
python-packages = ["nirs4all_core", "n4a"]
exclude = ["**/__pycache__", "**/__pycache__/**", "**/*.pyc", "**/*.pyo"]
features = ["pyo3/extension-module"]

# cargo-cyclonedx currently serializes absolute local path dependencies into
# its bom-ref fields, making otherwise identical wheels checkout-dependent.
# Keep auditwheel's OS-package SBOM when repair actually grafts a library.
[tool.maturin.sbom]
rust = false
auditwheel = true
