[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dag-ml-data-provider"
version = "0.2.11"
description = "Stdlib-only ctypes shim for the dag-ml-data C ABI provider vtable."
requires-python = ">=3.11"
license = "CeCILL-2.1 OR AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "G. Beurier", email = "beurier@cirad.fr" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["dag_ml_data_provider"]

[tool.hatch.build.targets.wheel.force-include]
"dag_ml_data_provider/py.typed" = "dag_ml_data_provider/py.typed"
