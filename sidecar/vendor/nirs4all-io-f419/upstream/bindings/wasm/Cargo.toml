[package]
name = "nirs4all-io-wasm"
description = "wasm-bindgen binding for nirs4all-io: the fs-free JSON surface (to_spec / validate over a spec dict). Excluded from the cargo workspace; built with wasm-pack."
version = "0.1.7"
edition = "2021"
license = "CECILL-2.1 OR AGPL-3.0-or-later"
authors = ["Gregory Beurier <gregory.beurier@cirad.fr>"]
repository = "https://github.com/GBeurier/nirs4all-io"
publish = false

[lib]
name = "nirs4all_io_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pure core only — no facade (the facade owns file IO; WASM has no fs, D-R7).
nirs4all-io-core = { path = "../../crates/nirs4all-io-core" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
