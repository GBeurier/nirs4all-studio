[package]
name = "nirs4all-io-py"
description = "pyo3/maturin Python binding for nirs4all-io (infer / to_spec / validate / load). Excluded from the cargo workspace; built with maturin."
version = "0.1.7"
edition = "2021"
license = "CECILL-2.1 OR AGPL-3.0-or-later"
authors = ["Gregory Beurier <gregory.beurier@cirad.fr>"]
repository = "https://github.com/GBeurier/nirs4all-io"
publish = false

[lib]
name = "nirs4all_io_native"
crate-type = ["cdylib"]

[dependencies]
# Renamed import so the facade crate (`nirs4all_io`) does not collide with this
# crate's `#[pymodule] fn nirs4all_io` / lib name.
nirs4all_io_facade = { package = "nirs4all-io", path = "../../crates/nirs4all-io" }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py311"] }
pythonize = "0.23"
serde_json = "1.0"
