[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nirs4all-io"
description = "Dataset-assembly bridge: resolve / infer / configure / materialize arbitrary user inputs into SpectroDataset or DatasetPackage; the Rust workspace includes the dag-ml-data bridge."
readme = "README.md"
requires-python = ">=3.11"
license = "CeCILL-2.1 OR AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [
    { name = "Gregory Beurier", email = "gregory.beurier@cirad.fr" },
]
keywords = ["nirs", "spectroscopy", "dataset", "loader", "inference", "chemometrics", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0.0",
    "jsonschema>=4.17.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14.0.0"]
excel = ["openpyxl>=3.1.0"]
matlab = ["scipy>=1.10.0", "h5py>=3.8.0"]
# Vendor spectroscopy files (OPUS/JCAMP/ASD/...) are read through the renamed
# reader library. Not yet on PyPI -> install editable from the sibling repo.
formats = ["nirs4all-formats"]
all = ["nirs4all-io[parquet,excel,matlab,formats]"]
dev = [
    "pytest>=7.4",
    "ruff>=0.6",
    "mypy>=1.8",
    "pyarrow>=14.0.0",
    "openpyxl>=3.1.0",
    "scipy>=1.10.0",
    # Dev/test-only parity oracle (read-only); MUST NOT be a runtime dependency.
    "nirs4all",
    "nirs4all-formats",
]

[project.urls]
Homepage = "https://github.com/GBeurier/nirs4all-io"
Repository = "https://github.com/GBeurier/nirs4all-io"

[tool.hatch.version]
path = "src/nirs4all_io/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nirs4all_io"]

[tool.ruff]
line-length = 220
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
# The pyo3 binding ships its own `nirs4all_io` Python package (mixed maturin
# layout) with its own toolchain; exclude it from the MVP's root mypy run so the
# two `nirs4all_io` packages don't collide as a duplicate module.
exclude = ['^bindings/']

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "parity: dev-only tests that import nirs4all as a read-only parity oracle",
    "formats: tests that require the nirs4all-formats reader library",
]
