# SPDX-License-Identifier: CECILL-2.1 OR AGPL-3.0-or-later
[package]
name = "nirs4all-io-dagml"
description = "Bridge from a nirs4all-io AssembledDataset to a dag-ml-data CoordinatorDataPlanEnvelope."
version = "0.1.0-alpha.0"
edition = "2021"
license = "CECILL-2.1 OR AGPL-3.0-or-later"
authors = ["Gregory Beurier <gregory.beurier@cirad.fr>"]
repository = "https://github.com/GBeurier/nirs4all-io"
publish = false

[[bin]]
name = "emit-dagml"
path = "src/bin/emit_dagml.rs"

[dependencies]
nirs4all-io = { path = "../nirs4all-io" }
dag-ml-data.workspace = true
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
