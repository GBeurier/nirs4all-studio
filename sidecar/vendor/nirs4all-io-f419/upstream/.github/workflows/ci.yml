name: CI

on:
  push:
    branches: [main, 'rc/**']
  pull_request:

jobs:
  rust:
    name: Rust green gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build (no default features)
        run: cargo build --workspace --no-default-features

  python:
    name: Python green gate + contract goldens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        # The `dev` extra pulls the nirs4all / nirs4all-formats oracles, which
        # are not on PyPI; a clean runner only has this repo. Install the
        # available runtime + data extras + tooling, and skip the parity oracle
        # (the only `parity`/`formats`-marked tests; `importorskip`-guarded too).
        run: pip install -e ".[parquet,excel]" scipy pytest ruff mypy
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy .
      - name: Pytest (incl. canonical + contract goldens)
        run: pytest -m "not parity"
