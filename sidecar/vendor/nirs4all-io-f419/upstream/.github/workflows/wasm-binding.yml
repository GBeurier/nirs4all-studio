name: WASM binding
on:
  push:
    branches: [main, 'rc/**']
  pull_request:
    branches: [main, 'rc/**']
  workflow_dispatch: {}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build (nodejs target)
        run: wasm-pack build bindings/wasm --target nodejs --out-dir pkg
      - name: Node smoke
        run: node bindings/wasm/tests/node_smoke.cjs
