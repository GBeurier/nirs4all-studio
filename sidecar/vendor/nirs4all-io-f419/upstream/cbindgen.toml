language = "C"
header = """/*
 * nirs4all-io C ABI header (symbol prefix n4io_).
 *
 * Generated by cbindgen; do not edit by hand. Refresh with:
 *   cargo build -p nirs4all-io-capi
 *
 * The committed copy under crates/nirs4all-io-capi/include/nirs4all_io.h
 * mirrors the latest build so downstream packagers can pin the header
 * without running cargo.
 *
 * SPDX-License-Identifier: CeCILL-2.1 OR AGPL-3.0-or-later
 */"""
include_guard = "NIRS4ALL_IO_H"
autogen_warning = "/* This file is auto-generated by cbindgen. */"
include_version = true
documentation = true
documentation_style = "c99"
trailer = ""

[parse]
parse_deps = false
clean = false

[export]
item_types = ["constants", "functions", "structs", "enums", "opaque", "typedefs"]

[defines]
"target_family = unix" = "N4IO_UNIX"
"target_family = windows" = "N4IO_WINDOWS"

[fn]
args = "vertical"

[struct]
derive_eq = false
