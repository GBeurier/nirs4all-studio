name: Provide nirs4all-ui sibling
description: >-
  Clones GBeurier/nirs4all-ui next to the workspace so the package.json
  `file:../nirs4all-ui` dependency and the `../nirs4all-ui/src` tsconfig/vite
  aliases resolve on CI runners the same way they do in the sibling-checkout
  dev layout. Requires the branch matching the current ref when a ref is known,
  so RC branches cannot silently validate against nirs4all-ui@main.
runs:
  using: composite
  steps:
    - name: Clone nirs4all-ui next to the workspace
      shell: bash
      run: |
        sibling="$GITHUB_WORKSPACE/../nirs4all-ui"
        rm -rf "$sibling"
        git clone --depth 1 https://github.com/GBeurier/nirs4all-ui.git "$sibling"
        ref="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
        if [ -n "$ref" ]; then
          git -C "$sibling" fetch --depth 1 origin "$ref" || {
            echo "nirs4all-ui sibling: missing required ref '$ref' upstream" >&2
            exit 1
          }
          git -C "$sibling" checkout --detach FETCH_HEAD
          echo "nirs4all-ui sibling: using ref $ref @ $(git -C "$sibling" rev-parse HEAD)"
        else
          echo "nirs4all-ui sibling: no GitHub ref provided; using default branch @ $(git -C "$sibling" rev-parse HEAD)"
        fi
