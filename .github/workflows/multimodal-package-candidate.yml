name: Multimodal package candidate (nonpublishing)

# Build the three Python candidates from immutable source commits, then bake
# them into a disposable Studio checkout. Production pins on main stay stable.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/multimodal-package-candidate.yml
      - scripts/prepare-multimodal-package-candidate.cjs
      - scripts/verify-packaged-plugin-identity.cjs
      - scripts/verify-installed-candidate-wheels.py
      - scripts/qualify-installer.cjs
      - scripts/candidate_wheel_manifest.py
      - scripts/test_candidate_wheel_manifest.py
      - scripts/smoke-multimodal-ui.cjs
      - scripts/fixtures/multimodal-ui/**

permissions:
  contents: read

concurrency:
  group: multimodal-package-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-package:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: GBeurier/nirs4all
          ref: 22902524078669c99eb5b9070a0498c058fc3cc3
          path: candidate-nirs
      - uses: actions/checkout@v4
        with:
          repository: GBeurier/nirs4all-io
          ref: 5a887788089568955e7011ad0036264dd3f6e979
          path: candidate-io
      - uses: actions/checkout@v4
        with:
          repository: GBeurier/dag-ml
          ref: 9d7273a718aff7c1e511dc8708b13e7bfe8f5613
          path: candidate-dag
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Install product build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev gir1.2-gtk-3.0 gir1.2-webkit2-4.1 upx-ucl xvfb
          npm ci
          python -m pip install setuptools==84.0.0 wheel==0.48.0 packaging==26.3 build==1.6.1 maturin==1.14.1
      - name: Build exact candidate wheels
        shell: bash
        run: |
          mkdir candidate-wheels
          cd candidate-nirs
          python -m build --wheel --no-isolation --outdir ../candidate-wheels
          cd ../candidate-io
          python -m maturin build --locked --release -m bindings/python/Cargo.toml --interpreter python --out ../candidate-wheels
          cd ../candidate-dag
          python scripts/prepare_python_candidate.py
          python scripts/validate_release_metadata.py
          python -m maturin build --locked --release -m crates/dag-ml-py/Cargo.toml --interpreter python --out ../candidate-wheels
      - name: Prepare disposable Studio version and exact plugin pins
        shell: bash
        run: |
          python -m unittest discover -s scripts -p 'test_candidate_wheel_manifest.py'
          test "$(git -C candidate-nirs rev-parse HEAD)" = 22902524078669c99eb5b9070a0498c058fc3cc3
          mapfile -t nirs_wheels < <(find candidate-wheels -maxdepth 1 -name 'nirs4all-*.whl' -print)
          mapfile -t dag_wheels < <(find candidate-wheels -maxdepth 1 -name 'dag_ml-*.whl' -print)
          mapfile -t io_wheels < <(find candidate-wheels -maxdepth 1 -name 'nirs4all_io-*.whl' -print)
          test "${#nirs_wheels[@]}" -eq 1
          test "${#dag_wheels[@]}" -eq 1
          test "${#io_wheels[@]}" -eq 1
          nirs_manifest="$(python scripts/candidate_wheel_manifest.py "${nirs_wheels[0]}")"
          node scripts/prepare-multimodal-package-candidate.cjs \
            --nirs-wheel "${nirs_wheels[0]}" \
            --nirs-source-commit 22902524078669c99eb5b9070a0498c058fc3cc3 \
            --nirs-installed-manifest-sha256 "$nirs_manifest" \
            --dag-version 0.3.31.dev0 --io-version 0.2.1.dev0 \
            --app-version 0.14.1-dev.0 | tee "$RUNNER_TEMP/candidate-pins.json"
          sha256sum "${nirs_wheels[0]}" "${dag_wheels[0]}" "${io_wheels[0]}" | tee "$RUNNER_TEMP/candidate-wheels.sha256"
          git -C candidate-dag rev-parse HEAD | tee "$RUNNER_TEMP/candidate-dag-commit.txt"
          git -C candidate-io rev-parse HEAD | tee "$RUNNER_TEMP/candidate-io-commit.txt"
      - name: Build exact native Methods runtime
        uses: ./.github/actions/build-native-methods
        with:
          platform: linux
          arch: x64
      - name: Bake candidate Python and native Rust runtime
        shell: bash
        env:
          PIP_FIND_LINKS: ${{ github.workspace }}/candidate-wheels
        run: |
          mapfile -t nirs_wheels < <(find candidate-wheels -maxdepth 1 -name 'nirs4all-*.whl' -print)
          mapfile -t dag_wheels < <(find candidate-wheels -maxdepth 1 -name 'dag_ml-*.whl' -print)
          mapfile -t io_wheels < <(find candidate-wheels -maxdepth 1 -name 'nirs4all_io-*.whl' -print)
          test "${#nirs_wheels[@]}" -eq 1
          test "${#dag_wheels[@]}" -eq 1
          test "${#io_wheels[@]}" -eq 1
          node scripts/bake-python-plugin-runtime.cjs --plugin-wheel "${nirs_wheels[0]}" --dag-wheel "${dag_wheels[0]}" --io-wheel "${io_wheels[0]}"
          python scripts/verify-installed-candidate-wheels.py backend-dist/python-runtime/python/lib/python3.11/site-packages "${nirs_wheels[0]}" "${dag_wheels[0]}" "${io_wheels[0]}"
          node scripts/build-native-sidecar.cjs --target x86_64-unknown-linux-gnu
          node scripts/native-runtime-contract.cjs --backend-root backend-dist --artifact-boundary-root backend-dist --platform linux --arch x64 --require-bundled-python-plugin --require-bundled-methods
      - name: Retain canonical pure-Python tools wheel for desktop candidates
        uses: actions/upload-artifact@v4
        with:
          name: multimodal-tools-wheel
          path: build/.python-cache/studio-python-tools-wheel/nirs4all_tools-*.whl
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - name: Build nonpublishing DEB
        run: |
          npm run build:electron
          npx electron-builder --config electron-builder.installer.yml --linux deb --publish never
      - name: Verify exact packaged plugin and first launch
        shell: bash
        timeout-minutes: 20
        run: |
          mapfile -t debs < <(find release -maxdepth 1 -name '*.deb' -print)
          test "${#debs[@]}" -eq 1
          mkdir -p "$RUNNER_TEMP/candidate-extracted"
          dpkg-deb -x "${debs[0]}" "$RUNNER_TEMP/candidate-extracted"
          candidate_root="$RUNNER_TEMP/candidate-extracted/opt/nirs4all Studio"
          test -f "$candidate_root/resources/app.asar"
          node scripts/verify-packaged-plugin-identity.cjs "$candidate_root/resources"
          node scripts/native-runtime-contract.cjs --backend-root "$candidate_root/resources/backend" --artifact-boundary-root "$candidate_root" --platform linux --arch x64 --require-bundled-python-plugin --require-bundled-methods
          env -u PYTHONPATH N4A_SMOKE_ROOT="$RUNNER_TEMP/multimodal-extracted" N4A_FULL_HPO_MATRIX=1 \
            "$candidate_root/resources/backend/python-runtime/python/bin/python3" -I -B \
            "$GITHUB_WORKSPACE/candidate-nirs/tests/qualification/installed_multimodal_provider.py"
          sudo chown root:root "$candidate_root/chrome-sandbox"
          sudo chmod 4755 "$candidate_root/chrome-sandbox"
          N4A_SMOKE_ELECTRON_NO_SANDBOX=1 xvfb-run -a node scripts/smoke-archive-standalone.cjs --extracted-root "$candidate_root" --platform linux
          xvfb-run -a node scripts/smoke-first-launch-ui.cjs --extracted-root "$candidate_root" --platform linux
          sha256sum "${debs[0]}" | tee "$RUNNER_TEMP/candidate-deb.sha256"
      - name: Install the actual candidate DEB and repeat first launch
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mapfile -t debs < <(find release -maxdepth 1 -name '*.deb' -print)
          test "${#debs[@]}" -eq 1
          candidate_version="$(dpkg-deb -f "${debs[0]}" Version)"
          dpkg --compare-versions "$candidate_version" gt 0.14.0
          sudo apt-get install -y "$(realpath "${debs[0]}")"
          package_name="$(dpkg-deb -f "${debs[0]}" Package)"
          test "$(dpkg-query -W -f='${Version}' "$package_name")" = "$candidate_version"
          installed_root='/opt/nirs4all Studio'
          test -x "$installed_root/nirs4all-webapp"
          node scripts/verify-packaged-plugin-identity.cjs "$installed_root/resources"
          node scripts/native-runtime-contract.cjs --backend-root "$installed_root/resources/backend" --artifact-boundary-root "$installed_root" --platform linux --arch x64 --require-bundled-python-plugin --require-bundled-methods
          env -u PYTHONPATH N4A_SMOKE_ROOT="$RUNNER_TEMP/multimodal-installed" N4A_FULL_HPO_MATRIX=1 \
            "$installed_root/resources/backend/python-runtime/python/bin/python3" -I -B \
            "$GITHUB_WORKSPACE/candidate-nirs/tests/qualification/installed_multimodal_provider.py"
          N4A_SMOKE_ELECTRON_NO_SANDBOX=1 xvfb-run -a node scripts/smoke-archive-standalone.cjs --extracted-root "$installed_root" --platform linux --timeout-ms 360000
          xvfb-run -a node scripts/smoke-first-launch-ui.cjs --extracted-root "$installed_root" --platform linux --timeout-ms 360000
      - name: Qualify four-source import, run, archive and replay in installed UI
        timeout-minutes: 20
        run: |
          xvfb-run -a node scripts/smoke-multimodal-ui.cjs \
            --extracted-root '/opt/nirs4all Studio' --platform linux --timeout-ms 360000
      - name: Resolve the latest public Linux installer for upgrade qualification
        id: baseline
        uses: actions/github-script@v7
        with:
          script: |
            const { installerBaselines } = require('./scripts/installer-baselines.cjs');
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            const baseline = installerBaselines(releases, '0.14.1-dev.0')['linux-x64'];
            if (!baseline) throw new Error('No public Linux installer to test the upgrade');
            core.setOutput('plan', JSON.stringify(baseline));
            core.setOutput('version', baseline.version);
      - name: Qualify populated upgrade from the public Linux installer
        shell: bash
        timeout-minutes: 45
        env:
          INSTALLER_BASELINE: ${{ steps.baseline.outputs.plan }}
          BASELINE_VERSION: ${{ steps.baseline.outputs.version }}
          BASELINE_GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mapfile -t debs < <(find release -maxdepth 1 -name '*.deb' -print)
          test "${#debs[@]}" -eq 1
          sha256sum "${debs[0]}" > "${debs[0]}.sha256"
          xvfb-run -a node scripts/qualify-installer.cjs \
            --installer "${debs[0]}" --platform linux \
            --previous-version "$BASELINE_VERSION" \
            --output "$RUNNER_TEMP/multimodal-installer-upgrade-proof.json"
      - name: Retain nonpublishing candidate and identity proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: multimodal-linux-deb-candidate
          path: |
            release/*.deb
            ${{ runner.temp }}/candidate-pins.json
            ${{ runner.temp }}/candidate-wheels.sha256
            ${{ runner.temp }}/candidate-dag-commit.txt
            ${{ runner.temp }}/candidate-io-commit.txt
            ${{ runner.temp }}/candidate-deb.sha256
            ${{ runner.temp }}/multimodal-installer-upgrade-proof.json
          retention-days: 7

  desktop-package:
    name: Candidate installer — ${{ matrix.label }}
    needs: linux-package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-2022
            platform: win32
            arch: x64
            target: x86_64-pc-windows-msvc
            builder: win
            extension: exe
            baseline: windows-x64
            site_packages: backend-dist/python-runtime/python/Lib/site-packages
            packaged_site_packages: python-runtime/python/Lib/site-packages
            python_host: backend-dist/python-runtime/python/python.exe
          - label: macOS x64
            runner: macos-15-intel
            platform: darwin
            arch: x64
            target: x86_64-apple-darwin
            builder: mac
            extension: dmg
            baseline: macos-x64
            site_packages: backend-dist/python-runtime/python/lib/python3.11/site-packages
            packaged_site_packages: python-runtime/python/lib/python3.11/site-packages
            python_host: backend-dist/python-runtime/python/bin/python3
          - label: macOS arm64
            runner: macos-14
            platform: darwin
            arch: arm64
            target: aarch64-apple-darwin
            builder: mac
            extension: dmg
            baseline: macos-arm64
            site_packages: backend-dist/python-runtime/python/lib/python3.11/site-packages
            packaged_site_packages: python-runtime/python/lib/python3.11/site-packages
            python_host: backend-dist/python-runtime/python/bin/python3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: GBeurier/nirs4all
          ref: 22902524078669c99eb5b9070a0498c058fc3cc3
          path: candidate-nirs
      - uses: actions/checkout@v4
        with:
          repository: GBeurier/nirs4all-io
          ref: 5a887788089568955e7011ad0036264dd3f6e979
          path: candidate-io
      - uses: actions/checkout@v4
        with:
          repository: GBeurier/dag-ml
          ref: 9d7273a718aff7c1e511dc8708b13e7bfe8f5613
          path: candidate-dag
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install build dependencies
        shell: bash
        run: |
          npm ci
          python -m pip install setuptools==84.0.0 wheel==0.48.0 packaging==26.3 build==1.6.1 maturin==1.14.1
      - name: Retrieve canonical tools wheel
        uses: actions/download-artifact@v4
        with:
          name: multimodal-tools-wheel
          path: candidate-tools-wheel
      - name: Build exact native candidate wheels
        shell: bash
        run: |
          set -euo pipefail
          mkdir candidate-wheels
          cd candidate-nirs
          python -m build --wheel --no-isolation --outdir ../candidate-wheels
          cd ../candidate-io
          python -m maturin build --locked --release -m bindings/python/Cargo.toml --interpreter python --out ../candidate-wheels
          cd ../candidate-dag
          python scripts/prepare_python_candidate.py
          python scripts/validate_release_metadata.py
          python -m maturin build --locked --release -m crates/dag-ml-py/Cargo.toml --interpreter python --out ../candidate-wheels
      - name: Prepare disposable candidate version and verify wheel identity
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts -p 'test_candidate_wheel_manifest.py'
          python -m unittest discover -s scripts -p 'test_verify_installed_candidate_wheels.py'
          test "$(git -C candidate-nirs rev-parse HEAD)" = 22902524078669c99eb5b9070a0498c058fc3cc3
          shopt -s nullglob
          nirs_wheels=(candidate-wheels/nirs4all-*.whl)
          dag_wheels=(candidate-wheels/dag_ml-*.whl)
          io_wheels=(candidate-wheels/nirs4all_io-*.whl)
          test "${#nirs_wheels[@]}" -eq 1
          test "${#dag_wheels[@]}" -eq 1
          test "${#io_wheels[@]}" -eq 1
          nirs_manifest="$(python scripts/candidate_wheel_manifest.py "${nirs_wheels[0]}")"
          node scripts/prepare-multimodal-package-candidate.cjs \
            --nirs-wheel "${nirs_wheels[0]}" \
            --nirs-source-commit 22902524078669c99eb5b9070a0498c058fc3cc3 \
            --nirs-installed-manifest-sha256 "$nirs_manifest" \
            --dag-version 0.3.31.dev0 --io-version 0.2.1.dev0 \
            --app-version 0.14.1-dev.0
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for wheel in sorted(Path('candidate-wheels').glob('*.whl')):
              print(hashlib.sha256(wheel.read_bytes()).hexdigest(), wheel)
          PY
      - name: Build exact native Methods runtime
        uses: ./.github/actions/build-native-methods
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
      - name: Bake and verify candidate runtime
        shell: bash
        env:
          PIP_FIND_LINKS: ${{ github.workspace }}/candidate-wheels
        run: |
          set -euo pipefail
          shopt -s nullglob
          nirs_wheels=(candidate-wheels/nirs4all-*.whl)
          dag_wheels=(candidate-wheels/dag_ml-*.whl)
          io_wheels=(candidate-wheels/nirs4all_io-*.whl)
          tools_wheels=(candidate-tools-wheel/nirs4all_tools-*.whl)
          test "${#nirs_wheels[@]}" -eq 1
          test "${#dag_wheels[@]}" -eq 1
          test "${#io_wheels[@]}" -eq 1
          test "${#tools_wheels[@]}" -eq 1
          node scripts/bake-python-plugin-runtime.cjs --plugin-wheel "${nirs_wheels[0]}" --dag-wheel "${dag_wheels[0]}" --io-wheel "${io_wheels[0]}" --tools-wheel "${tools_wheels[0]}"
          python scripts/verify-installed-candidate-wheels.py "${{ matrix.site_packages }}" "${nirs_wheels[0]}" "${dag_wheels[0]}" "${io_wheels[0]}"
          node scripts/build-native-sidecar.cjs --target "${{ matrix.target }}"
          node scripts/native-runtime-contract.cjs --backend-root backend-dist --artifact-boundary-root backend-dist --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" --require-bundled-python-plugin --require-bundled-methods
          N4A_SMOKE_ROOT="$RUNNER_TEMP/multimodal-${{ matrix.baseline }}" N4A_FULL_HPO_MATRIX=1 \
            "${{ matrix.python_host }}" -I -B \
            "$GITHUB_WORKSPACE/candidate-nirs/tests/qualification/installed_multimodal_provider.py"
      - name: Build nonpublishing installer
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          npm run build:electron
          npx electron-builder --config electron-builder.installer.yml --${{ matrix.builder }} --publish never
      - name: Verify exact packaged wheel bytes and native identities
        shell: bash
        run: |
          set -euo pipefail
          marker="$(python -c 'from pathlib import Path; paths = list(Path("release").rglob("PLUGIN_RUNTIME_READY.json")); assert len(paths) == 1, paths; print(paths[0].as_posix())')"
          resources="$(dirname "$(dirname "$(dirname "$marker")")")"
          test -f "$resources/app.asar"
          node scripts/verify-packaged-plugin-identity.cjs "$resources"
          node scripts/native-runtime-contract.cjs \
            --backend-root "$resources/backend" --artifact-boundary-root "$(dirname "$resources")" \
            --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" \
            --require-bundled-python-plugin --require-bundled-methods
          shopt -s nullglob
          nirs_wheels=(candidate-wheels/nirs4all-*.whl)
          dag_wheels=(candidate-wheels/dag_ml-*.whl)
          io_wheels=(candidate-wheels/nirs4all_io-*.whl)
          test "${#nirs_wheels[@]}" -eq 1
          test "${#dag_wheels[@]}" -eq 1
          test "${#io_wheels[@]}" -eq 1
          if [ "${{ matrix.platform }}" = darwin ] && [ -f "$resources/backend/native/macos-signing-attestation.json" ]; then
            python scripts/verify-installed-candidate-wheels.py \
              --macos-signing-attestation "$resources/backend/native/macos-signing-attestation.json" \
              "$resources/backend/${{ matrix.packaged_site_packages }}" \
              "${nirs_wheels[0]}" "${dag_wheels[0]}" "${io_wheels[0]}"
          elif [ "${{ matrix.arch }}" = arm64 ]; then
            echo 'macOS arm64 candidate is missing its native signing attestation' >&2
            exit 1
          else
            python scripts/verify-installed-candidate-wheels.py \
              "$resources/backend/${{ matrix.packaged_site_packages }}" \
              "${nirs_wheels[0]}" "${dag_wheels[0]}" "${io_wheels[0]}"
          fi
          host_python="${{ matrix.python_host }}"
          packaged_python="$resources/backend/${host_python#backend-dist/}"
          N4A_SMOKE_ROOT="$RUNNER_TEMP/multimodal-packaged-${{ matrix.baseline }}" N4A_FULL_HPO_MATRIX=1 \
            "$packaged_python" -I -B \
            "$GITHUB_WORKSPACE/candidate-nirs/tests/qualification/installed_multimodal_provider.py"
      - name: Resolve public installer for populated upgrade
        id: baseline
        uses: actions/github-script@v7
        env:
          BASELINE_PLATFORM: ${{ matrix.baseline }}
        with:
          script: |
            const { installerBaselines } = require('./scripts/installer-baselines.cjs');
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            const baseline = installerBaselines(releases, '0.14.1-dev.0')[process.env.BASELINE_PLATFORM];
            if (!baseline) throw new Error(`No public ${process.env.BASELINE_PLATFORM} installer to test the upgrade`);
            core.setOutput('plan', JSON.stringify(baseline));
            core.setOutput('version', baseline.version);
      - name: Install exact candidate and qualify populated upgrade and user journeys
        shell: bash
        timeout-minutes: 45
        env:
          INSTALLER_BASELINE: ${{ steps.baseline.outputs.plan }}
          BASELINE_VERSION: ${{ steps.baseline.outputs.version }}
          BASELINE_GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(release/*.${{ matrix.extension }})
          test "${#installers[@]}" -eq 1
          python - "${installers[0]}" <<'PY'
          import hashlib
          from pathlib import Path
          import sys
          installer = Path(sys.argv[1])
          digest = hashlib.sha256(installer.read_bytes()).hexdigest()
          Path(f'{installer}.sha256').write_text(f'{digest}  {installer.name}\n', encoding='ascii')
          PY
          node scripts/qualify-installer.cjs \
            --installer "${installers[0]}" --platform "${{ matrix.platform }}" \
            --previous-version "$BASELINE_VERSION" \
            --multimodal-provider-script "$GITHUB_WORKSPACE/candidate-nirs/tests/qualification/installed_multimodal_provider.py" \
            --output "$RUNNER_TEMP/multimodal-installer-upgrade-proof.json"
      - name: Retain nonpublishing candidate and product proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multimodal-${{ matrix.baseline }}-candidate
          path: |
            release/*.${{ matrix.extension }}
            release/*.sha256
            ${{ runner.temp }}/multimodal-installer-upgrade-proof.json
          if-no-files-found: warn
          retention-days: 7
