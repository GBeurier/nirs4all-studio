name: Multimodal package candidate (nonpublishing)

# Manual qualification of unpublished Python candidates inside the real
# product, before their publication and before Studio pins them.
#
# The lane builds candidate wheels of nirs4all, nirs4all-io and dag-ml from
# immutable source commits, then makes a disposable Studio checkout ship them
# the way the product ships its required packages:
#   - scripts/prepare-multimodal-package-candidate.cjs selects each candidate
#     in recommended-config.json (`required`, `install`) and in the target's
#     wheel lock (file name and SHA-256), and copies it to backend-dist/wheels/;
#   - scripts/build-wheelhouse.cjs keeps a staged wheel only when its SHA-256
#     is the locked one and downloads the other required wheels;
#   - the installer is built from the current build inputs and its runtime
#     contract is verified with the Python payload.
# An environment made from the shipped payload must then hold the exact
# candidate files and pass the candidate SDK's installed provider
# qualification. Finally the application creates its environment itself on a
# fresh profile, installing the candidates from its shipped `wheels/`, and the
# multimodal journey (four-source import, run, archive, replay) runs in its
# renderer; that environment is checked for the exact candidate files too.
#
# Windows and Linux only: a macOS application embeds no wheels and installs
# its required packages from the package index, so it cannot ship an
# unpublished candidate.
#
# Nothing is published: no release, no tag, no registry. Installers and
# identity files are kept as workflow artifacts for seven days. Release
# qualification and publication use release-unified.yml.
on:
  workflow_dispatch:
    inputs:
      nirs4all_ref:
        description: 'nirs4all commit (40-character SHA) of the candidate SDK. Empty: the commit of the published cohort (build/runtime-cohort.json)'
        required: false
        default: ''
        type: string
      nirs4all_io_ref:
        description: 'nirs4all-io commit (40-character SHA) of the candidate. Empty: the commit of the published cohort'
        required: false
        default: ''
        type: string
      dag_ml_ref:
        description: 'dag-ml commit (40-character SHA) of the candidate. Empty: the commit of the published cohort'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: multimodal-package-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-sources:
    name: Candidate sources and SDK wheel
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      nirs4all_ref: ${{ steps.sources.outputs.nirs4all_ref }}
      nirs4all_io_ref: ${{ steps.sources.outputs.nirs4all_io_ref }}
      dag_ml_ref: ${{ steps.sources.outputs.dag_ml_ref }}
      app_version: ${{ steps.sources.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve candidate sources and the disposable app version
        id: sources
        shell: bash
        env:
          NIRS4ALL_REF: ${{ inputs.nirs4all_ref }}
          NIRS4ALL_IO_REF: ${{ inputs.nirs4all_io_ref }}
          DAG_ML_REF: ${{ inputs.dag_ml_ref }}
        run: |
          set -euo pipefail
          # An empty input selects the source commit of the published cohort member.
          resolve() {
            local ref="${1:-$(node -p "require('./build/runtime-cohort.json').$2.source_sha")}"
            if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Candidate sources must be immutable 40-character commit SHAs, got '$ref'" >&2
              return 1
            fi
            echo "$ref"
          }
          nirs4all_ref="$(resolve "$NIRS4ALL_REF" sdk)"
          nirs4all_io_ref="$(resolve "$NIRS4ALL_IO_REF" io)"
          dag_ml_ref="$(resolve "$DAG_ML_REF" dag)"
          app_version="$(node -p "require('./package.json').version")-dev.0"
          {
            echo "nirs4all_ref=$nirs4all_ref"
            echo "nirs4all_io_ref=$nirs4all_io_ref"
            echo "dag_ml_ref=$dag_ml_ref"
            echo "app_version=$app_version"
          } | tee -a "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: GBeurier/nirs4all
          ref: ${{ steps.sources.outputs.nirs4all_ref }}
          path: candidate-nirs
      - name: Build the candidate SDK wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install setuptools==84.0.0 wheel==0.48.0 packaging==26.3 build==1.6.1
          cd candidate-nirs
          python -m build --wheel --no-isolation --outdir ../candidate-wheels
      - name: Retain canonical nirs4all wheel for the candidate installers
        uses: actions/upload-artifact@v4
        with:
          name: multimodal-nirs-wheel
          path: candidate-wheels/nirs4all-*.whl
          if-no-files-found: error
          retention-days: 7

  linux-package:
    name: Candidate installer — Linux x64
    needs: candidate-sources
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: GBeurier/nirs4all
          ref: ${{ needs.candidate-sources.outputs.nirs4all_ref }}
          path: candidate-nirs
      - uses: actions/checkout@v4
        with:
          repository: GBeurier/nirs4all-io
          ref: ${{ needs.candidate-sources.outputs.nirs4all_io_ref }}
          path: candidate-io
      - uses: actions/checkout@v4
        with:
          repository: GBeurier/dag-ml
          ref: ${{ needs.candidate-sources.outputs.dag_ml_ref }}
          path: candidate-dag
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Install product build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev gir1.2-gtk-3.0 gir1.2-webkit2-4.1 xvfb
          npm ci
          python -m pip install setuptools==84.0.0 wheel==0.48.0 packaging==26.3 build==1.6.1 maturin==1.14.1
      - name: Retrieve canonical nirs4all wheel
        uses: actions/download-artifact@v4
        with:
          name: multimodal-nirs-wheel
          path: candidate-wheels
      - name: Build exact native candidate wheels
        shell: bash
        run: |
          set -euo pipefail
          cd candidate-io
          python -m maturin build --locked --release -m bindings/python/Cargo.toml --interpreter python --out ../candidate-wheels
          cd ../candidate-dag
          python scripts/prepare_python_candidate.py
          python scripts/validate_release_metadata.py
          python -m maturin build --locked --release -m crates/dag-ml-py/Cargo.toml --interpreter python --out ../candidate-wheels
      - name: Select the candidates in the disposable Studio checkout
        shell: bash
        env:
          APP_VERSION: ${{ needs.candidate-sources.outputs.app_version }}
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts -p 'test_verify_installed_candidate_wheels.py'
          shopt -s nullglob
          wheels=(candidate-wheels/nirs4all-*.whl candidate-wheels/nirs4all_io-*.whl candidate-wheels/dag_ml-*.whl)
          test "${#wheels[@]}" -eq 3
          node scripts/prepare-multimodal-package-candidate.cjs \
            --wheel "${wheels[0]}" --wheel "${wheels[1]}" --wheel "${wheels[2]}" \
            --app-version "$APP_VERSION" | tee "$RUNNER_TEMP/candidate-pins.json"
          sha256sum "${wheels[@]}" | tee "$RUNNER_TEMP/candidate-wheels.sha256"
          for source in candidate-nirs candidate-io candidate-dag; do
            echo "$source $(git -C "$source" rev-parse HEAD)"
          done | tee "$RUNNER_TEMP/candidate-sources.txt"
      - name: Build exact native Methods runtime
        uses: ./.github/actions/build-native-methods
        with:
          platform: linux
          arch: x64
      # Installers ship no Python: uv, the wheels of the required packages
      # (here with the candidates) and the document adapters let Studio create
      # the user's environment.
      - name: Stage uv, required wheels and document adapters
        run: |
          node scripts/fetch-uv.cjs
          node scripts/build-wheelhouse.cjs
          node scripts/studio-document-adapters.cjs --install backend-dist/adapters
      - name: Build and smoke native sidecar
        run: |
          node scripts/build-native-sidecar.cjs --target x86_64-unknown-linux-gnu
          test -x backend-dist/native/studio-sidecar
          node scripts/native-runtime-contract.cjs --backend-root backend-dist --artifact-boundary-root backend-dist --platform linux --arch x64 --require-python-payload --require-bundled-methods
          backend-dist/native/studio-sidecar --smoke-readiness
      - name: Build nonpublishing DEB
        run: |
          npm run build:electron
          npx electron-builder --config electron-builder.installer.yml --linux deb --publish never
      - name: Install the candidate DEB and verify its exact payload
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(release/*.deb)
          test "${#debs[@]}" -eq 1
          sha256sum "${debs[0]}" | tee "$RUNNER_TEMP/candidate-deb.sha256"
          sudo apt-get install -y "$(realpath "${debs[0]}")"
          installed_root='/opt/nirs4all Studio'
          test -x "$installed_root/nirs4all-webapp"
          node scripts/native-runtime-contract.cjs --backend-root "$installed_root/resources/backend" --artifact-boundary-root "$installed_root" --platform linux --arch x64 --require-python-payload --require-bundled-methods
          for wheel in candidate-wheels/*.whl; do
            cmp "$wheel" "$installed_root/resources/backend/wheels/$(basename "$wheel")"
          done
      # Payload: a script creates an environment with the shipped uv from the
      # shipped wheels and the installed application starts on it. That
      # environment must hold the exact candidate files and pass the candidate
      # SDK's provider qualification.
      - name: Smoke the installed payload and qualify the multimodal provider
        shell: bash
        timeout-minutes: 45
        run: |
          set -euo pipefail
          N4A_SMOKE_ELECTRON_NO_SANDBOX=1 xvfb-run -a node scripts/smoke-archive-standalone.cjs \
            --extracted-root '/opt/nirs4all Studio' --platform linux --timeout-ms 360000 \
            --sandbox-root "$RUNNER_TEMP/mm-payload"
          environment="$RUNNER_TEMP/mm-payload/electron-user-data/python-env/venv"
          python scripts/verify-installed-candidate-wheels.py "$environment/lib/python3.11/site-packages" candidate-wheels/*.whl
          env -u PYTHONPATH N4A_SMOKE_ROOT="$RUNNER_TEMP/mm-provider" N4A_FULL_HPO_MATRIX=1 \
            "$environment/bin/python" -I -B \
            "$GITHUB_WORKSPACE/candidate-nirs/tests/qualification/installed_multimodal_provider.py"
      # Application: on a fresh profile Studio opens its setup page and creates
      # the environment itself, then the multimodal journey runs in its renderer.
      - name: Qualify four-source import, run, archive and replay in installed UI
        id: journey
        timeout-minutes: 60
        env:
          NIRS4ALL_QUALIFICATION_PERFORMANCE_POLICY: github-observational
        run: |
          xvfb-run -a node scripts/smoke-multimodal-ui.cjs \
            --extracted-root '/opt/nirs4all Studio' --platform linux --timeout-ms 360000 \
            --sandbox-root "$RUNNER_TEMP/mm-ui"
      # Independent of the journey's outcome: which files did the application install?
      - name: Verify the exact candidate files in the environment Studio created
        if: ${{ !cancelled() && steps.journey.outcome != 'skipped' }}
        run: |
          python scripts/verify-installed-candidate-wheels.py \
            "$RUNNER_TEMP/mm-ui/electron-user-data/python-env/venv/lib/python3.11/site-packages" candidate-wheels/*.whl
      - name: Retain nonpublishing candidate and identity proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: multimodal-linux-deb-candidate
          path: |
            release/*.deb
            ${{ runner.temp }}/candidate-pins.json
            ${{ runner.temp }}/candidate-wheels.sha256
            ${{ runner.temp }}/candidate-sources.txt
            ${{ runner.temp }}/candidate-deb.sha256
          retention-days: 7

  windows-package:
    name: Candidate installer — Windows x64
    needs: candidate-sources
    # Methods' release preset is intentionally bound to VS 17 / 2022.
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      # dag-ml fixtures exceed the 260-character path limit below this
      # workspace, and its release metadata check hashes source files: the
      # candidates are built from their exact bytes, without CRLF conversion.
      - name: Check out long paths and exact source bytes
        run: |
          git config --system core.longpaths true
          git config --system core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: GBeurier/nirs4all
          ref: ${{ needs.candidate-sources.outputs.nirs4all_ref }}
          path: candidate-nirs
      - uses: actions/checkout@v4
        with:
          repository: GBeurier/nirs4all-io
          ref: ${{ needs.candidate-sources.outputs.nirs4all_io_ref }}
          path: candidate-io
      - uses: actions/checkout@v4
        with:
          repository: GBeurier/dag-ml
          ref: ${{ needs.candidate-sources.outputs.dag_ml_ref }}
          path: candidate-dag
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install build dependencies
        run: |
          npm ci
          python -m pip install setuptools==84.0.0 wheel==0.48.0 packaging==26.3 build==1.6.1 maturin==1.14.1
      - name: Retrieve canonical nirs4all wheel
        uses: actions/download-artifact@v4
        with:
          name: multimodal-nirs-wheel
          path: candidate-wheels
      - name: Build exact native candidate wheels
        run: |
          set -euo pipefail
          cd candidate-io
          python -m maturin build --locked --release -m bindings/python/Cargo.toml --interpreter python --out ../candidate-wheels
          cd ../candidate-dag
          python scripts/prepare_python_candidate.py
          python scripts/validate_release_metadata.py
          python -m maturin build --locked --release -m crates/dag-ml-py/Cargo.toml --interpreter python --out ../candidate-wheels
      - name: Select the candidates in the disposable Studio checkout
        env:
          APP_VERSION: ${{ needs.candidate-sources.outputs.app_version }}
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts -p 'test_verify_installed_candidate_wheels.py'
          shopt -s nullglob
          wheels=(candidate-wheels/nirs4all-*.whl candidate-wheels/nirs4all_io-*.whl candidate-wheels/dag_ml-*.whl)
          test "${#wheels[@]}" -eq 3
          temp="$(cygpath -m "$RUNNER_TEMP")"
          node scripts/prepare-multimodal-package-candidate.cjs \
            --wheel "${wheels[0]}" --wheel "${wheels[1]}" --wheel "${wheels[2]}" \
            --app-version "$APP_VERSION" | tee "$temp/candidate-pins.json"
          sha256sum "${wheels[@]}" | tee "$temp/candidate-wheels.sha256"
      - name: Build exact native Methods runtime
        uses: ./.github/actions/build-native-methods
        with:
          platform: win32
          arch: x64
      # Installers ship no Python: uv, the wheels of the required packages
      # (here with the candidates) and the document adapters let Studio create
      # the user's environment.
      - name: Stage uv, required wheels and document adapters
        run: |
          set -euo pipefail
          node scripts/fetch-uv.cjs
          node scripts/build-wheelhouse.cjs
          node scripts/studio-document-adapters.cjs --install backend-dist/adapters
      - name: Build and smoke native sidecar
        run: |
          set -euo pipefail
          node scripts/build-native-sidecar.cjs --target x86_64-pc-windows-msvc
          node scripts/native-runtime-contract.cjs --backend-root backend-dist --artifact-boundary-root backend-dist --platform win32 --arch x64 --require-python-payload --require-bundled-methods
          backend-dist/native/studio-sidecar.exe --smoke-readiness
      - name: Build nonpublishing installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          npm run build:electron
          npx electron-builder --config electron-builder.installer.yml --win --publish never
      - name: Verify the exact packaged payload
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(release/*.exe)
          test "${#installers[@]}" -eq 1
          sha256sum "${installers[0]}" | tee "$(cygpath -m "$RUNNER_TEMP")/candidate-installer.sha256"
          node scripts/native-runtime-contract.cjs --backend-root release/win-unpacked/resources/backend --artifact-boundary-root release/win-unpacked --platform win32 --arch x64 --require-python-payload --require-bundled-methods
          for wheel in candidate-wheels/*.whl; do
            cmp "$wheel" "release/win-unpacked/resources/backend/wheels/$(basename "$wheel")"
          done
      # Payload: a script creates an environment with the shipped uv from the
      # shipped wheels and the packaged application starts on it. That
      # environment must hold the exact candidate files and pass the candidate
      # SDK's provider qualification.
      - name: Smoke the packaged payload and qualify the multimodal provider
        timeout-minutes: 45
        run: |
          set -euo pipefail
          temp="$(cygpath -m "$RUNNER_TEMP")"
          node scripts/smoke-archive-standalone.cjs \
            --extracted-root release/win-unpacked --platform win32 --timeout-ms 360000 \
            --sandbox-root "$temp/mm-payload"
          environment="$temp/mm-payload/electron-user-data/python-env/venv"
          python scripts/verify-installed-candidate-wheels.py "$environment/Lib/site-packages" candidate-wheels/*.whl
          env -u PYTHONPATH N4A_SMOKE_ROOT="$temp/mm-provider" N4A_FULL_HPO_MATRIX=1 \
            "$environment/Scripts/python.exe" -I -B \
            "$GITHUB_WORKSPACE/candidate-nirs/tests/qualification/installed_multimodal_provider.py"
      # Application: on a fresh profile Studio opens its setup page and creates
      # the environment itself, then the multimodal journey runs in its renderer.
      - name: Qualify four-source import, run, archive and replay in packaged UI
        id: journey
        timeout-minutes: 60
        env:
          NIRS4ALL_QUALIFICATION_PERFORMANCE_POLICY: github-observational
        run: |
          node scripts/smoke-multimodal-ui.cjs \
            --extracted-root release/win-unpacked --platform win32 --timeout-ms 360000 \
            --sandbox-root "$(cygpath -m "$RUNNER_TEMP")/mm-ui"
      # Independent of the journey's outcome: which files did the application install?
      - name: Verify the exact candidate files in the environment Studio created
        if: ${{ !cancelled() && steps.journey.outcome != 'skipped' }}
        run: |
          python scripts/verify-installed-candidate-wheels.py \
            "$(cygpath -m "$RUNNER_TEMP")/mm-ui/electron-user-data/python-env/venv/Lib/site-packages" candidate-wheels/*.whl
      - name: Retain nonpublishing candidate and identity proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: multimodal-windows-x64-candidate
          path: |
            release/*.exe
            ${{ runner.temp }}/candidate-pins.json
            ${{ runner.temp }}/candidate-wheels.sha256
            ${{ runner.temp }}/candidate-installer.sha256
          retention-days: 7
