name: version-guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Ensure package version does not regress latest semver tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          # GNU version sort orders "~" before a release, so map the semver
          # prerelease separator to it: 0.15.8-rc.2 < 0.15.8.
          latest_tag="$(git tag --list '[0-9]*' | sed 's/-/~/' | sort -V | tail -n 1 | sed 's/~/-/' || true)"
          if [[ -z "$latest_tag" ]]; then
            echo "No numeric semver tags found; package version is $version."
            exit 0
          fi
          greatest="$(printf '%s\n%s\n' "${latest_tag/-/\~}" "${version/-/\~}" | sort -V | tail -n 1)"
          if [[ "$greatest" != "${version/-/\~}" ]]; then
            echo "::error::package.json version ($version) is older than latest release tag ($latest_tag)."
            exit 1
          fi
          echo "package.json version $version is coherent with latest release tag $latest_tag."
