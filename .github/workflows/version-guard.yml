name: version-guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate package version against latest semver tag
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          latest_tag="$(git tag --list '[0-9]*' --sort=-v:refname | head -n 1 || true)"
          if [[ -z "$latest_tag" ]]; then
            echo "No numeric semver tags found; package version is $version."
            exit 0
          fi
          if [[ "$version" == "$latest_tag" ]]; then
            echo "package.json version matches $latest_tag."
            exit 0
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]] && node - "$version" "$latest_tag" <<'NODE'
          const [candidate, released] = process.argv.slice(2);
          const parse = (value) => {
            const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(value);
            if (!match) process.exit(2);
            return match.slice(1).map(Number);
          };
          const left = parse(candidate);
          const right = parse(released);
          for (let i = 0; i < 3; i += 1) {
            if (left[i] > right[i]) process.exit(0);
            if (left[i] < right[i]) process.exit(1);
          }
          process.exit(1);
          NODE
          then
            echo "Release preparation version $version is newer than $latest_tag."
            exit 0
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "::error::package.json version ($version) must equal or be newer than latest release tag ($latest_tag)."
          else
            echo "::error::package.json version ($version) must match latest release tag ($latest_tag)."
          fi
          exit 1
