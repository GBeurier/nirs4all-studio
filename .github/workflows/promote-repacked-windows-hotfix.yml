name: Promote byte-identical Windows hotfix after real migration

on:
  workflow_dispatch:
    inputs:
      repack_run_id:
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: promote-qualified-hotfix-0.11.5
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REPACK_RUN_ID: ${{ inputs.repack_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f314cdb223cd77ce1a3fb6d336cca82206cd02a4
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require exact product, installed UI, source tests and real migration
        run: |
          cat > "$RUNNER_TEMP/check-hotfix.cjs" <<'NODE'
          const assert=require('node:assert/strict');
          const {execFileSync}=require('node:child_process');
          const {GH_REPO,REPACK_RUN_ID}=process.env;
          assert(/^\d+$/.test(REPACK_RUN_ID));
          const api=p=>JSON.parse(execFileSync('gh',['api',`repos/${GH_REPO}/${p}`],{encoding:'utf8'}));
          const sha='f314cdb223cd77ce1a3fb6d336cca82206cd02a4';
          let tag=api('git/ref/tags/0.11.5').object;
          while(tag.type==='tag') tag=api(`git/tags/${tag.sha}`).object;
          assert.equal(tag.type,'commit'); assert.equal(tag.sha,sha);
          assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),sha);
          const source=api('actions/runs/35216053291');
          assert.equal(source.head_sha,sha); assert.equal(source.path,'.github/workflows/release-unified.yml');
          assert.equal(source.event,'push'); assert.equal(source.head_branch,'0.11.5');
          const jobs=api('actions/runs/35216053291/jobs?per_page=100').jobs;
          for(const name of ['Prepare','Acquire pinned plugin wheels','Qualify release commit / Frontend','Qualify release commit / Backend','Qualify release commit / Native Sidecar Windows Containment','Installer — Windows x64','All-in-one — Windows x64']){
            const found=jobs.filter(job=>job.name===name); assert.equal(found.length,1); assert.equal(found[0].conclusion,'success',name);
          }
          const e2e=api('actions/runs/35216025664');
          assert.equal(e2e.head_sha,sha); assert.equal(e2e.path,'.github/workflows/playwright.yml'); assert.equal(e2e.conclusion,'success');
          const nsis=api('actions/jobs/105195060850');
          assert.equal(nsis.run_id,35219251646); assert.equal(nsis.name,'nsis-install-ui'); assert.equal(nsis.conclusion,'success');
          for(const name of ['Verify hashes and actually install NSIS silently','Prove installed NSIS application works offline','Prove actual first setup and developer preference in installed Windows UI']) assert(nsis.steps.some(step=>step.name===name&&step.conclusion==='success'),name);
          const log=execFileSync('gh',['api',`repos/${GH_REPO}/actions/jobs/105195060850/logs`],{encoding:'utf8',maxBuffer:32*1024*1024});
          assert(log.includes('RELEASE_RUN_ID: 35216053291')&&log.includes('TARGET_VERSION: 0.11.5')&&log.includes(sha));
          const release=api('releases/tags/0.11.5');
          assert.equal(release.id,390685191); assert.equal(release.draft,false); assert.equal(release.prerelease,true);
          const expected={
            'nirs4all.Studio-0.11.5-win-x64.exe':'1f9eecc8a75e141c4552af8d95281730371b33a8d1c213f03a9b693671b9df1d',
            'nirs4all.Studio-0.11.5-win-x64-portable.exe':'8359fc05b3a438921c18436daa7815c8a40e9a7c68b1816a42470d90664656d8',
          };
          for(const [name,hash] of Object.entries(expected)){
            const found=release.assets.filter(asset=>asset.name===name); assert.equal(found.length,1); assert.equal(found[0].state,'uploaded'); assert.equal(found[0].digest,`sha256:${hash}`);
            assert(release.assets.some(asset=>asset.name===`${name}.sha256`&&asset.state==='uploaded'));
          }
          (async()=>{
            const deadline=Date.now()+30*60*1000;
            for(;;){
              const run=api(`actions/runs/${REPACK_RUN_ID}`);
              assert.equal(run.path,'.github/workflows/windows-repacked-update.yml'); assert.equal(run.event,'workflow_dispatch');
              assert.equal(run.head_sha,'3422679ea59abe0af3ac04306e1583be74205e83');
              if(run.status==='completed'){
                assert.equal(run.conclusion,'success','Repacked real migration must pass');
                const jobs=api(`actions/runs/${REPACK_RUN_ID}/jobs?per_page=100`).jobs;
                assert.equal(jobs.length,1); assert.equal(jobs[0].conclusion,'success');
                for(const name of ['Wrap the ZIP and verify every application file is identical','Migrate the actual public 0.11.4 and cold boot the unchanged product','Upload the qualified repacked archive only after migration passes']) assert(jobs[0].steps.some(step=>step.name===name&&step.conclusion==='success'),name);
                console.log('Exact installer, real UI and repacked N-1 migration qualified'); break;
              }
              assert(Date.now()<deadline,'Timed out awaiting real migration');
              console.log(`Awaiting repacked real migration: ${run.status}`);
              await new Promise(resolve=>setTimeout(resolve,20000));
            }
          })().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
          node "$RUNNER_TEMP/check-hotfix.cjs"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.repack_run_id }}
          name: archive-windows-x64-repacked
          path: release
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.repack_run_id }}
          name: windows-repacked-update-proof
          path: proof
      - name: Bind archive bytes to successful migration and unchanged application files
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict');
          const {finalizeReleaseAssets}=require('./scripts/finalize-release-assets.cjs');
          const name='nirs4all.Studio-0.11.5-all-in-one-win-x64.zip';
          const records=finalizeReleaseAssets(path.resolve('release'),[name]);
          assert.equal(records.length,1);
          const paths=[]; function walk(root){for(const item of fs.readdirSync(root,{withFileTypes:true})){const file=path.join(root,item.name);if(item.isDirectory())walk(file);else paths.push(file);}} walk('proof');
          const read=name=>{const files=paths.filter(file=>path.basename(file)===name);assert.equal(files.length,1,name);return JSON.parse(fs.readFileSync(files[0],'utf8').replace(/^\uFEFF/,''));};
          const repack=read('repack-proof.json'),migration=read('result.json');
          assert.equal(repack.source_sha256,'f069fa1552b9d61d6d74e46ad770d1f1a575c116887368b6904e341fc0f6b506');
          assert.equal(repack.archive_sha256,records[0].digest); assert(repack.application_files_verified_identical>10000); assert.equal(repack.top_level_directory,'nirs4all Studio');
          assert.equal(migration.success,true); assert.equal(migration.from,'0.11.4'); assert.equal(migration.to,'0.11.5'); assert.equal(migration.offline_cold_boot,true);
          assert.equal(migration.target_archive_sha256,records[0].digest); assert.equal(migration.target_asset,name);
          assert.equal(migration.apply_result.status,'success'); assert.equal(migration.apply_result.current_version,'0.11.5');
          fs.writeFileSync('qualified-archive-sha.txt',records[0].digest);
          console.log(JSON.stringify({archive_sha256:records[0].digest,repack,migration},null,2));
          NODE
      - name: Publish exact update archive and promote the existing preview
        run: |
          node "$RUNNER_TEMP/check-hotfix.cjs"
          gh release upload 0.11.5 release/*
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),{execFileSync}=require('node:child_process');
          const release=JSON.parse(execFileSync('gh',['api',`repos/${process.env.GH_REPO}/releases/tags/0.11.5`],{encoding:'utf8'}));
          assert.equal(release.assets.length,6);
          for(const asset of release.assets) assert.equal(asset.state,'uploaded');
          const archive=release.assets.find(asset=>asset.name==='nirs4all.Studio-0.11.5-all-in-one-win-x64.zip');
          assert.equal(archive.digest,`sha256:${fs.readFileSync('qualified-archive-sha.txt','utf8')}`);
          NODE
          cat > release-notes.md <<'NOTES'
          ## Windows installation and dataset-loading hotfix

          Windows x64 installer, portable executable and automatic-update archive.

          - Correct developer-mode activation, local dataset parsing, metadata NA handling and repetition identifiers.
          - Verify the complete scientific package environment before Studio becomes ready.
          - Correct Windows paths and update-archive layout.

          The installed NSIS application passed offline scientific checks and real first setup, developer-preference save, renderer reload and application restart. The actual public 0.11.4 updater then migrated to this exact 0.11.5 archive and passed an independent offline cold boot.

          The update ZIP adds one parent directory to the qualified build. Every application file was verified byte-identical. Each download includes a SHA256 sidecar.

          Product commit: `f314cdb223cd77ce1a3fb6d336cca82206cd02a4`. Windows only; Linux, macOS and Docker are not included in this publication.
          NOTES
          printf '\nBuild: https://github.com/%s/actions/runs/35216053291\n\nInstalled UI: https://github.com/%s/actions/runs/35219251646/job/105195060850\n\nActual migration: https://github.com/%s/actions/runs/%s\n\nE2E: https://github.com/%s/actions/runs/35216025664\n' "$GH_REPO" "$GH_REPO" "$GH_REPO" "$REPACK_RUN_ID" "$GH_REPO" >> release-notes.md
          gh release edit 0.11.5 --prerelease=false --latest --title 'nirs4all Studio 0.11.5 — Windows hotfix' --notes-file release-notes.md
