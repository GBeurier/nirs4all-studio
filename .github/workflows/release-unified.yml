  # ═══════════════════════════════════════════════════════════════════════════
  # Docker: static frontend + loopback Rust sidecar
  # ═══════════════════════════════════════════════════════════════════════════
  docker:
    name: Native Docker Image
    needs: prepare
    if: needs.prepare.outputs.skip_docker != 'true'
    outputs:
      image_id: ${{ steps.image.outputs.id }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify fail-closed Docker contract
        run: npm run test:docker-runtime-contract

      - name: Install browser access-test dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Build exact native Methods runtime
        uses: ./.github/actions/build-native-methods
        with:
          platform: linux
          arch: x64

      - name: Build and smoke native release candidate
        run: |
          node scripts/verify-runtime-cohort.cjs
          docker build \
            --build-arg STUDIO_VERSION=${{ needs.prepare.outputs.version }} \
            --build-arg STUDIO_REVISION=${{ needs.prepare.outputs.checkout_ref }} \
            --build-arg NIRS4ALL_METHODS_SHA256=${NIRS4ALL_BUILD_METHODS_SHA256} \
            --build-context methods-runtime="$(dirname "${NIRS4ALL_BUILD_METHODS_LIBRARY}")" \
            --label "org.opencontainers.image.title=nirs4all Studio" \
            --label "org.opencontainers.image.version=${{ needs.prepare.outputs.version }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ needs.prepare.outputs.checkout_ref }}" \
            --tag nirs4all-studio:native-release-candidate \
            .
          bash scripts/smoke-docker-native-runtime.sh nirs4all-studio:native-release-candidate
          node scripts/test-docker-access.cjs nirs4all-studio:native-release-candidate --browser

      - name: Preserve the tested image without publishing
        id: image
        run: |
          echo "id=$(docker image inspect --format '{{.Id}}' nirs4all-studio:native-release-candidate)" >> "$GITHUB_OUTPUT"
          docker save --output "$RUNNER_TEMP/studio-image.tar" nirs4all-studio:native-release-candidate

      - uses: actions/upload-artifact@v4
        with:
          name: docker-candidate
          path: ${{ runner.temp }}/studio-image.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 5

  # ═══════════════════════════════════════════════════════════════════════════
  # Release: Consolidate all artifacts into GitHub Release
  # Publication consumes the exact installers and image qualified above.
  # ═══════════════════════════════════════════════════════════════════════════
  release:
    name: Create Release
    needs: [prepare, quality, installer-linux, installer-windows, installer-macos-x64, installer-macos-arm64, docker]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.quality.result == 'success' &&
      needs.installer-linux.result == 'success' &&
      needs.installer-windows.result == 'success' &&
      ((needs.prepare.outputs.include_macos_x64 == 'true' && needs.installer-macos-x64.result == 'success') ||
       (needs.prepare.outputs.include_macos_x64 == 'false' && needs.installer-macos-x64.result == 'skipped')) &&
      needs.installer-macos-arm64.result == 'success' &&
      (needs.prepare.outputs.skip_docker == 'true' || needs.docker.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: 'installer-*-payload'
          merge-multiple: false

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f \( \
            -name "*.deb" -o -name "*.exe" \
            -o -name "*.dmg" \
            -o -name "*.sha256" \
          \) -exec cp {} release/ \; 2>/dev/null || true

          # GitHub normalizes spaces in uploaded asset names to dots. Perform
          # that normalization ourselves, verify every producer checksum
          # against its payload, and regenerate sidecars with the exact public
          # basename so `sha256sum -c` works after download.
          node scripts/finalize-release-assets.cjs \
            release \
            '${{ needs.prepare.outputs.version }}' \
            false \
            '${{ needs.prepare.outputs.include_macos_x64 }}'

          echo "## Release Assets" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d release ] && [ "$(ls -A release 2>/dev/null)" ]; then
            ls -lh release/ | while read line; do echo "    $line" >> $GITHUB_STEP_SUMMARY; done
          else
            echo "No assets found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Generate release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Collect job results
          INSTALLER_LINUX="${{ needs.installer-linux.result }}"
          INSTALLER_WINDOWS="${{ needs.installer-windows.result }}"
          INSTALLER_MACOS_X64="${{ needs.installer-macos-x64.result }}"
          INSTALLER_MACOS_ARM64="${{ needs.installer-macos-arm64.result }}"
          DOCKER="${{ needs.docker.result }}"

          cat > release_notes.md << NOTES
          ## nirs4all Studio ${VERSION}

          ### Installers (Recommended)

          Full desktop application with its included CPU runtime and required packages.
          First launch verifies the installed runtime before opening your datasets.

          | Platform | Architecture | File | Status |
          |----------|-------------|------|--------|
          | **Windows** | x64 | \`nirs4all.Studio-${VERSION}-win-x64.exe\` | ${INSTALLER_WINDOWS} |
          | **macOS** | Intel (x64) | \`nirs4all.Studio-${VERSION}-mac-x64.dmg\` | ${INSTALLER_MACOS_X64} |
          | **macOS** | Apple Silicon (arm64) | \`nirs4all.Studio-${VERSION}-mac-arm64.dmg\` | ${INSTALLER_MACOS_ARM64} |
          | **Linux** | x64 | \`nirs4all.Studio-${VERSION}-linux-amd64.deb\` | ${INSTALLER_LINUX} |

          ### Docker

          Server/HPC deployment — no Electron or Python HTTP backend. nginx
          serves the static renderer and proxies API/WebSocket traffic to the
          loopback-only Rust sidecar.

          \`\`\`bash
          docker pull ghcr.io/gbeurier/nirs4all-studio:${VERSION}
          docker run -p 127.0.0.1:8000:8000 -e NIRS4ALL_STUDIO_TRUSTED_LOCAL_ONLY=1 ghcr.io/gbeurier/nirs4all-studio:${VERSION}
          \`\`\`

          | Runtime | Tag | Status |
          |---------|-----|--------|
          | Native Rust | \`ghcr.io/gbeurier/nirs4all-studio:${VERSION}\` | ${DOCKER} |

          This command is local-only. Shared deployments require a mounted
          password file and TLS; see docs/NATIVE_HTTP_ACCESS.md in the source.

          ### Verification

          SHA256 checksums are provided as \`.sha256\` files for each download.

          \`\`\`bash
          # Linux/macOS
          sha256sum -c 'nirs4all.Studio-${VERSION}-linux-amd64.deb.sha256'

          # Windows (PowerShell)
          (Get-FileHash '.\nirs4all.Studio-${VERSION}-win-x64.exe').Hash
          \`\`\`

          ### System Requirements

          - **Windows**: Windows 10+ (x64)
          - **macOS**: macOS 12+ (Intel or Apple Silicon)
          - **Linux**: Ubuntu 22.04+ or equivalent (x64; glibc 2.35 and GLIBCXX 3.4.29 required)
          - **Docker**: OCI runtime on Linux x64

          ---
          *Commit: ${{ github.sha }}*
          NOTES

          if [ '${{ needs.prepare.outputs.include_macos_x64 }}' != 'true' ]; then
            sed -i '/| \*\*macOS\*\* | Intel (x64) |/d' release_notes.md
            sed -i 's/macOS 12+ (Intel or Apple Silicon)/macOS 12+ (Apple Silicon)/' release_notes.md
            printf '\nIntel Mac installers are deferred for this release.\n' >> release_notes.md
          fi

      - name: Download the tested Docker image
        if: needs.prepare.outputs.is_tag_release == 'true' && needs.prepare.outputs.skip_docker != 'true'
        uses: actions/download-artifact@v4
        with:
          name: docker-candidate
          path: docker-candidate

      - name: Login to GitHub Container Registry
        if: needs.prepare.outputs.is_tag_release == 'true' && needs.prepare.outputs.skip_docker != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested Docker image
        if: needs.prepare.outputs.is_tag_release == 'true' && needs.prepare.outputs.skip_docker != 'true'
        env:
          EXPECTED_IMAGE_ID: ${{ needs.docker.outputs.image_id }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          docker load --input docker-candidate/studio-image.tar
          test "$(docker image inspect --format '{{.Id}}' nirs4all-studio:native-release-candidate)" = "$EXPECTED_IMAGE_ID"
          IMAGE=ghcr.io/gbeurier/nirs4all-studio
          docker tag nirs4all-studio:native-release-candidate "$IMAGE:$RELEASE_VERSION"
          docker push "$IMAGE:$RELEASE_VERSION"
          if [ "$IS_PRERELEASE" != 'true' ]; then
            docker tag nirs4all-studio:native-release-candidate "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi

      - name: Publish verified assets sequentially
        # Publish on a real tag push or an explicit retry of an existing tag.
        # Default dispatches still perform build/smoke without publication.
        if: needs.prepare.outputs.is_tag_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.checkout_ref }}
          RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          RELEASE_NOTES_PATH: release_notes.md
        run: |
          node scripts/publish-qualified-release.cjs \
            release \
            '${{ needs.prepare.outputs.version }}' \
            false \
            '${{ needs.prepare.outputs.include_macos_x64 }}'

      - name: Release summary
        run: |
          echo "## Release Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ needs.prepare.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag**: ${{ needs.prepare.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Prerelease**: ${{ needs.prepare.outputs.prerelease }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Installer Linux | ${{ needs.installer-linux.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Installer Windows | ${{ needs.installer-windows.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Installer macOS x64 | ${{ needs.installer-macos-x64.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Installer macOS arm64 | ${{ needs.installer-macos-arm64.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker | ${{ needs.docker.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Assets" >> $GITHUB_STEP_SUMMARY
          ls -1 release/ 2>/dev/null | while read f; do echo "- \`$f\`" >> $GITHUB_STEP_SUMMARY; done || echo "No assets" >> $GITHUB_STEP_SUMMARY
