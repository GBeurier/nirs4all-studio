# Unified Release Workflow
# Produces all distribution formats from a single CI trigger:
#   - Electron installers (Windows NSIS, macOS DMG, Linux AppImage+DEB)
#   - All-in-one bundled archives (CPU ZIP on Windows/macOS, tar.gz on Linux)
#   - Native Docker image (static frontend + Rust sidecar)
#
# Trigger: tag v* or manual dispatch
# Phase 3 (CI/CD Hardening) + Phase 4 (Code Signing & macOS)
name: Release

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., 1.2.0)'
        required: true
        type: string
      skip_all_in_one:
        description: 'Skip all-in-one bundle builds'
        required: false
        default: false
        type: boolean
      skip_docker:
        description: 'Skip Docker image builds'
        required: false
        default: false
        type: boolean

env:
  APP_NAME: nirs4all Studio
  APP_ID: com.nirs4all.webapp
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.11'
  # Release archives/images must be reproducible. Keep these refs pinned to the
  # selected RC heads and update them with the ecosystem release board.
  NIRS4ALL_LIBRARY_REF: 2af6cfd7f988fa400617c460a77450dbad4228c9
  DAG_ML_REF: 1caa26dc9b90f33bc3f53b15b4d85e18f3f67381
  DAG_ML_DATA_REF: 7d9b9fed04c135ed4c2bba472c782aca7ef85807
  NIRS4ALL_TOOLS_REF: 88c2bc1e29603049cdbf1a1080a35845edf2f3c9
  NIRS4ALL_SOURCE_URL: https://github.com/GBeurier/nirs4all/archive/2af6cfd7f988fa400617c460a77450dbad4228c9.tar.gz
  DAG_ML_SOURCE_URL: https://github.com/GBeurier/dag-ml/archive/1caa26dc9b90f33bc3f53b15b4d85e18f3f67381.tar.gz
  DAG_ML_DATA_SOURCE_URL: https://github.com/GBeurier/dag-ml-data/archive/7d9b9fed04c135ed4c2bba472c782aca7ef85807.tar.gz
  NIRS4ALL_TOOLS_SOURCE_URL: https://github.com/GBeurier/nirs4all-tools/archive/88c2bc1e29603049cdbf1a1080a35845edf2f3c9.tar.gz

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Prepare: Extract version, validate, determine build matrix
  # ═══════════════════════════════════════════════════════════════════════════
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      skip_all_in_one: ${{ steps.flags.outputs.skip_all_in_one }}
      skip_docker: ${{ steps.flags.outputs.skip_docker }}
      # Tag-push releases are public and must fail closed on signing.
      # workflow_dispatch is used for smoke testing (often without secrets) and
      # is allowed to build unsigned. `push` only fires on tags here (see `on:`).
      is_tag_release: ${{ github.event_name == 'push' }}
      # Signing detection computed once, here, from `secrets` — which can be read
      # in a step `env:` but never in a job-level `if:`. Build jobs consume these
      # via needs.prepare.outputs.* (reliable, unlike the old per-step env probe).
      has_windows_signing: ${{ steps.signing.outputs.has_windows_signing }}
      has_macos_signing: ${{ steps.signing.outputs.has_macos_signing }}
      # The git ref every build job checks out. Tag push -> the triggering tag;
      # workflow_dispatch -> inputs.tag when it already exists as a ref, else the
      # triggering commit SHA (so a smoke-test tag that does not exist yet still
      # checks out a valid, buildable ref instead of failing or silently building
      # the wrong branch).
      checkout_ref: ${{ steps.checkout_ref.outputs.checkout_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"

          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT

          echo "## Build Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: $TAG" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Prerelease**: $PRERELEASE" >> $GITHUB_STEP_SUMMARY

      - name: Resolve checkout ref
        id: checkout_ref
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # Tag push: GITHUB_REF already points at the tag.
            REF="$GITHUB_REF"
            echo "Tag push: build jobs check out triggering ref $REF"
          elif git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            # workflow_dispatch against an existing tag: build that tag.
            REF="refs/tags/${TAG}"
            echo "Dispatch: tag '${TAG}' exists; build jobs check out $REF"
          else
            # workflow_dispatch against a tag that does not exist yet (smoke test):
            # fall back to the triggering commit so checkout always succeeds and
            # we never silently build the wrong branch under the tag's version.
            REF="$GITHUB_SHA"
            echo "::warning::Dispatch tag '${TAG}' does not exist as a ref; build jobs will use the triggering commit $GITHUB_SHA (version is still stamped as ${{ steps.version.outputs.version }})."
          fi
          echo "checkout_ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Resolved checkout SHA: $(git rev-parse "$REF" 2>/dev/null || echo '(resolves in build jobs)')"
          echo "- **Checkout ref**: \`$REF\`" >> $GITHUB_STEP_SUMMARY

      - name: Validate pinned runtime dependency refs
        shell: bash
        run: |
          for value in "$NIRS4ALL_LIBRARY_REF" "$DAG_ML_REF" "$DAG_ML_DATA_REF" "$NIRS4ALL_TOOLS_REF"; do
            if [[ ! "$value" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Release runtime dependency refs must be immutable 40-char SHAs, got '$value'"
              exit 1
            fi
          done
          for url in "$NIRS4ALL_SOURCE_URL" "$DAG_ML_SOURCE_URL" "$DAG_ML_DATA_SOURCE_URL" "$NIRS4ALL_TOOLS_SOURCE_URL"; do
            if [[ "$url" == *"/refs/heads/"* ]]; then
              echo "::error::Release runtime source URL must not use a moving branch tarball: $url"
              exit 1
            fi
          done

      - name: Detect signing secrets
        id: signing
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$WINDOWS_CERT_BASE64" ] && [ -n "$WINDOWS_CERT_PASSWORD" ]; then
            echo "has_windows_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_windows_signing=false" >> "$GITHUB_OUTPUT"
            echo "Windows signing secrets incomplete (WINDOWS_CERT_BASE64 / WINDOWS_CERT_PASSWORD)."
          fi

          macos_missing=()
          for secret_name in APPLE_CERT_BASE64 APPLE_CERT_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!secret_name}" ]; then
              macos_missing+=("$secret_name")
            fi
          done
          if [ ${#macos_missing[@]} -eq 0 ]; then
            echo "has_macos_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_macos_signing=false" >> "$GITHUB_OUTPUT"
            echo "macOS signing/notarization secrets missing: ${macos_missing[*]}"
          fi

      - name: Determine build flags
        id: flags
        run: |
          echo "skip_all_in_one=${{ inputs.skip_all_in_one || 'false' }}" >> $GITHUB_OUTPUT
          echo "skip_docker=${{ inputs.skip_docker || 'false' }}" >> $GITHUB_OUTPUT

  # Build universal Python wheels once on Linux. Building the same source wheel
  # independently on Windows changes archive metadata and can also inherit Git
  # line-ending conversion, so installer jobs consume this one attested payload.
  pinned-plugin-wheels:
    name: Build pinned plugin wheels
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build and verify canonical wheels
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        run: |
          python -m pip install --upgrade setuptools==84.0.0 wheel==0.48.0 packaging==26.3
          mkdir -p dist/pinned-plugin-wheels
          SOURCE_DATE_EPOCH=1788424315 python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist/pinned-plugin-wheels git+https://github.com/GBeurier/nirs4all.git@2af6cfd7f988fa400617c460a77450dbad4228c9
          SOURCE_DATE_EPOCH=1788346349 python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist/pinned-plugin-wheels git+https://github.com/GBeurier/nirs4all-tools.git@${NIRS4ALL_TOOLS_REF}
          cd dist/pinned-plugin-wheels
          echo '5898aa933da2e51ad07438ae5313ade37f1dad2a363411e71e0f0a513c7b4824  nirs4all-1.0.0rc2-py3-none-any.whl' | sha256sum --check --strict
          echo '4f1c2e65ba42af9dc807e0704b7c6ec6b80efc22169d43f8051ae47f679cd819  nirs4all_tools-0.0.7-py3-none-any.whl' | sha256sum --check --strict

      - name: Upload canonical wheels
        uses: actions/upload-artifact@v4
        with:
          name: pinned-plugin-wheels
          path: dist/pinned-plugin-wheels/*.whl
          if-no-files-found: error
          retention-days: 5

  # ═══════════════════════════════════════════════════════════════════════════
  # Installer: Linux x64 (Electron + Rust sidecar + plugin-only CPython closure)
  # ═══════════════════════════════════════════════════════════════════════════
  installer-linux:
    name: Installer — Linux x64
    needs: [prepare, pinned-plugin-wheels]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgirepository1.0-dev \
            libcairo2-dev \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1

      - name: Install npm dependencies
        run: npm ci

      - name: Download canonical plugin wheels
        uses: actions/download-artifact@v4
        with:
          name: pinned-plugin-wheels
          path: _deps/pinned-plugin-wheels

      - name: Build exact native Methods runtime
        uses: ./.github/actions/build-native-methods
        with:
          platform: linux
          arch: x64

      - name: Qualify native Archive V2 replay
        run: npm run test:native-archive-v2

      - name: Verify exact nirs4all-ui package
        run: npm run check:ui-package

      - name: Update package.json version
        run: npm version ${{ needs.prepare.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Build frontend (Electron mode)
        run: npm run build:electron

      - name: Write version.json
        run: |
          cat > version.json << EOF
          {
            "version": "${{ needs.prepare.outputs.version }}",
            "build_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}"
          }
          EOF

      - name: Build pinned plugin-only CPython runtime
        run: node scripts/bake-python-plugin-runtime.cjs --plugin-wheel _deps/pinned-plugin-wheels/nirs4all-1.0.0rc2-py3-none-any.whl --tools-wheel _deps/pinned-plugin-wheels/nirs4all_tools-0.0.7-py3-none-any.whl

      - name: Build and smoke native sidecar
        run: |
          node scripts/build-native-sidecar.cjs --target x86_64-unknown-linux-gnu
          test -x backend-dist/native/studio-sidecar
          node scripts/native-runtime-contract.cjs --backend-root backend-dist --artifact-boundary-root backend-dist --platform linux --arch x64 --require-bundled-python-plugin --require-bundled-methods
          backend-dist/native/studio-sidecar --smoke-readiness

      - name: Package with electron-builder
        run: npx electron-builder --config electron-builder.installer.yml --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaged native sidecar
        run: |
          SIDECAR="$(find release -type f -path '*/resources/backend/native/studio-sidecar' -print -quit)"
          test -n "$SIDECAR"
          test -x "$SIDECAR"
          BACKEND_ROOT="$(dirname "$(dirname "$SIDECAR")")"
          ARTIFACT_BOUNDARY="$(dirname "$(dirname "$BACKEND_ROOT")")"
          node scripts/native-runtime-contract.cjs --backend-root "$BACKEND_ROOT" --artifact-boundary-root "$ARTIFACT_BOUNDARY" --platform linux --arch x64 --require-bundled-python-plugin --require-bundled-methods
          "$SIDECAR" --smoke-readiness

      - name: Generate checksums
        run: |
          cd release
          for f in *.AppImage *.deb; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux-x64
          path: |
            release/*.AppImage
            release/*.deb
            release/*.sha256
            release/*.yml
          retention-days: 5

  # ═══════════════════════════════════════════════════════════════════════════
  # Installer: Windows x64 (Electron + Rust sidecar + plugin-only CPython closure)
  # ═══════════════════════════════════════════════════════════════════════════
  installer-windows:
    name: Installer — Windows x64
    needs: [prepare, pinned-plugin-wheels]
    # Methods' release preset is intentionally bound to VS 17 / 2022.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Note — building an unsigned Windows installer (no signing secrets)
        if: needs.prepare.outputs.is_tag_release == 'true' && needs.prepare.outputs.has_windows_signing != 'true'
        shell: bash
        run: |
          echo "::warning::No Windows code-signing secrets set — publishing an UNSIGNED installer. Users see a SmartScreen prompt on first run (More info > Run anyway). This is fine for this project; add WINDOWS_CERT_BASE64 + WINDOWS_CERT_PASSWORD to sign."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      - name: Download canonical plugin wheels
        uses: actions/download-artifact@v4
        with:
          name: pinned-plugin-wheels
          path: _deps/pinned-plugin-wheels

      - name: Build exact native Methods runtime
        uses: ./.github/actions/build-native-methods
        with:
          platform: win32
          arch: x64

      - name: Qualify native Archive V2 replay
        run: npm run test:native-archive-v2

      - name: Verify exact nirs4all-ui package
        run: npm run check:ui-package

      - name: Update package.json version
        run: npm version ${{ needs.prepare.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Build frontend (Electron mode)
        run: npm run build:electron

      - name: Write version.json
        shell: pwsh
        run: |
          @{
            version = "${{ needs.prepare.outputs.version }}"
            build_date = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            commit = "${{ github.sha }}"
          } | ConvertTo-Json | Out-File -FilePath version.json -Encoding utf8

      - name: Build pinned plugin-only CPython runtime
        run: node scripts/bake-python-plugin-runtime.cjs --plugin-wheel _deps/pinned-plugin-wheels/nirs4all-1.0.0rc2-py3-none-any.whl --tools-wheel _deps/pinned-plugin-wheels/nirs4all_tools-0.0.7-py3-none-any.whl

      - name: Build and smoke native sidecar
        shell: pwsh
        run: |
          node scripts/build-native-sidecar.cjs --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sidecar = "backend-dist/native/studio-sidecar.exe"
          if (-not (Test-Path -LiteralPath $sidecar -PathType Leaf)) {
            throw "Native Studio sidecar not found: $sidecar"
          }
          node scripts/native-runtime-contract.cjs --backend-root backend-dist --artifact-boundary-root backend-dist --platform win32 --arch x64 --require-bundled-python-plugin --require-bundled-methods
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $sidecar --smoke-readiness
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ── Windows Code Signing (Phase 4 — P4-3) ──
      - name: Import code signing certificate
        if: needs.prepare.outputs.has_windows_signing == 'true'
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64)
          [IO.File]::WriteAllBytes("${{ runner.temp }}\cert.pfx", $certBytes)
          echo "CSC_LINK=${{ runner.temp }}\cert.pfx" >> $env:GITHUB_ENV
          echo "CSC_KEY_PASSWORD=$($env:WINDOWS_CERT_PASSWORD)" >> $env:GITHUB_ENV

      - name: Package with electron-builder
        run: npx electron-builder --config electron-builder.installer.yml --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Payload execution is independent of Authenticode. The existing
      # secret-backed signature verification below remains authoritative.
      - name: Verify packaged native sidecar
        shell: pwsh
        run: |
          $sidecar = Get-ChildItem -Path release -Filter studio-sidecar.exe -File -Recurse |
            Where-Object { $_.FullName -match '[\\/]resources[\\/]backend[\\/]native[\\/]studio-sidecar\.exe$' } |
            Select-Object -First 1
          if (-not $sidecar) {
            throw "Packaged native Studio sidecar not found under release/"
          }
          $backendRoot = Split-Path -Parent (Split-Path -Parent $sidecar.FullName)
          $artifactBoundary = Split-Path -Parent (Split-Path -Parent $backendRoot)
          node scripts/native-runtime-contract.cjs --backend-root $backendRoot --artifact-boundary-root $artifactBoundary --platform win32 --arch x64 --require-bundled-python-plugin --require-bundled-methods
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $sidecar.FullName --smoke-readiness
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Authenticode signature
        if: needs.prepare.outputs.has_windows_signing == 'true'
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem release -Include *.exe -Recurse
          if (-not $artifacts) {
            Write-Error "No .exe artifacts found to verify."
            exit 1
          }
          $failed = $false
          foreach ($exe in $artifacts) {
            $sig = Get-AuthenticodeSignature $exe.FullName
            Write-Host "$($exe.Name): $($sig.Status)"
            if ($sig.Status -ne 'Valid') {
              Write-Host "::error::Authenticode signature for $($exe.Name) is '$($sig.Status)', expected 'Valid'."
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Clean up certificate
        if: always()
        shell: pwsh
        run: Remove-Item "${{ runner.temp }}\cert.pfx" -ErrorAction SilentlyContinue

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem release -Include *.exe -Recurse | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii -NoNewline
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows-x64
          path: |
            release/*.exe
            release/*.sha256
            release/*.yml
          retention-days: 5

  # ═══════════════════════════════════════════════════════════════════════════
  # Installer: macOS x64 (Intel) — Phase 4: signed + notarized
  # ═══════════════════════════════════════════════════════════════════════════
  installer-macos-x64:
    name: Installer — macOS x64
    needs: [prepare, pinned-plugin-wheels]
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Note — building an unsigned macOS DMG (no Apple signing secrets)
        if: needs.prepare.outputs.is_tag_release == 'true' && needs.prepare.outputs.has_macos_signing != 'true'
        run: |
          echo "::warning::No Apple signing/notarization secrets set — publishing an UNSIGNED, un-notarized DMG. Users must right-click > Open on first launch (Gatekeeper). This is fine for this project; add APPLE_* secrets to sign + notarize."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install npm dependencies
        run: npm ci

      - name: Download canonical plugin wheels
        uses: actions/download-artifact@v4
        with:
          name: pinned-plugin-wheels
          path: _deps/pinned-plugin-wheels

      - name: Build exact native Methods runtime
        uses: ./.github/actions/build-native-methods
        with:
          platform: darwin
          arch: x64

      - name: Qualify native Archive V2 replay
        run: npm run test:native-archive-v2

      - name: Verify exact nirs4all-ui package
        run: npm run check:ui-package

      - name: Update package.json version
        run: npm version ${{ needs.prepare.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Build frontend (Electron mode)
        run: npm run build:electron

      - name: Write version.json
        run: |
          cat > version.json << EOF
          {
            "version": "${{ needs.prepare.outputs.version }}",
            "build_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}"
          }
          EOF

      - name: Build pinned plugin-only CPython runtime
        run: node scripts/bake-python-plugin-runtime.cjs --plugin-wheel _deps/pinned-plugin-wheels/nirs4all-1.0.0rc2-py3-none-any.whl --tools-wheel _deps/pinned-plugin-wheels/nirs4all_tools-0.0.7-py3-none-any.whl

      - name: Build and smoke native sidecar
        run: |
          node scripts/build-native-sidecar.cjs --target x86_64-apple-darwin
          test -x backend-dist/native/studio-sidecar
          node scripts/native-runtime-contract.cjs --backend-root backend-dist --artifact-boundary-root backend-dist --platform darwin --arch x64 --require-bundled-python-plugin --require-bundled-methods
          if [ "$(uname -m)" = "x86_64" ]; then
            backend-dist/native/studio-sidecar --smoke-readiness
          else
            echo "Skipping x86_64 sidecar execution on $(uname -m); packaging checks still apply."
          fi

      # ── macOS Code Signing (Phase 4 — P4-1) ──
      - name: Import Apple Developer certificate
        if: needs.prepare.outputs.has_macos_signing == 'true'
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=${{ runner.temp }}/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$APPLE_CERT_BASE64" | base64 --decode > ${{ runner.temp }}/cert.p12
          security import ${{ runner.temp }}/cert.p12 -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

          # Export for electron-builder (keychain-based signing, no file reference needed)
          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> $GITHUB_ENV

      - name: Package with electron-builder
        run: npx electron-builder --config electron-builder.installer.yml --mac --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder reads these for signing
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # This validates the unpacked payload only. The existing secret-backed
      # DMG notarization, stapling, and signature checks remain authoritative.
      - name: Verify packaged native sidecar
        run: |
          SIDECAR="$(find release -type f -path '*/Contents/Resources/backend/native/studio-sidecar' -print -quit)"
          test -n "$SIDECAR"
          test -x "$SIDECAR"
          BACKEND_ROOT="$(dirname "$(dirname "$SIDECAR")")"
          ARTIFACT_BOUNDARY="$(dirname "$(dirname "$(dirname "$BACKEND_ROOT")")")"
          node scripts/native-runtime-contract.cjs --backend-root "$BACKEND_ROOT" --artifact-boundary-root "$ARTIFACT_BOUNDARY" --platform darwin --arch x64 --require-bundled-python-plugin --require-bundled-methods
          if [ "$(uname -m)" = "x86_64" ]; then
            "$SIDECAR" --smoke-readiness
          else
            echo "Skipping packaged x86_64 sidecar execution on $(uname -m)."
          fi

      # ── macOS Notarization (Phase 4 — P4-2) ──
      - name: Notarize macOS DMG
        if: needs.prepare.outputs.has_macos_signing == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG=$(ls release/*.dmg 2>/dev/null | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::No DMG found to notarize."
            exit 1
          fi
          echo "Notarizing $DMG..."
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 600

          echo "Stapling notarization ticket..."
          xcrun stapler staple "$DMG"
          echo "Notarization complete."

      - name: Verify signature and notarization
        if: needs.prepare.outputs.has_macos_signing == 'true'
        run: |
          DMG=$(ls release/*.dmg 2>/dev/null | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::No DMG found to verify."
            exit 1
          fi
          echo "Validating stapled ticket on $DMG..."
          xcrun stapler validate "$DMG"
          echo "Gatekeeper assessment of the disk image..."
          spctl --assess --type open --context context:primary-signature -vv "$DMG"

          echo "Mounting DMG to verify the app bundle..."
          MOUNT_DIR="$(mktemp -d)"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT_DIR"
          APP=$(ls -d "$MOUNT_DIR"/*.app 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            hdiutil detach "$MOUNT_DIR" || true
            echo "::error::No .app found inside the mounted DMG."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          # The notarization ticket is stapled to the DMG (above), not to the
          # inner .app, so `stapler validate "$APP"` would always fail here.
          # spctl assesses the app against the notary record (online) instead.
          spctl --assess --type exec -vv "$APP"
          hdiutil detach "$MOUNT_DIR"
          echo "Signature + notarization verified."

      - name: Cleanup keychain
        if: always()
        run: |
          KEYCHAIN_PATH=${{ runner.temp }}/build.keychain
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

      - name: Generate checksums
        run: |
          cd release
          for f in *.dmg; do
            [ -f "$f" ] && shasum -a 256 "$f" > "$f.sha256"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos-x64
          path: |
            release/*.dmg
            release/*.sha256
            release/*.yml
          retention-days: 5

  # ═══════════════════════════════════════════════════════════════════════════
  # Installer: macOS arm64 (Apple Silicon) — Phase 4: signed + notarized
  # ═══════════════════════════════════════════════════════════════════════════
  installer-macos-arm64:
    name: Installer — macOS arm64
    needs: [prepare, pinned-plugin-wheels]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Note — building an unsigned macOS DMG (no Apple signing secrets)
        if: needs.prepare.outputs.is_tag_release == 'true' && needs.prepare.outputs.has_macos_signing != 'true'
        run: |
          echo "::warning::No Apple signing/notarization secrets set — publishing an UNSIGNED, un-notarized DMG. Users must right-click > Open on first launch (Gatekeeper). This is fine for this project; add APPLE_* secrets to sign + notarize."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install npm dependencies
        run: npm ci

      - name: Download canonical plugin wheels
        uses: actions/download-artifact@v4
        with:
          name: pinned-plugin-wheels
          path: _deps/pinned-plugin-wheels

      - name: Build exact native Methods runtime
        uses: ./.github/actions/build-native-methods
        with:
          platform: darwin
          arch: arm64

      - name: Qualify native Archive V2 replay
        run: npm run test:native-archive-v2

      - name: Verify exact nirs4all-ui package
        run: npm run check:ui-package

      - name: Update package.json version
        run: npm version ${{ needs.prepare.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Build frontend (Electron mode)
        run: npm run build:electron

      - name: Write version.json
        run: |
          cat > version.json << EOF
          {
            "version": "${{ needs.prepare.outputs.version }}",
            "build_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}"
          }
          EOF

      - name: Build pinned plugin-only CPython runtime
        run: node scripts/bake-python-plugin-runtime.cjs --plugin-wheel _deps/pinned-plugin-wheels/nirs4all-1.0.0rc2-py3-none-any.whl --tools-wheel _deps/pinned-plugin-wheels/nirs4all_tools-0.0.7-py3-none-any.whl

      - name: Build and smoke native sidecar
        run: |
          node scripts/build-native-sidecar.cjs --target aarch64-apple-darwin
          test -x backend-dist/native/studio-sidecar
          node scripts/native-runtime-contract.cjs --backend-root backend-dist --artifact-boundary-root backend-dist --platform darwin --arch arm64 --require-bundled-python-plugin --require-bundled-methods
          if [ "$(uname -m)" = "arm64" ]; then
            backend-dist/native/studio-sidecar --smoke-readiness
          else
            echo "Skipping arm64 sidecar execution on $(uname -m); packaging checks still apply."
          fi

      # ── macOS Code Signing (Phase 4 — P4-1) ──
      - name: Import Apple Developer certificate
        if: needs.prepare.outputs.has_macos_signing == 'true'
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH=${{ runner.temp }}/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERT_BASE64" | base64 --decode > ${{ runner.temp }}/cert.p12
          security import ${{ runner.temp }}/cert.p12 -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

          # Export for electron-builder (keychain-based signing, no file reference needed)
          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> $GITHUB_ENV

      - name: Package with electron-builder
        run: npx electron-builder --config electron-builder.installer.yml --mac --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # This validates the unpacked payload only. The existing secret-backed
      # DMG notarization, stapling, and signature checks remain authoritative.
      - name: Verify packaged native sidecar
        run: |
          SIDECAR="$(find release -type f -path '*/Contents/Resources/backend/native/studio-sidecar' -print -quit)"
          test -n "$SIDECAR"
          test -x "$SIDECAR"
          BACKEND_ROOT="$(dirname "$(dirname "$SIDECAR")")"
          ARTIFACT_BOUNDARY="$(dirname "$(dirname "$(dirname "$BACKEND_ROOT")")")"
          node scripts/native-runtime-contract.cjs --backend-root "$BACKEND_ROOT" --artifact-boundary-root "$ARTIFACT_BOUNDARY" --platform darwin --arch arm64 --require-bundled-python-plugin --require-bundled-methods
          if [ "$(uname -m)" = "arm64" ]; then
            "$SIDECAR" --smoke-readiness
          else
            echo "Skipping packaged arm64 sidecar execution on $(uname -m)."
          fi

      # ── macOS Notarization (Phase 4 — P4-2) ──
      - name: Notarize macOS DMG
        if: needs.prepare.outputs.has_macos_signing == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG=$(ls release/*.dmg 2>/dev/null | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::No DMG found to notarize."
            exit 1
          fi
          echo "Notarizing $DMG..."
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 600

          echo "Stapling notarization ticket..."
          xcrun stapler staple "$DMG"
          echo "Notarization complete."

      - name: Verify signature and notarization
        if: needs.prepare.outputs.has_macos_signing == 'true'
        run: |
          DMG=$(ls release/*.dmg 2>/dev/null | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::No DMG found to verify."
            exit 1
          fi
          echo "Validating stapled ticket on $DMG..."
          xcrun stapler validate "$DMG"
          echo "Gatekeeper assessment of the disk image..."
          spctl --assess --type open --context context:primary-signature -vv "$DMG"

          echo "Mounting DMG to verify the app bundle..."
          MOUNT_DIR="$(mktemp -d)"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT_DIR"
          APP=$(ls -d "$MOUNT_DIR"/*.app 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            hdiutil detach "$MOUNT_DIR" || true
            echo "::error::No .app found inside the mounted DMG."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          # The notarization ticket is stapled to the DMG (above), not to the
          # inner .app, so `stapler validate "$APP"` would always fail here.
          # spctl assesses the app against the notary record (online) instead.
          spctl --assess --type exec -vv "$APP"
          hdiutil detach "$MOUNT_DIR"
          echo "Signature + notarization verified."

      - name: Cleanup keychain
        if: always()
        run: |
          KEYCHAIN_PATH=${{ runner.temp }}/build.keychain
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

      - name: Generate checksums
        run: |
          cd release
          for f in *.dmg; do
            [ -f "$f" ] && shasum -a 256 "$f" > "$f.sha256"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos-arm64
          path: |
            release/*.dmg
            release/*.sha256
            release/*.yml
          retention-days: 5

  # ═══════════════════════════════════════════════════════════════════════════
  # All-in-one archive: Windows x64 (Electron ZIP + bundled runtime)
  # ═══════════════════════════════════════════════════════════════════════════
  archive-windows:
    name: All-in-one — Windows x64
    needs: [prepare, pinned-plugin-wheels]
    if: needs.prepare.outputs.skip_all_in_one != 'true'
    # Methods' release preset is intentionally bound to VS 17 / 2022.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Note — building an unsigned Windows archive (no signing secrets)
        if: needs.prepare.outputs.is_tag_release == 'true' && needs.prepare.outputs.has_windows_signing != 'true'
        shell: bash
        run: |
          echo "::warning::No Windows code-signing secrets set — publishing an UNSIGNED all-in-one archive. Users see a SmartScreen prompt on first run. This is fine for this project; add WINDOWS_CERT_BASE64 + WINDOWS_CERT_PASSWORD to sign."

      - name: Checkout nirs4all library
        uses: actions/checkout@v4
        with:
          repository: GBeurier/nirs4all
          ref: ${{ env.NIRS4ALL_LIBRARY_REF }}
          path: nirs4all-lib

      - name: Checkout dag-ml runtime
        uses: actions/checkout@v4
        with:
          repository: GBeurier/dag-ml
          ref: ${{ env.DAG_ML_REF }}
          path: dag-ml

      - name: Checkout dag-ml-data runtime
        uses: actions/checkout@v4
        with:
          repository: GBeurier/dag-ml-data
          ref: ${{ env.DAG_ML_DATA_REF }}
          path: dag-ml-data

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download canonical plugin wheels
        uses: actions/download-artifact@v4
        with:
          name: pinned-plugin-wheels
          path: _deps/pinned-plugin-wheels

      - uses: dtolnay/rust-toolchain@stable

      - name: Build exact native Methods runtime
        uses: ./.github/actions/build-native-methods
        with:
          platform: win32
          arch: x64

      - name: Qualify native Archive V2 replay
        run: npm run test:native-archive-v2

      - name: Cache all-in-one runtime downloads
        uses: actions/cache@v4
        with:
          path: build/.python-cache
          key: archive-pbs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/python-runtime-config.cjs') }}

      - name: Install npm dependencies
        run: npm ci

      - name: Verify exact nirs4all-ui package
        run: npm run check:ui-package

      - name: Update package.json version
        run: npm version ${{ needs.prepare.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Import code signing certificate
        if: needs.prepare.outputs.has_windows_signing == 'true'
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64)
          [IO.File]::WriteAllBytes("${{ runner.temp }}\cert.pfx", $certBytes)
          echo "CSC_LINK=${{ runner.temp }}\cert.pfx" >> $env:GITHUB_ENV
          echo "CSC_KEY_PASSWORD=$($env:WINDOWS_CERT_PASSWORD)" >> $env:GITHUB_ENV

      - name: Build all-in-one archive
        run: node scripts/build-archive-standalone.cjs --clean --platform win32 --arch x64 --plugin-wheel _deps/pinned-plugin-wheels/nirs4all-1.0.0rc2-py3-none-any.whl --tools-wheel _deps/pinned-plugin-wheels/nirs4all_tools-0.0.7-py3-none-any.whl
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract archive for smoke test
        id: archive
        shell: pwsh
        run: |
          $zipPath = (Resolve-Path "release/nirs4all Studio-${{ needs.prepare.outputs.version }}-all-in-one-win-x64.zip").Path
          $extractRoot = Join-Path $env:RUNNER_TEMP "archive-smoke"
          if (Test-Path $extractRoot) {
            Remove-Item -LiteralPath $extractRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $extractRoot | Out-Null
          Expand-Archive -LiteralPath $zipPath -DestinationPath $extractRoot -Force
          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT
          "extract_root=$extractRoot" >> $env:GITHUB_OUTPUT

      - name: Smoke test offline all-in-one launch
        run: node scripts/smoke-archive-standalone.cjs --extracted-root "${{ steps.archive.outputs.extract_root }}" --platform win32

      - name: Smoke test self-update (download -> apply -> relaunch)
        # Non-blocking: this real-Electron smoke (full-tree download + apply +
        # relaunch) is too timing-sensitive under CI load to gate releases; the
        # blocking 'offline all-in-one launch' smoke remains the release gate.
        continue-on-error: true
        timeout-minutes: 5
        run: node scripts/smoke-self-update.cjs --extracted-root "${{ steps.archive.outputs.extract_root }}" --platform win32

      - name: Clean up certificate
        if: always()
        shell: pwsh
        run: Remove-Item "${{ runner.temp }}\cert.pfx" -ErrorAction SilentlyContinue

      - name: Generate checksum
        shell: pwsh
        run: |
          $file = '${{ steps.archive.outputs.zip_path }}'
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path -Path $file -Leaf)" | Out-File -FilePath "$file.sha256" -Encoding ascii -NoNewline

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: archive-windows-x64
          path: |
            ${{ steps.archive.outputs.zip_path }}
            ${{ steps.archive.outputs.zip_path }}.sha256
          retention-days: 5

  # ═══════════════════════════════════════════════════════════════════════════
  # All-in-one archive: Linux x64 (Electron tar.gz + bundled runtime)
  # ═══════════════════════════════════════════════════════════════════════════
  archive-linux:
    name: All-in-one — Linux x64
    needs: [prepare, pinned-plugin-wheels]
    if: needs.prepare.outputs.skip_all_in_one != 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Checkout nirs4all library
        uses: actions/checkout@v4
        with:
          repository: GBeurier/nirs4all
          ref: ${{ env.NIRS4ALL_LIBRARY_REF }}
          path: nirs4all-lib

      - name: Checkout dag-ml runtime
        uses: actions/checkout@v4
        with:
          repository: GBeurier/dag-ml
          ref: ${{ env.DAG_ML_REF }}
          path: dag-ml

      - name: Checkout dag-ml-data runtime
        uses: actions/checkout@v4
        with:
          repository: GBeurier/dag-ml-data
          ref: ${{ env.DAG_ML_DATA_REF }}
          path: dag-ml-data

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download canonical plugin wheels
        uses: actions/download-artifact@v4
        with:
          name: pinned-plugin-wheels
          path: _deps/pinned-plugin-wheels

      - uses: dtolnay/rust-toolchain@stable

      - name: Build exact native Methods runtime
        uses: ./.github/actions/build-native-methods
        with:
          platform: linux
          arch: x64

      - name: Qualify native Archive V2 replay
        run: npm run test:native-archive-v2

      - name: Cache all-in-one runtime downloads
        uses: actions/cache@v4
        with:
          path: build/.python-cache
          key: archive-pbs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/python-runtime-config.cjs') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            unzip \
            pigz \
            xvfb \
            libgirepository1.0-dev \
            libcairo2-dev \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1

      - name: Install npm dependencies
        run: npm ci

      - name: Verify exact nirs4all-ui package
        run: npm run check:ui-package

      - name: Update package.json version
        run: npm version ${{ needs.prepare.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Build all-in-one archive
        run: node scripts/build-archive-standalone.cjs --clean --platform linux --arch x64 --plugin-wheel _deps/pinned-plugin-wheels/nirs4all-1.0.0rc2-py3-none-any.whl --tools-wheel _deps/pinned-plugin-wheels/nirs4all_tools-0.0.7-py3-none-any.whl
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIRS4ALL_TAR_GZIP_PROGRAM: pigz -9

      - name: Extract archive for smoke test
        id: archive
        run: |
          ARCHIVE_PATH="$(pwd)/release/nirs4all Studio-${{ needs.prepare.outputs.version }}-all-in-one-linux-x64.tar.gz"
          EXTRACT_ROOT="$RUNNER_TEMP/archive-smoke"
          rm -rf "$EXTRACT_ROOT"
          mkdir -p "$EXTRACT_ROOT"
          tar -xzf "$ARCHIVE_PATH" -C "$EXTRACT_ROOT"
          echo "archive_path=$ARCHIVE_PATH" >> $GITHUB_OUTPUT
          echo "extract_root=$EXTRACT_ROOT" >> $GITHUB_OUTPUT

      - name: Smoke test staged archive extraction
        run: python3 scripts/smoke-update-zip-permissions.py --archive "${{ steps.archive.outputs.archive_path }}" --platform linux

      - name: Smoke test offline all-in-one launch
        run: xvfb-run -a node scripts/smoke-archive-standalone.cjs --extracted-root "${{ steps.archive.outputs.extract_root }}" --platform linux

      - name: Smoke test self-update (download -> apply -> relaunch)
        # Non-blocking: this real-Electron smoke (full-tree download + apply +
        # relaunch) is too timing-sensitive under CI load to gate releases; the
        # blocking 'offline all-in-one launch' smoke remains the release gate.
        continue-on-error: true
        timeout-minutes: 5
        run: xvfb-run -a node scripts/smoke-self-update.cjs --extracted-root "${{ steps.archive.outputs.extract_root }}" --platform linux

      - name: Generate checksum
        run: |
          FILE="${{ steps.archive.outputs.archive_path }}"
          sha256sum "$FILE" > "$FILE.sha256"

      - name: Report archive size
        run: |
          FILE="${{ steps.archive.outputs.archive_path }}"
          SIZE_BYTES="$(stat -c%s "$FILE")"
          SIZE_MIB="$((SIZE_BYTES / 1024 / 1024))"
          echo "Archive size: ${SIZE_BYTES} bytes (${SIZE_MIB} MiB)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: archive-linux-x64
          path: |
            ${{ steps.archive.outputs.archive_path }}
            ${{ steps.archive.outputs.archive_path }}.sha256
          retention-days: 5

  # ═══════════════════════════════════════════════════════════════════════════
  # All-in-one archive: macOS x64 (notarized + stapled when secrets are available)
  # ═══════════════════════════════════════════════════════════════════════════
  archive-macos-x64:
    name: All-in-one — macOS x64
    needs: [prepare, pinned-plugin-wheels]
    if: needs.prepare.outputs.skip_all_in_one != 'true'
    runs-on: macos-15-intel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Note — building an unsigned macOS archive (no Apple signing secrets)
        if: needs.prepare.outputs.is_tag_release == 'true' && needs.prepare.outputs.has_macos_signing != 'true'
        run: |
          echo "::warning::No Apple signing/notarization secrets set — publishing an UNSIGNED, un-notarized all-in-one archive. Users must right-click > Open on first launch (Gatekeeper). This is fine for this project; add APPLE_* secrets to sign + notarize."

      - name: Checkout nirs4all library
        uses: actions/checkout@v4
        with:
          repository: GBeurier/nirs4all
          ref: ${{ env.NIRS4ALL_LIBRARY_REF }}
          path: nirs4all-lib

      - name: Checkout dag-ml runtime
        uses: actions/checkout@v4
        with:
          repository: GBeurier/dag-ml
          ref: ${{ env.DAG_ML_REF }}
          path: dag-ml

      - name: Checkout dag-ml-data runtime
        uses: actions/checkout@v4
        with:
          repository: GBeurier/dag-ml-data
          ref: ${{ env.DAG_ML_DATA_REF }}
          path: dag-ml-data

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download canonical plugin wheels
        uses: actions/download-artifact@v4
        with:
          name: pinned-plugin-wheels
          path: _deps/pinned-plugin-wheels

      - uses: dtolnay/rust-toolchain@stable

      - name: Build exact native Methods runtime
        uses: ./.github/actions/build-native-methods
        with:
          platform: darwin
          arch: x64

      - name: Qualify native Archive V2 replay
        run: npm run test:native-archive-v2

      - name: Cache all-in-one runtime downloads
        uses: actions/cache@v4
        with:
          path: build/.python-cache
          key: archive-pbs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/python-runtime-config.cjs') }}

      - name: Install npm dependencies
        run: npm ci

      - name: Verify exact nirs4all-ui package
        run: npm run check:ui-package

      - name: Update package.json version
        run: npm version ${{ needs.prepare.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Detect notarization secrets
        id: notarization
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for secret_name in APPLE_CERT_BASE64 APPLE_CERT_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!secret_name}" ]; then
              missing+=("$secret_name")
            fi
          done

          if [ ${#missing[@]} -eq 0 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Using notarized packaging for the macOS all-in-one archive."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Building an unsigned macOS all-in-one archive because these notarization secrets are missing: ${missing[*]}"
          fi

      - name: Import Apple Developer certificate
        if: steps.notarization.outputs.enabled == 'true'
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH=${{ runner.temp }}/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERT_BASE64" | base64 --decode > ${{ runner.temp }}/cert.p12
          security import ${{ runner.temp }}/cert.p12 -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> $GITHUB_ENV

      - name: Build all-in-one archive
        run: |
          HARD_LIMIT="$(ulimit -Hn 2>/dev/null || echo '')"
          TARGET_LIMIT=65536
          if [[ "$HARD_LIMIT" =~ ^[0-9]+$ ]] && (( HARD_LIMIT < TARGET_LIMIT )); then
            TARGET_LIMIT="$HARD_LIMIT"
          fi
          ulimit -n "$TARGET_LIMIT" || true
          echo "Open files soft limit: $(ulimit -n) (hard: ${HARD_LIMIT:-unknown})"
          node scripts/build-archive-standalone.cjs --clean --platform darwin --arch x64 --plugin-wheel _deps/pinned-plugin-wheels/nirs4all-1.0.0rc2-py3-none-any.whl --tools-wheel _deps/pinned-plugin-wheels/nirs4all_tools-0.0.7-py3-none-any.whl
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # cpu-darwin-x64 ships a checked-in constraints file; fail the bake if
          # it is ever missing so this distributable stays reproducible. Read by
          # the plugin-only runtime builder (inherited through build-archive-standalone.cjs).
          NIRS4ALL_REQUIRE_CONSTRAINTS: '1'

      - name: Notarize, staple, and rebuild final ZIP
        if: steps.notarization.outputs.enabled == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP_PATH="release/mac/nirs4all Studio.app"
          ZIP_PATH="$(pwd)/release/nirs4all Studio-${{ needs.prepare.outputs.version }}-all-in-one-mac-x64.zip"
          NOTARY_ZIP="${RUNNER_TEMP}/notary-mac-x64.zip"
          EXTRACT_ROOT="${RUNNER_TEMP}/archive-smoke"

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$NOTARY_ZIP"
          xcrun notarytool submit "$NOTARY_ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 600
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

          rm -f "$ZIP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"

          rm -rf "$EXTRACT_ROOT"
          mkdir -p "$EXTRACT_ROOT"
          ditto -x -k "$ZIP_PATH" "$EXTRACT_ROOT"

      - name: Extract archive for smoke test
        id: archive
        run: |
          ZIP_PATH="$(pwd)/release/nirs4all Studio-${{ needs.prepare.outputs.version }}-all-in-one-mac-x64.zip"
          EXTRACT_ROOT="${RUNNER_TEMP}/archive-smoke"
          rm -rf "$EXTRACT_ROOT"
          mkdir -p "$EXTRACT_ROOT"
          ditto -x -k "$ZIP_PATH" "$EXTRACT_ROOT"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "extract_root=$EXTRACT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Smoke test update ZIP permissions
        run: python3 scripts/smoke-update-zip-permissions.py --archive "${{ steps.archive.outputs.zip_path }}" --platform darwin

      - name: Smoke test offline all-in-one launch
        run: node scripts/smoke-archive-standalone.cjs --extracted-root "${{ steps.archive.outputs.extract_root }}" --platform darwin

      - name: Smoke test self-update (download -> apply -> relaunch)
        # Non-blocking: this real-Electron smoke (full-tree download + apply +
        # relaunch) is too timing-sensitive under CI load to gate releases; the
        # blocking 'offline all-in-one launch' smoke remains the release gate.
        continue-on-error: true
        timeout-minutes: 5
        run: node scripts/smoke-self-update.cjs --extracted-root "${{ steps.archive.outputs.extract_root }}" --platform darwin

      - name: Cleanup keychain
        if: always()
        run: |
          KEYCHAIN_PATH=${{ runner.temp }}/build.keychain
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

      - name: Generate checksum
        run: |
          FILE="${{ steps.archive.outputs.zip_path }}"
          shasum -a 256 "$FILE" > "$FILE.sha256"

      # Upload as a workflow artifact (like every other archive job) so the
      # single `Create Release` job consolidates and publishes it. Publishing to
      # the release here too made macOS x64 a second publisher, which collided
      # with `Create Release` on a fresh tag (workflow_dispatch) — duplicate
      # release / "already_exists" at finalize.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: archive-macos-x64
          path: |
            ${{ steps.archive.outputs.zip_path }}
            ${{ steps.archive.outputs.zip_path }}.sha256
          retention-days: 5

