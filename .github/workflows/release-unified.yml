# Unified Release Workflow
# One installer format per OS: NSIS, DMG (one per CPU), DEB.
# Full E2E, scientific journeys and application migration qualify locally.
# Hosted jobs build installers and smoke each actual packaged UI only.
#   - Native Docker image (static frontend + Rust sidecar)
#
# Trigger: tag v* or manual dispatch
# Phase 3 (CI/CD Hardening) + Phase 4 (Code Signing & macOS)
name: Release

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., 1.2.0)'
        required: true
        type: string
      publish_existing_tag:
        description: 'Publish a retry for an existing immutable tag using this workflow fix'
        required: false
        default: false
        type: boolean
      macos_arm64_only:
        description: 'Retry only the macOS ARM installer; other existing artifacts remain unchanged'
        required: false
        default: false
        type: boolean
      skip_docker:
        description: 'Skip Docker image builds'
        required: false
        default: false
        type: boolean
      include_macos_x64:
        description: 'Also qualify and publish the optional Intel Mac installer'
        required: false
        default: false
        type: boolean

env:
  APP_NAME: nirs4all Studio
  APP_ID: com.nirs4all.webapp
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.11'
  # Release archives/images must be reproducible. Keep these refs pinned to the
  # selected immutable releases and update them with the ecosystem release board.
  # SDK source and normalized wheel are exact; conversion-tools retains its PyPI proof.
  NIRS4ALL_PUBLICATION_STATUS: source-built
  NIRS4ALL_LIBRARY_REF: 48542f1a48ee005eea8d49da3756cd6b192d03df
  NIRS4ALL_SOURCE_EPOCH: '1791533216'
  DAG_ML_REF: 6f4044b45028a90a92d3f29287e67779bb5fd0b9
  DAG_ML_DATA_REF: 78719b68c8e9ffd4c2035792574b8da33387d237
  NIRS4ALL_TOOLS_REF: ca5cc30c4f7ab748142cfe25ea6d6b3e4c983cc8
  NIRS4ALL_SOURCE_URL: https://github.com/GBeurier/nirs4all/archive/48542f1a48ee005eea8d49da3756cd6b192d03df.tar.gz
  NIRS4ALL_WHEEL_URL: ''
  NIRS4ALL_WHEEL_SHA256: 162306982aa142e201f45095d4c5aee2bcb164a1bbc8b86dbcc9dfcf72587858
  DAG_ML_SOURCE_URL: https://github.com/GBeurier/dag-ml/archive/6f4044b45028a90a92d3f29287e67779bb5fd0b9.tar.gz
  DAG_ML_DATA_SOURCE_URL: https://github.com/GBeurier/dag-ml-data/archive/78719b68c8e9ffd4c2035792574b8da33387d237.tar.gz
  NIRS4ALL_TOOLS_SOURCE_URL: https://github.com/GBeurier/nirs4all-tools/archive/ca5cc30c4f7ab748142cfe25ea6d6b3e4c983cc8.tar.gz
  NIRS4ALL_TOOLS_WHEEL_URL: https://files.pythonhosted.org/packages/10/19/68649801e059cf243393585e75a7ca125cddde202d12f555eed1baeb159a/nirs4all_tools-0.0.8-py3-none-any.whl

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Prepare: Extract version, validate, determine build matrix
  # ═══════════════════════════════════════════════════════════════════════════
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      skip_docker: ${{ steps.flags.outputs.skip_docker }}
      include_macos_x64: ${{ steps.flags.outputs.include_macos_x64 }}
      macos_arm64_only: ${{ steps.flags.outputs.macos_arm64_only }}
      # Publication occurs for a tag push or an explicit existing-tag retry.
      # Other dispatches build and smoke without publishing.
      is_tag_release: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_existing_tag == true) }}
      # Signing detection computed once, here, from `secrets` — which can be read
      # in a step `env:` but never in a job-level `if:`. Build jobs consume these
      # via needs.prepare.outputs.* (reliable, unlike the old per-step env probe).
      has_windows_signing: ${{ steps.signing.outputs.has_windows_signing }}
      has_macos_signing: ${{ steps.signing.outputs.has_macos_signing }}
      # Resolve once to an immutable commit; every platform checks out the
      # identical source even if a tag is moved while jobs are queued.
      checkout_ref: ${{ steps.checkout_ref.outputs.checkout_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"

          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT

          echo "## Build Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: $TAG" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Prerelease**: $PRERELEASE" >> $GITHUB_STEP_SUMMARY

      - name: Resolve checkout ref
        id: checkout_ref
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # The default checkout is the event's commit, not a later tag value.
            REF="$(git rev-parse 'HEAD^{commit}')"
          elif git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 origin "refs/tags/${TAG}"
            REF="$(git rev-parse 'FETCH_HEAD^{commit}')"
          else
            if [[ '${{ inputs.publish_existing_tag }}' == 'true' ]]; then
              echo '::error::Publication retry requires an existing immutable tag'
              exit 1
            fi
            # workflow_dispatch against a tag that does not exist yet (smoke test):
            # fall back to the triggering commit so checkout always succeeds and
            # we never silently build the wrong branch under the tag's version.
            REF="$GITHUB_SHA"
            echo "::warning::Dispatch tag '${TAG}' does not exist as a ref; build jobs will use the triggering commit $GITHUB_SHA (version is still stamped as ${{ steps.version.outputs.version }})."
          fi
          if [[ ! "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Release source must resolve to an immutable commit SHA"
            exit 1
          fi
          echo "checkout_ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Resolved checkout SHA: $REF"
          echo "- **Checkout ref**: \`$REF\`" >> $GITHUB_STEP_SUMMARY

      - name: Validate pinned runtime dependency refs
        shell: bash
        run: |
          node scripts/verify-runtime-cohort.cjs
          if [[ "$NIRS4ALL_PUBLICATION_STATUS" != "source-built" ]]; then
            echo "::error::Pinned nirs4all requires its qualified immutable source build"
            exit 1
          fi
          for value in "$NIRS4ALL_LIBRARY_REF" "$DAG_ML_REF" "$DAG_ML_DATA_REF" "$NIRS4ALL_TOOLS_REF"; do
            if [[ ! "$value" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Release runtime dependency refs must be immutable 40-char SHAs, got '$value'"
              exit 1
            fi
          done
          for url in "$NIRS4ALL_SOURCE_URL" "$DAG_ML_SOURCE_URL" "$DAG_ML_DATA_SOURCE_URL" "$NIRS4ALL_TOOLS_SOURCE_URL"; do
            if [[ "$url" == *"/refs/heads/"* ]]; then
              echo "::error::Release runtime source URL must not use a moving branch tarball: $url"
              exit 1
            fi
          done
          if [[ "$NIRS4ALL_SOURCE_URL" != "https://github.com/GBeurier/nirs4all/archive/$NIRS4ALL_LIBRARY_REF.tar.gz" ||
                "$NIRS4ALL_SOURCE_EPOCH" != "1791533216" || -n "$NIRS4ALL_WHEEL_URL" ]]; then
            echo "::error::SDK source build must match the exact commit/epoch and cannot substitute a registry wheel"
            exit 1
          fi
          if [[ ! "$NIRS4ALL_WHEEL_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Pinned nirs4all wheel digest must be a lowercase SHA-256"
            exit 1
          fi

      - name: Detect signing secrets
        id: signing
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$WINDOWS_CERT_BASE64" ] && [ -n "$WINDOWS_CERT_PASSWORD" ]; then
            echo "has_windows_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_windows_signing=false" >> "$GITHUB_OUTPUT"
            echo "Windows signing secrets incomplete (WINDOWS_CERT_BASE64 / WINDOWS_CERT_PASSWORD)."
          fi

          macos_missing=()
          for secret_name in APPLE_CERT_BASE64 APPLE_CERT_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!secret_name}" ]; then
              macos_missing+=("$secret_name")
            fi
          done
          if [ ${#macos_missing[@]} -eq 0 ]; then
            echo "has_macos_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_macos_signing=false" >> "$GITHUB_OUTPUT"
            echo "macOS signing/notarization secrets missing: ${macos_missing[*]}"
          fi

      - name: Determine build flags
        id: flags
        run: |
          echo "macos_arm64_only=${{ inputs.macos_arm64_only || 'false' }}" >> $GITHUB_OUTPUT
          echo "skip_docker=${{ inputs.skip_docker || 'false' }}" >> $GITHUB_OUTPUT
          echo "include_macos_x64=${{ inputs.include_macos_x64 || vars.STUDIO_INCLUDE_MACOS_X64 == 'true' }}" >> $GITHUB_OUTPUT

  # Run the required checks on the exact Studio commit and pinned library refs.
  # A tag or manual dispatch must not bypass the PR quality gate.
  quality:
    name: Qualify release commit
    if: needs.prepare.outputs.macos_arm64_only != 'true'
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ needs.prepare.outputs.checkout_ref }}
      nirs4all_library_ref: 1a828c3cad6b6571cbe14b9bd7da2f9f1db767cc
      dag_ml_ref: 6f4044b45028a90a92d3f29287e67779bb5fd0b9
      dag_ml_data_ref: 78719b68c8e9ffd4c2035792574b8da33387d237

  # Build the pinned SDK once and acquire the unchanged public conversion-tools.
  # Every distributable consumes the same normalized, hash-verified payloads.
  pinned-plugin-wheels:
    name: Acquire pinned plugin wheels
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build SDK and verify canonical plugin wheels
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        run: |
          python -m pip install --upgrade pip==26.2.1
          mkdir -p dist/pinned-plugin-wheels
          node scripts/setup-python-env.cjs \
            --build-plugin-wheel dist/pinned-plugin-wheels/nirs4all-1.4.7-py3-none-any.whl \
            --build-python python
          curl --fail --location --proto "=https" --tlsv1.2 \
            --output dist/pinned-plugin-wheels/nirs4all_tools-0.0.8-py3-none-any.whl \
            "$NIRS4ALL_TOOLS_WHEEL_URL"
          cd dist/pinned-plugin-wheels
          echo "$NIRS4ALL_WHEEL_SHA256  nirs4all-1.4.7-py3-none-any.whl" | sha256sum --check --strict
          echo '9b152be79b7d510406d10da1cf097c5d67176334e2d54de0fd49ef0757774310  nirs4all_tools-0.0.8-py3-none-any.whl' | sha256sum --check --strict

      - name: Prove deterministic plugin runtime closure
        run: >-
          node scripts/verify-plugin-runtime-reproducibility.cjs
          --plugin-wheel dist/pinned-plugin-wheels/nirs4all-1.4.7-py3-none-any.whl
          --tools-wheel dist/pinned-plugin-wheels/nirs4all_tools-0.0.8-py3-none-any.whl
          --evidence dist/plugin-runtime-reproducibility-${{ runner.os }}-${{ runner.arch }}.json

      - name: Upload plugin runtime reproducibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: plugin-runtime-reproducibility
          path: dist/plugin-runtime-reproducibility-*.json
          if-no-files-found: error

      - name: Upload canonical wheels
        uses: actions/upload-artifact@v4
        with:
          name: pinned-plugin-wheels
          path: dist/pinned-plugin-wheels/*.whl
          if-no-files-found: error
          retention-days: 5

  # ═══════════════════════════════════════════════════════════════════════════
  # Installer: Linux x64 (Electron + Rust sidecar + plugin-only CPython closure)
  # ═══════════════════════════════════════════════════════════════════════════
  installer-linux:
    name: Installer — Linux x64
    if: needs.prepare.outputs.macos_arm64_only != 'true'
    needs: [prepare, pinned-plugin-wheels]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgirepository1.0-dev \
            libcairo2-dev \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1

      - name: Install npm dependencies
        run: npm ci

      - name: Download canonical plugin wheels
        uses: actions/download-artifact@v4
        with:
          name: pinned-plugin-wheels
          path: _deps/pinned-plugin-wheels

      - name: Build exact native Methods runtime
        uses: ./.github/actions/build-native-methods
        with:
          platform: linux
          arch: x64

      - name: Verify exact nirs4all-ui package
        run: npm run check:ui-package

      - name: Update package.json version
        run: npm version ${{ needs.prepare.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Build frontend (Electron mode)
        run: npm run build:electron

      - name: Write version.json
        run: |
          cat > version.json << EOF
          {
            "version": "${{ needs.prepare.outputs.version }}",
            "build_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ needs.prepare.outputs.checkout_ref }}"
          }
          EOF

      - name: Build pinned plugin-only CPython runtime
        run: node scripts/bake-python-plugin-runtime.cjs --plugin-wheel _deps/pinned-plugin-wheels/nirs4all-1.4.7-py3-none-any.whl --tools-wheel _deps/pinned-plugin-wheels/nirs4all_tools-0.0.8-py3-none-any.whl

      - name: Build and smoke native sidecar
        run: |
          node scripts/build-native-sidecar.cjs --target x86_64-unknown-linux-gnu
          test -x backend-dist/native/studio-sidecar
          node scripts/native-runtime-contract.cjs --backend-root backend-dist --artifact-boundary-root backend-dist --platform linux --arch x64 --require-bundled-python-plugin --require-bundled-methods
          backend-dist/native/studio-sidecar --smoke-readiness

      - name: Package with electron-builder
        run: npx electron-builder --config electron-builder.installer.yml --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaged native sidecar
        run: |
          SIDECAR="$(find release -type f -path '*/resources/backend/native/studio-sidecar' -print -quit)"
          test -n "$SIDECAR"
          test -x "$SIDECAR"
          BACKEND_ROOT="$(dirname "$(dirname "$SIDECAR")")"
          ARTIFACT_BOUNDARY="$(dirname "$(dirname "$BACKEND_ROOT")")"
          node scripts/native-runtime-contract.cjs --backend-root "$BACKEND_ROOT" --artifact-boundary-root "$ARTIFACT_BOUNDARY" --platform linux --arch x64 --require-bundled-python-plugin --require-bundled-methods
          "$SIDECAR" --smoke-readiness
          test -f "$ARTIFACT_BOUNDARY/chrome-sandbox"
          sudo chown root:root "$ARTIFACT_BOUNDARY/chrome-sandbox"
          sudo chmod 4755 "$ARTIFACT_BOUNDARY/chrome-sandbox"
          test "$(stat -c '%u:%g:%a' "$ARTIFACT_BOUNDARY/chrome-sandbox")" = '0:0:4755'

      - name: Qualify Linux CPU closure without optional system thread pools
        run: |
          sudo apt-get install -y --no-install-recommends bubblewrap binutils
          PYTHON="$(find release -type f -path '*/resources/backend/python-runtime/python/bin/python3' -print -quit)"
          test -n "$PYTHON"
          python3 -B scripts/verify-linux-cpu-closure.py --runtime-root "$(dirname "$(dirname "$PYTHON")")" --output "$RUNNER_TEMP/linux-installer-cpu-closure.json"

      - name: Preserve Linux installer CPU closure proof
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux-cpu-closure-proof
          path: ${{ runner.temp }}/linux-installer-cpu-closure.json
          if-no-files-found: error
          retention-days: 14

      - name: Generate checksums
        run: |
          cd release
          for f in *.deb; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done

      - name: Smoke packaged UI and runtime contract
        timeout-minutes: 8
        env:
          NIRS4ALL_QUALIFICATION_PERFORMANCE_POLICY: github-observational
          RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.checkout_ref }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          installers=(release/*.deb)
          test "${#installers[@]}" = 1
          xvfb-run -a node scripts/smoke-packaged-ui.cjs --extracted-root release/linux-unpacked --platform linux --timeout-ms 120000 --installer "${installers[0]}" --output "$RUNNER_TEMP/packaged-ui-smoke.json"

      - name: Preserve packaged UI smoke proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-ui-linux-proof
          path: ${{ runner.temp }}/packaged-ui-smoke.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux-x64-payload
          path: |
            release/*.deb
            release/*.sha256
            release/*.yml
          retention-days: 5

  # ═══════════════════════════════════════════════════════════════════════════
  # Installer: Windows x64 (Electron + Rust sidecar + plugin-only CPython closure)
  # ═══════════════════════════════════════════════════════════════════════════
  installer-windows:
    name: Installer — Windows x64
    if: needs.prepare.outputs.macos_arm64_only != 'true'
    needs: [prepare, pinned-plugin-wheels]
    # Methods' release preset is intentionally bound to VS 17 / 2022.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Note — building an unsigned Windows installer (no signing secrets)
        if: needs.prepare.outputs.is_tag_release == 'true' && needs.prepare.outputs.has_windows_signing != 'true'
        shell: bash
        run: |
          echo "::warning::No Windows code-signing secrets set — publishing an UNSIGNED installer. Users see a SmartScreen prompt on first run (More info > Run anyway). This is fine for this project; add WINDOWS_CERT_BASE64 + WINDOWS_CERT_PASSWORD to sign."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      - name: Download canonical plugin wheels
        uses: actions/download-artifact@v4
        with:
          name: pinned-plugin-wheels
          path: _deps/pinned-plugin-wheels

      - name: Build exact native Methods runtime
        uses: ./.github/actions/build-native-methods
        with:
          platform: win32
          arch: x64

      - name: Verify exact nirs4all-ui package
        run: npm run check:ui-package

      - name: Update package.json version
        run: npm version ${{ needs.prepare.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Build frontend (Electron mode)
        run: npm run build:electron

      - name: Write version.json
        shell: pwsh
        run: |
          @{
            version = "${{ needs.prepare.outputs.version }}"
            build_date = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            commit = "${{ needs.prepare.outputs.checkout_ref }}"
          } | ConvertTo-Json | Out-File -FilePath version.json -Encoding utf8

      - name: Build pinned plugin-only CPython runtime
        run: node scripts/bake-python-plugin-runtime.cjs --plugin-wheel _deps/pinned-plugin-wheels/nirs4all-1.4.7-py3-none-any.whl --tools-wheel _deps/pinned-plugin-wheels/nirs4all_tools-0.0.8-py3-none-any.whl

      - name: Build and smoke native sidecar
        shell: pwsh
        run: |
          node scripts/build-native-sidecar.cjs --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sidecar = "backend-dist/native/studio-sidecar.exe"
          if (-not (Test-Path -LiteralPath $sidecar -PathType Leaf)) {
            throw "Native Studio sidecar not found: $sidecar"
          }
          node scripts/native-runtime-contract.cjs --backend-root backend-dist --artifact-boundary-root backend-dist --platform win32 --arch x64 --require-bundled-python-plugin --require-bundled-methods
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $sidecar --smoke-readiness
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ── Windows Code Signing (Phase 4 — P4-3) ──
      - name: Import code signing certificate
        if: needs.prepare.outputs.has_windows_signing == 'true'
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64)
          [IO.File]::WriteAllBytes("${{ runner.temp }}\cert.pfx", $certBytes)
          echo "CSC_LINK=${{ runner.temp }}\cert.pfx" >> $env:GITHUB_ENV
          echo "CSC_KEY_PASSWORD=$($env:WINDOWS_CERT_PASSWORD)" >> $env:GITHUB_ENV

      - name: Package with electron-builder
        run: npx electron-builder --config electron-builder.installer.yml --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Payload execution is independent of Authenticode. The existing
      # secret-backed signature verification below remains authoritative.
      - name: Verify packaged native sidecar
        shell: pwsh
        run: |
          $sidecar = Get-ChildItem -Path release -Filter studio-sidecar.exe -File -Recurse |
            Where-Object { $_.FullName -match '[\\/]resources[\\/]backend[\\/]native[\\/]studio-sidecar\.exe$' } |
            Select-Object -First 1
          if (-not $sidecar) {
            throw "Packaged native Studio sidecar not found under release/"
          }
          $backendRoot = Split-Path -Parent (Split-Path -Parent $sidecar.FullName)
          $artifactBoundary = Split-Path -Parent (Split-Path -Parent $backendRoot)
          node scripts/native-runtime-contract.cjs --backend-root $backendRoot --artifact-boundary-root $artifactBoundary --platform win32 --arch x64 --require-bundled-python-plugin --require-bundled-methods
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $sidecar.FullName --smoke-readiness
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Authenticode signature
        if: needs.prepare.outputs.has_windows_signing == 'true'
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem release -Include *.exe -Recurse
          if (-not $artifacts) {
            Write-Error "No .exe artifacts found to verify."
            exit 1
          }
          $failed = $false
          foreach ($exe in $artifacts) {
            $sig = Get-AuthenticodeSignature $exe.FullName
            Write-Host "$($exe.Name): $($sig.Status)"
            if ($sig.Status -ne 'Valid') {
              Write-Host "::error::Authenticode signature for $($exe.Name) is '$($sig.Status)', expected 'Valid'."
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Clean up certificate
        if: always()
        shell: pwsh
        run: Remove-Item "${{ runner.temp }}\cert.pfx" -ErrorAction SilentlyContinue

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem release -File -Filter '*.exe' | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii -NoNewline
          }

      - name: Smoke packaged UI and runtime contract
        timeout-minutes: 8
        env:
          NIRS4ALL_QUALIFICATION_PERFORMANCE_POLICY: github-observational
          RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.checkout_ref }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem release -File -Filter '*.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          node scripts/smoke-packaged-ui.cjs --extracted-root release/win-unpacked --platform win32 --timeout-ms 120000 --installer $installers[0].FullName --output "$env:RUNNER_TEMP/packaged-ui-smoke.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve packaged UI smoke proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-ui-windows-proof
          path: ${{ runner.temp }}/packaged-ui-smoke.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows-x64-payload
          path: |
            release/*.exe
            release/*.sha256
            release/*.yml
          retention-days: 5

  # ═══════════════════════════════════════════════════════════════════════════
  # Installer: macOS x64 (Intel) — Phase 4: signed + notarized
  # ═══════════════════════════════════════════════════════════════════════════
  installer-macos-x64:
    name: Installer — macOS x64
    needs: [prepare, pinned-plugin-wheels]
    if: needs.prepare.outputs.include_macos_x64 == 'true'
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Note — building an unsigned macOS DMG (no Apple signing secrets)
        if: needs.prepare.outputs.is_tag_release == 'true' && needs.prepare.outputs.has_macos_signing != 'true'
        run: |
          echo "::warning::No Apple signing/notarization secrets set — publishing an UNSIGNED, un-notarized DMG. Users must right-click > Open on first launch (Gatekeeper). This is fine for this project; add APPLE_* secrets to sign + notarize."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install npm dependencies
        run: npm ci

      - name: Download canonical plugin wheels
        uses: actions/download-artifact@v4
        with:
          name: pinned-plugin-wheels
          path: _deps/pinned-plugin-wheels

      - name: Build exact native Methods runtime
        uses: ./.github/actions/build-native-methods
        with:
          platform: darwin
          arch: x64

      - name: Verify exact nirs4all-ui package
        run: npm run check:ui-package

      - name: Update package.json version
        run: npm version ${{ needs.prepare.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Build frontend (Electron mode)
        run: npm run build:electron

      - name: Write version.json
        run: |
          cat > version.json << EOF
          {
            "version": "${{ needs.prepare.outputs.version }}",
            "build_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ needs.prepare.outputs.checkout_ref }}"
          }
          EOF

      - name: Build pinned plugin-only CPython runtime
        run: node scripts/bake-python-plugin-runtime.cjs --plugin-wheel _deps/pinned-plugin-wheels/nirs4all-1.4.7-py3-none-any.whl --tools-wheel _deps/pinned-plugin-wheels/nirs4all_tools-0.0.8-py3-none-any.whl

      - name: Build and smoke native sidecar
        run: |
          node scripts/build-native-sidecar.cjs --target x86_64-apple-darwin
          test -x backend-dist/native/studio-sidecar
          node scripts/native-runtime-contract.cjs --backend-root backend-dist --artifact-boundary-root backend-dist --platform darwin --arch x64 --require-bundled-python-plugin --require-bundled-methods
          if [ "$(uname -m)" = "x86_64" ]; then
            backend-dist/native/studio-sidecar --smoke-readiness
          else
            echo "Skipping x86_64 sidecar execution on $(uname -m); packaging checks still apply."
          fi

      # ── macOS Code Signing (Phase 4 — P4-1) ──
      - name: Import Apple Developer certificate
        if: needs.prepare.outputs.has_macos_signing == 'true'
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=${{ runner.temp }}/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$APPLE_CERT_BASE64" | base64 --decode > ${{ runner.temp }}/cert.p12
          security import ${{ runner.temp }}/cert.p12 -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

          # Export for electron-builder (keychain-based signing, no file reference needed)
          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> $GITHUB_ENV

      - name: Package with electron-builder
        run: npx electron-builder --config electron-builder.installer.yml --mac --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder reads these for signing
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # This validates the unpacked payload only. The existing secret-backed
      # DMG notarization, stapling, and signature checks remain authoritative.
      - name: Verify packaged native sidecar
        run: |
          SIDECAR="$(find release -type f -path '*/Contents/Resources/backend/native/studio-sidecar' -print -quit)"
          test -n "$SIDECAR"
          test -x "$SIDECAR"
          BACKEND_ROOT="$(dirname "$(dirname "$SIDECAR")")"
          ARTIFACT_BOUNDARY="$(dirname "$(dirname "$(dirname "$BACKEND_ROOT")")")"
          node scripts/native-runtime-contract.cjs --backend-root "$BACKEND_ROOT" --artifact-boundary-root "$ARTIFACT_BOUNDARY" --platform darwin --arch x64 --require-bundled-python-plugin --require-bundled-methods
          if [ "$(uname -m)" = "x86_64" ]; then
            "$SIDECAR" --smoke-readiness
          else
            echo "Skipping packaged x86_64 sidecar execution on $(uname -m)."
          fi

      # ── macOS Notarization (Phase 4 — P4-2) ──
      - name: Notarize macOS DMG
        if: needs.prepare.outputs.has_macos_signing == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG=$(ls release/*.dmg 2>/dev/null | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::No DMG found to notarize."
            exit 1
          fi
          echo "Notarizing $DMG..."
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 600

          echo "Stapling notarization ticket..."
          xcrun stapler staple "$DMG"
          echo "Notarization complete."

      - name: Verify signature and notarization
        if: needs.prepare.outputs.has_macos_signing == 'true'
        run: |
          DMG=$(ls release/*.dmg 2>/dev/null | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::No DMG found to verify."
            exit 1
          fi
          echo "Validating stapled ticket on $DMG..."
          xcrun stapler validate "$DMG"
          echo "Gatekeeper assessment of the disk image..."
          spctl --assess --type open --context context:primary-signature -vv "$DMG"

          echo "Mounting DMG to verify the app bundle..."
          MOUNT_DIR="$(mktemp -d)"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT_DIR"
          APP=$(ls -d "$MOUNT_DIR"/*.app 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            hdiutil detach "$MOUNT_DIR" || true
            echo "::error::No .app found inside the mounted DMG."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          # The notarization ticket is stapled to the DMG (above), not to the
          # inner .app, so `stapler validate "$APP"` would always fail here.
          # spctl assesses the app against the notary record (online) instead.
          spctl --assess --type exec -vv "$APP"
          hdiutil detach "$MOUNT_DIR"
          echo "Signature + notarization verified."

      - name: Cleanup keychain
        if: always()
        run: |
          KEYCHAIN_PATH=${{ runner.temp }}/build.keychain
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

      - name: Generate checksums
        run: |
          cd release
          for f in *.dmg; do
            [ -f "$f" ] && shasum -a 256 "$f" > "$f.sha256"
          done

      - name: Smoke packaged UI and runtime contract
        timeout-minutes: 8
        env:
          NIRS4ALL_QUALIFICATION_PERFORMANCE_POLICY: github-observational
          RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.checkout_ref }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          installers=(release/*.dmg)
          test "${#installers[@]}" = 1
          export TMPDIR="$(cd "$RUNNER_TEMP" && pwd -P)"
          node scripts/smoke-packaged-ui.cjs --extracted-root release/mac --platform darwin --timeout-ms 120000 --installer "${installers[0]}" --output "$RUNNER_TEMP/packaged-ui-smoke.json"

      - name: Preserve packaged UI smoke proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-ui-macos-x64-proof
          path: ${{ runner.temp }}/packaged-ui-smoke.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos-x64-payload
          path: |
            release/*.dmg
            release/*.sha256
            release/*.yml
          retention-days: 5

