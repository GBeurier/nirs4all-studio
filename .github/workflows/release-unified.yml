name: Python recovery installers

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: 'Promote this successful qualification run; leave empty to build candidates'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: python-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    if: inputs.candidate_run_id == ''
    runs-on: ubuntu-22.04
    # A stalled browser download must fail visibly instead of blocking a release forever.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: npm ci --ignore-scripts
      - run: npm run smoke:nirs4all-ui-package
      - run: npm run lint:tsc
      - name: Build the canonical workspace-compatible Python library
        run: python scripts/build-recovery-library.py
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-library-wheel
          path: vendor/python/
          if-no-files-found: error
      - run: python -m pip install -r requirements-cpu.txt vendor/python/nirs4all-1.0.3-py3-none-any.whl pytest pytest-asyncio pytest-timeout pytest-xdist matplotlib==3.10.1 xgboost==3.0.0 lightgbm==4.6.0
      - name: Test the corrected scientific results, compatibility and installation logs
        run: >-
          python -m pytest tests/test_sequential_models_integration.py
          tests/test_recovery_legacy_replay.py tests/test_package_compatibility.py
          tests/test_optional_operator_preflight.py tests/test_install_log.py
          tests/test_dependency_scan_responsiveness.py tests/test_startup_import_readiness.py
          tests/test_recovery_promotion.py tests/test_runtime_mutation.py
          tests/test_runtime_grouping.py tests/test_filter_execution.py
          tests/test_spectral_pipeline_capabilities.py tests/test_operator_parameters.py tests/test_local_catalog_runner.py
          tests/test_multioutput_viewer_routes.py tests/test_merge_execution.py
          build/recovery-library-tests/test_workspace_schema_concurrency.py
          build/recovery-library-tests/test_concurrent_imports.py -q
      - name: Qualify installed scientific operators before building installers
        run: >-
          python scripts/qualify-local-catalog.py --execute --workers 2 --timeout 30
          --output qualification/scientific-core.json
          --policy scripts/catalog-cpu-expectations.json
      - name: Verify visible Results scores in the complete CPU catalog
        run: >-
          python scripts/audit-local-catalog-results.py --report qualification/scientific-core.json
          --output qualification/scientific-core-results.json
      - name: Preserve scientific qualification and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-scientific-qualification
          path: qualification/
          if-no-files-found: warn
      - name: Test the corrected Results, PCA, selection and installation interfaces
        run: >-
          npx vitest run electron/env/process-utils.test.ts
          src/components/setup/InstallationLogPanel.test.tsx
          src/components/experiments/NewExperimentSelectableOptionCard.test.tsx
          src/hooks/useNewExperimentSelectionFlow.test.tsx src/hooks/usePipelines.catalog.test.tsx
          src/components/playground/visualizations/__tests__/DimensionReductionPca.test.tsx
          src/pages/Results.trainingOnly.test.tsx src/components/scores/ScoreCardTrainingOnly.test.tsx
          src/components/setup/FirstInstall.restart.test.tsx src/context/MlReadinessContext.test.tsx
          src/context/ActiveRunContext.test.tsx src/hooks/usePipelineEditorPersistence.test.tsx
          src/hooks/useResultsPageState.test.tsx src/hooks/useAggregatedResultsPageState.test.tsx
          src/lib/runtimeMutationEvents.test.ts src/lib/pythonRuntimeSwitch.test.ts
          src/lib/__tests__/operatorCapability.test.ts
          src/components/predictions/viewer/__tests__/PredictionViewer.outputs.test.tsx
          src/components/pipeline-editor/__tests__/paletteBranchMerge.test.ts
      - name: Install the browser for the real results gate
        run: npx playwright install --with-deps chromium
      - name: Verify edited pipelines and visible results after a model failure
        run: npx playwright test --config=playwright.recovery.config.ts
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-browser-failures
          path: test-results/
          if-no-files-found: ignore


  installer:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: win32
            build_platform: win
            arch: x64
          - runner: ubuntu-22.04
            platform: linux
            build_platform: linux
            arch: x64
          - runner: macos-14
            platform: darwin
            build_platform: mac
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            build_platform: mac
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: recovery-library-wheel
          path: vendor/python/
      - name: Restore precompiled Mac Intel dependencies
        if: matrix.platform == 'darwin' && matrix.arch == 'x64'
        id: mac-intel-wheels
        uses: actions/cache/restore@v4
        with:
          path: |
            vendor/python/nirs4all_io-*.whl
            vendor/python/nirs4all_core-*.whl
            vendor/python/macos-intel-native-wheels.json
          key: recovery-macos-intel-py311-${{ hashFiles('scripts/build-macos-recovery-wheels.py', 'build/recovery-macos-intel.json') }}
      - name: Prepare Rust for Mac Intel dependency wheels
        if: matrix.platform == 'darwin' && matrix.arch == 'x64'
        uses: dtolnay/rust-toolchain@stable
      - name: Build missing Mac Intel wheels before packaging
        if: matrix.platform == 'darwin' && matrix.arch == 'x64'
        run: |
          python -m pip install maturin==1.14.1
          python scripts/build-macos-recovery-wheels.py --output vendor/python
      - name: Preserve compiled dependencies independently of installer qualification
        if: matrix.platform == 'darwin' && matrix.arch == 'x64' && steps.mac-intel-wheels.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            vendor/python/nirs4all_io-*.whl
            vendor/python/nirs4all_core-*.whl
            vendor/python/macos-intel-native-wheels.json
          key: ${{ steps.mac-intel-wheels.outputs.cache-primary-key }}
      - name: Build Python recovery installer
        run: npm run release -- --platform ${{ matrix.build_platform }} --flavor cpu
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ github.token }}
      # The 0.11.8 installer/update path is reused; this patch explicitly omits migration replay.
      - name: Smoke-test the installed application and restart persistence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SENTRY_DSN: ''
        run: |
          if [ '${{ matrix.platform }}' = linux ]; then
            xvfb-run -a node scripts/recovery-qualify-installer.cjs --platform '${{ matrix.platform }}' --release-root release --output 'qualification/${{ matrix.platform }}-${{ matrix.arch }}.json'
          else
            node scripts/recovery-qualify-installer.cjs --platform '${{ matrix.platform }}' --release-root release --output 'qualification/${{ matrix.platform }}-${{ matrix.arch }}.json'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.deb
            release/*.dmg
            release/*.sha256
            qualification/
          if-no-files-found: error

  docker:
    needs: quality
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: recovery-library-wheel
          path: vendor/python/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: nirs4all-studio:0.11.10
          cache-from: type=gha,scope=python-recovery
          cache-to: type=gha,mode=max,scope=python-recovery
      - name: Verify Python backend health and version
        shell: bash
        run: |
          trap 'docker logs recovery || true' EXIT
          docker run -d --name recovery -p 8000:8000 -e SENTRY_DSN= nirs4all-studio:0.11.10
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/system/readiness > readiness.json && python -c 'import json; assert json.load(open("readiness.json"))["ml_ready"] and json.load(open("readiness.json"))["workspace_ready"]'; then break; fi
            test "$(docker inspect -f '{{.State.Running}}' recovery)" = true
            sleep 1
          done
          python -c 'import json; r=json.load(open("readiness.json")); assert r["ml_ready"] and r["workspace_ready"]'
          docker exec recovery python -c 'import nirs4all; assert nirs4all.__version__ == "1.0.3"'
          python3 scripts/qualify-python-docker.py > docker-qualification.json
          docker save nirs4all-studio:0.11.10 | gzip > recovery-docker.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-docker
          path: |
            recovery-docker.tar.gz
            docker-qualification.json
          if-no-files-found: error

  promote:
    if: inputs.candidate_run_id != ''
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
    steps:
      - name: Resolve the successful qualification source
        id: qualified
        run: |
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > "$RUNNER_TEMP/recovery-candidate-run.json"
          python3 - <<'PYCODE'
          import json, os, pathlib, re
          run = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'recovery-candidate-run.json').read_text())
          repository = os.environ['GITHUB_REPOSITORY']
          assert run['id'] == int(os.environ['CANDIDATE_RUN_ID']), run
          assert run['status'] == 'completed' and run['conclusion'] == 'success', run
          assert run['event'] == 'workflow_dispatch', run
          assert run['path'] == '.github/workflows/release-unified.yml', run
          assert run['head_branch'] == 'recovery/python-studio', run
          assert run['repository']['full_name'] == repository, run
          assert run['head_repository']['full_name'] == repository, run
          assert run['head_repository']['id'] == run['repository']['id'], run
          source_sha = run['head_sha']
          assert re.fullmatch(r'[0-9a-f]{40}', source_sha), run
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'source_sha={source_sha}\n')
          PYCODE
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.qualified.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify the checked-out qualified release source
        env:
          QUALIFIED_SHA: ${{ steps.qualified.outputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"
          python3 - <<'PYCODE'
          import json
          assert json.load(open('package.json'))['version'] == '0.11.10'
          PYCODE
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
          pattern: recovery-*
          path: candidates
      - name: Verify installed-platform receipts and prepare installer checksums
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, pathlib, shutil
          root = pathlib.Path('candidates')
          assets = [p for p in root.rglob('*') if p.suffix in ('.exe', '.deb', '.dmg')]
          assert len(assets) == 4, assets
          reports = [json.loads(p.read_text()) for p in root.rglob('*.json') if p.parent.name == 'qualification']
          assert len(reports) == 4, reports
          assert {(r['platform'], r['arch']) for r in reports} == {('win32','x64'),('linux','x64'),('darwin','x64'),('darwin','arm64')}
          assert all(r['success'] and r['scope'] == 'installed_application' for r in reports)
          assert all(r['migration'] == {'status': 'not_requested'} for r in reports), 'This patch qualifies installed-app smoke, not an upgrade replay'
          library_root = root / 'recovery-library-wheel'
          library_proof = json.loads((library_root / 'provenance.json').read_text())
          library_wheel = library_root / library_proof['wheel']
          assert hashlib.file_digest(library_wheel.open('rb'), 'sha256').hexdigest() == library_proof['wheel_sha256']
          assert library_proof['source_commit'] == json.loads(pathlib.Path('build/recovery-library.json').read_text())['source_commit']
          assert all(r['nirs4all_version'] == '1.0.3' and r['nirs4all_wheel_sha256'] == library_proof['wheel_sha256'] for r in reports)
          docker_report = json.loads((root / 'recovery-docker/docker-qualification.json').read_text())
          assert docker_report['success'] and docker_report['samples'] == 1000 and docker_report['features'] == 256
          verified = {r['installer_sha256'] for r in reports}
          output = pathlib.Path('release-assets'); output.mkdir()
          for asset in assets:
              assert 'portable' not in asset.name.lower() and 'all-in-one' not in asset.name.lower()
              digest = hashlib.file_digest(asset.open('rb'), 'sha256').hexdigest()
              assert digest in verified, asset
              # Match GitHub's public filename normalization before generating
              # checksums, so downloaded sidecars resolve the actual payload.
              public_name = asset.name.replace(' ', '.')
              assert not (output / public_name).exists(), public_name
              shutil.copy2(asset, output / public_name)
              (output / (public_name + '.sha256')).write_text(digest + '  ' + public_name + '\n')
          (output / 'qualification.json').write_text(json.dumps(reports, indent=2))
          (output / 'library-provenance.json').write_text(json.dumps(library_proof, indent=2))
          PYCODE
      - name: Verify the qualified tag and any existing publication
        id: published
        env:
          QUALIFIED_SHA: ${{ steps.qualified.outputs.source_sha }}
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, subprocess, tempfile

          def github_json(endpoint, allow_missing=False):
              result = subprocess.run(['gh', 'api', endpoint], capture_output=True, text=True, timeout=60)
              payload = json.loads(result.stdout)
              if result.returncode:
                  if allow_missing and str(payload.get('status')) == '404':
                      return None
                  raise RuntimeError(f'GitHub API failed for {endpoint}: status {payload.get("status", "unknown")}')
              return payload

          def verify_tag(repository, tag, qualified_sha):
              value = github_json(f'repos/{repository}/git/ref/tags/{tag}')['object']
              # Resolve annotated tags too; never compare their object ID to a commit.
              for _ in range(10):
                  if value['type'] == 'commit':
                      assert value['sha'] == qualified_sha, 'Published tag does not identify the qualified source'
                      return
                  assert value['type'] == 'tag', 'Tag does not resolve to a commit'
                  value = github_json(f'repos/{repository}/git/tags/{value["sha"]}')['object']
              raise AssertionError('Too many annotated tag indirections')

          def verify_published_assets(release, expected_root, downloaded_root):
              assert release['tag_name'] == '0.11.10' and not release['draft'] and not release['prerelease'], 'Existing release is not the published recovery'
              expected = {item.name: item for item in expected_root.iterdir() if item.is_file()}
              assets = release['assets']
              names = [asset['name'] for asset in assets]
              assert len(names) == len(set(names)) and set(names) == set(expected), 'Existing release asset names differ'
              assert {item.name for item in downloaded_root.iterdir()} == set(expected), 'Downloaded asset set differs'
              for asset in assets:
                  downloaded = downloaded_root / asset['name']
                  assert asset['state'] == 'uploaded' and downloaded.stat().st_size == asset['size'], 'Published asset is incomplete'
                  digest = hashlib.file_digest(downloaded.open('rb'), 'sha256').hexdigest()
                  assert asset.get('digest') == f'sha256:{digest}', f'Published download digest mismatch: {asset["name"]}'
                  source = expected[asset['name']]
                  if asset['name'] in ('qualification.json', 'library-provenance.json'):
                      actual, qualified = json.loads(downloaded.read_text()), json.loads(source.read_text())
                      if asset['name'] == 'qualification.json':
                          key = lambda report: (report['platform'], report['arch'])
                          actual, qualified = sorted(actual, key=key), sorted(qualified, key=key)
                      assert actual == qualified, f'Published evidence differs: {asset["name"]}'
                  else:
                      assert digest == hashlib.file_digest(source.open('rb'), 'sha256').hexdigest(), f'Published bytes differ: {asset["name"]}'

          if __name__ == '__main__':
              repository = os.environ['GITHUB_REPOSITORY']
              verify_tag(repository, '0.11.10', os.environ['QUALIFIED_SHA'])
              release = github_json(f'repos/{repository}/releases/tags/0.11.10', allow_missing=True)
              if release is not None:
                  with tempfile.TemporaryDirectory(prefix='recovery-published-') as directory:
                      subprocess.run(['gh', 'release', 'download', '0.11.10', '--repo', repository, '--dir', directory], check=True, timeout=300)
                      verify_published_assets(release, pathlib.Path('release-assets'), pathlib.Path(directory))
                  print('Existing publication matches the qualified artifacts; no release or image will be modified.')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write(f'exists={str(release is not None).lower()}\n')
          PYCODE
      - uses: docker/login-action@v3
        if: steps.published.outputs.exists != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the already-qualified Docker image
        if: steps.published.outputs.exists != 'true'
        run: |
          gunzip -c candidates/recovery-docker/recovery-docker.tar.gz | docker load
          docker tag nirs4all-studio:0.11.10 ghcr.io/gbeurier/nirs4all-studio:0.11.10
          docker tag nirs4all-studio:0.11.10 ghcr.io/gbeurier/nirs4all-studio:latest
          docker push ghcr.io/gbeurier/nirs4all-studio:0.11.10
          docker push ghcr.io/gbeurier/nirs4all-studio:latest
      - name: Publish the recovery release
        if: steps.published.outputs.exists != 'true'
        run: gh release create 0.11.10 --repo "$GITHUB_REPOSITORY" --verify-tag --title 'Studio 0.11.10 — Scientific execution and reliability fixes' --notes-file RECOVERY_RELEASE.md --latest release-assets/*
