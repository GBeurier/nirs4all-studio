name: Python recovery installers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: npm ci --ignore-scripts
      - run: npm run smoke:nirs4all-ui-package
      - run: npm run lint:tsc
      - run: python -m pip install -r requirements-cpu.txt nirs4all==0.11.0 pytest pytest-asyncio pytest-timeout pytest-xdist
      - run: python -m pytest tests/test_workspace_manager_startup.py tests/test_recommended_config_api.py tests/test_recovery_dependency_profile.py -q

  installer:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: win32
            build_platform: win
            arch: x64
          - runner: ubuntu-22.04
            platform: linux
            build_platform: linux
            arch: x64
          - runner: macos-14
            platform: darwin
            build_platform: mac
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            build_platform: mac
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Build Python recovery installer
        run: npm run release -- --platform ${{ matrix.build_platform }} --flavor cpu
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ github.token }}
      - name: Qualify installation and populated-profile upgrade
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SENTRY_DSN: ''
        run: |
          if [ '${{ matrix.platform }}' = linux ]; then
            xvfb-run -a node scripts/recovery-qualify-installer.cjs --platform '${{ matrix.platform }}' --release-root release --output 'qualification/${{ matrix.platform }}-${{ matrix.arch }}.json' --previous-version 0.11.7
          else
            node scripts/recovery-qualify-installer.cjs --platform '${{ matrix.platform }}' --release-root release --output 'qualification/${{ matrix.platform }}-${{ matrix.arch }}.json' --previous-version 0.11.7
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.deb
            release/*.dmg
            release/*.sha256
            qualification/
          if-no-files-found: error

  docker:
    needs: quality
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: nirs4all-studio:0.11.8
          cache-from: type=gha,scope=python-recovery
          cache-to: type=gha,mode=max,scope=python-recovery
      - name: Verify Python backend health and version
        shell: bash
        run: |
          docker run -d --name recovery -p 8000:8000 -e SENTRY_DSN= nirs4all-studio:0.11.8
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/system/readiness > readiness.json && python -c 'import json; assert json.load(open("readiness.json"))["ml_ready"]'; then break; fi
            sleep 1
          done
          python -c 'import json; assert json.load(open("readiness.json"))["ml_ready"]'
          docker exec recovery python -c 'import nirs4all; assert nirs4all.__version__ == "0.11.0"'
          docker save nirs4all-studio:0.11.8 | gzip > recovery-docker.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-docker
          path: recovery-docker.tar.gz
          if-no-files-found: error
