  # ═══════════════════════════════════════════════════════════════════════════
  # Docker: static frontend + loopback Rust sidecar
  # ═══════════════════════════════════════════════════════════════════════════
  docker:
    name: Native Docker Image
    needs: prepare
    if: needs.prepare.outputs.skip_docker != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify fail-closed Docker contract
        run: npm run test:docker-runtime-contract

      - name: Build exact native Methods runtime
        uses: ./.github/actions/build-native-methods
        with:
          platform: linux
          arch: x64

      - name: Qualify native Archive V2 replay
        run: npm run test:native-archive-v2

      - name: Build and smoke native release candidate
        run: |
          docker build \
            --build-arg STUDIO_VERSION=${{ needs.prepare.outputs.version }} \
            --build-arg STUDIO_REVISION=${{ github.sha }} \
            --build-arg NIRS4ALL_METHODS_SHA256=${NIRS4ALL_BUILD_METHODS_SHA256} \
            --build-context methods-runtime="$(dirname "${NIRS4ALL_BUILD_METHODS_LIBRARY}")" \
            --tag nirs4all-studio:native-release-candidate \
            .
          bash scripts/smoke-docker-native-runtime.sh nirs4all-studio:native-release-candidate

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/gbeurier/nirs4all-studio:${{ needs.prepare.outputs.version }}
            ghcr.io/gbeurier/nirs4all-studio:latest
          build-args: |
            STUDIO_VERSION=${{ needs.prepare.outputs.version }}
            STUDIO_REVISION=${{ github.sha }}
            NIRS4ALL_METHODS_SHA256=${{ env.NIRS4ALL_BUILD_METHODS_SHA256 }}
          build-contexts: |
            methods-runtime=${{ env.NIRS4ALL_BUILD_METHODS_DIRECTORY }}
          cache-from: type=gha,scope=native-container
          cache-to: type=gha,mode=max,scope=native-container
          labels: |
            org.opencontainers.image.title=nirs4all Studio
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # ═══════════════════════════════════════════════════════════════════════════
  # Release: Consolidate all artifacts into GitHub Release
  # ═══════════════════════════════════════════════════════════════════════════
  release:
    name: Create Release
    needs:
      - prepare
      - installer-linux
      - installer-windows
      - installer-macos-x64
      - installer-macos-arm64
      - archive-windows
      - archive-linux
      - archive-macos-x64
      - archive-macos-arm64
      - docker
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.installer-linux.result == 'success' &&
      needs.installer-windows.result == 'success' &&
      needs.installer-macos-x64.result == 'success' &&
      needs.installer-macos-arm64.result == 'success' &&
      (
        needs.prepare.outputs.skip_all_in_one == 'true' ||
        (
          needs.archive-windows.result == 'success' &&
          needs.archive-linux.result == 'success' &&
          needs.archive-macos-x64.result == 'success' &&
          needs.archive-macos-arm64.result == 'success'
        )
      ) &&
      (
        needs.prepare.outputs.skip_docker == 'true' ||
        needs.docker.result == 'success'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '{installer,archive}-*'
          merge-multiple: false

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f \( \
            -name "*.AppImage" -o -name "*.deb" -o -name "*.exe" \
            -o -name "*.dmg" -o -name "*.zip" -o -name "*.tar.gz" \
            -o -name "*.sha256" \
          \) -exec cp {} release/ \; 2>/dev/null || true

          echo "## Release Assets" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d release ] && [ "$(ls -A release 2>/dev/null)" ]; then
            ls -lh release/ | while read line; do echo "    $line" >> $GITHUB_STEP_SUMMARY; done
          else
            echo "No assets found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Generate release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Collect job results
          INSTALLER_LINUX="${{ needs.installer-linux.result }}"
          INSTALLER_WINDOWS="${{ needs.installer-windows.result }}"
          INSTALLER_MACOS_X64="${{ needs.installer-macos-x64.result }}"
          INSTALLER_MACOS_ARM64="${{ needs.installer-macos-arm64.result }}"
          ARCHIVE_WIN="${{ needs.archive-windows.result }}"
          ARCHIVE_LINUX="${{ needs.archive-linux.result }}"
          ARCHIVE_MACOS_X64="${{ needs.archive-macos-x64.result }}"
          ARCHIVE_MACOS_ARM64="${{ needs.archive-macos-arm64.result }}"
          DOCKER="${{ needs.docker.result }}"

          cat > release_notes.md << NOTES
          ## nirs4all Studio ${VERSION}

          ### Installers (Recommended)

          Full desktop application with embedded Python environment and managed dependencies.
          After installation, use the first-launch wizard to configure GPU/framework preferences.

          | Platform | Architecture | File | Status |
          |----------|-------------|------|--------|
          | **Windows** | x64 | \`nirs4all Studio-${VERSION}-win-x64.exe\` / \`nirs4all Studio-${VERSION}-win-x64-portable.exe\` | ${INSTALLER_WINDOWS} |
          | **macOS** | Intel (x64) | \`nirs4all Studio-${VERSION}-mac-x64.dmg\` | ${INSTALLER_MACOS_X64} |
          | **macOS** | Apple Silicon (arm64) | \`nirs4all Studio-${VERSION}-mac-arm64.dmg\` | ${INSTALLER_MACOS_ARM64} |
          | **Linux** | x64 | \`nirs4all Studio-${VERSION}-linux-x64.AppImage\` / \`.deb\` | ${INSTALLER_LINUX} |

          ### All-in-one Bundles

          Self-contained Electron desktop bundles with a baked Python runtime.
          CPU-only product profile, \`torch\` included, first launch works offline, and no setup wizard is required.

          | Platform | Architecture | File | Status |
          |----------|-------------|------|--------|
          | **Windows** | x64 | \`nirs4all Studio-${VERSION}-all-in-one-win-x64.zip\` | ${ARCHIVE_WIN} |
          | **Linux** | x64 | \`nirs4all Studio-${VERSION}-all-in-one-linux-x64.tar.gz\` | ${ARCHIVE_LINUX} |
          | **macOS** | Intel (x64) | \`nirs4all Studio-${VERSION}-all-in-one-mac-x64.zip\` | ${ARCHIVE_MACOS_X64} |
          | **macOS** | Apple Silicon (arm64) | \`nirs4all Studio-${VERSION}-all-in-one-mac-arm64.zip\` | ${ARCHIVE_MACOS_ARM64} |

          ### Docker

          Server/HPC deployment — no Electron or Python HTTP backend. nginx
          serves the static renderer and proxies API/WebSocket traffic to the
          loopback-only Rust sidecar.

          \`\`\`bash
          docker pull ghcr.io/gbeurier/nirs4all-studio:${VERSION}
          docker run -p 8000:8000 ghcr.io/gbeurier/nirs4all-studio:${VERSION}
          \`\`\`

          | Runtime | Tag | Status |
          |---------|-----|--------|
          | Native Rust | \`ghcr.io/gbeurier/nirs4all-studio:${VERSION}\` | ${DOCKER} |

          ### Verification

          SHA256 checksums are provided as \`.sha256\` files for each download.

          \`\`\`bash
          # Linux/macOS
          sha256sum -c 'nirs4all Studio-${VERSION}-linux-x64.AppImage.sha256'

          # Windows (PowerShell)
          (Get-FileHash '.\nirs4all Studio-${VERSION}-win-x64.exe').Hash
          \`\`\`

          ### System Requirements

          - **Windows**: Windows 10+ (x64)
          - **macOS**: macOS 12+ (Intel or Apple Silicon)
          - **Linux**: Ubuntu 20.04+ or equivalent (x64)
          - **Docker**: OCI runtime on Linux x64

          ---
          *Commit: ${{ github.sha }}*
          NOTES

      - name: Create GitHub Release
        # Publish ONLY on a real tag push. workflow_dispatch is for build/smoke
        # validation (often a not-yet-existent tag) — it must never publish a
        # GitHub release. All build + smoke jobs above still run on dispatch.
        if: needs.prepare.outputs.is_tag_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: nirs4all Studio ${{ needs.prepare.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "## Release Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ needs.prepare.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag**: ${{ needs.prepare.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Prerelease**: ${{ needs.prepare.outputs.prerelease }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Installer Linux | ${{ needs.installer-linux.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Installer Windows | ${{ needs.installer-windows.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Installer macOS x64 | ${{ needs.installer-macos-x64.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Installer macOS arm64 | ${{ needs.installer-macos-arm64.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| All-in-one Windows | ${{ needs.archive-windows.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| All-in-one Linux | ${{ needs.archive-linux.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| All-in-one macOS x64 | ${{ needs.archive-macos-x64.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| All-in-one macOS arm64 | ${{ needs.archive-macos-arm64.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker | ${{ needs.docker.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Assets" >> $GITHUB_STEP_SUMMARY
          ls -1 release/ 2>/dev/null | while read f; do echo "- \`$f\`" >> $GITHUB_STEP_SUMMARY; done || echo "No assets" >> $GITHUB_STEP_SUMMARY
