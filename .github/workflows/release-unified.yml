name: Python recovery installers

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: 'Promote this successful qualification run; leave empty to build candidates'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: python-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    if: inputs.candidate_run_id == ''
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: npm ci --ignore-scripts
      - name: Compile both Windows installer phases before platform builds
        run: node scripts/tests/nsis-compile-check.cjs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run smoke:nirs4all-ui-package
      - run: npm run lint:tsc
      - name: Build the canonical workspace-compatible Python library
        run: python scripts/build-recovery-library.py
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-library-wheel
          path: vendor/python/
          if-no-files-found: error
      - run: python -m pip install -r requirements-cpu.txt vendor/python/nirs4all-1.0.2-py3-none-any.whl pytest pytest-asyncio pytest-timeout pytest-xdist
      - name: Qualify cold concurrent imports of the installed library wheel
        run: python -I -m pytest build/recovery-library-tests --import-mode=importlib -q
      - run: python -m pytest tests/test_workspace_manager_startup.py tests/test_recommended_config_api.py tests/test_recovery_dependency_profile.py tests/test_packaged_node_registry.py tests/test_nirs4all_release_pin.py tests/test_preview_eventloop.py tests/test_recovery_legacy_replay.py tests/test_runtime_engine.py tests/test_macos_recovery_wheel_builder.py -q
      - run: npx vitest run electron/env-manager.test.ts electron/env-inspection.test.ts electron/python-runtime-config.test.ts electron/workspace-location.test.ts src/components/datasets/DatasetWizard/PreviewStep.test.tsx
      - run: node --test scripts/tests/recovery-qualify-installer.test.cjs

  installer:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: win32
            build_platform: win
            arch: x64
          - runner: ubuntu-22.04
            platform: linux
            build_platform: linux
            arch: x64
          - runner: macos-14
            platform: darwin
            build_platform: mac
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            build_platform: mac
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: recovery-library-wheel
          path: vendor/python/
      - name: Restore precompiled Mac Intel dependencies
        if: matrix.platform == 'darwin' && matrix.arch == 'x64'
        id: mac-intel-wheels
        uses: actions/cache/restore@v4
        with:
          path: |
            vendor/python/nirs4all_io-*.whl
            vendor/python/nirs4all_core-*.whl
            vendor/python/macos-intel-native-wheels.json
          key: recovery-macos-intel-py311-${{ hashFiles('scripts/build-macos-recovery-wheels.py', 'build/recovery-macos-intel.json') }}
      - name: Prepare Rust for Mac Intel dependency wheels
        if: matrix.platform == 'darwin' && matrix.arch == 'x64'
        uses: dtolnay/rust-toolchain@stable
      - name: Build missing Mac Intel wheels before packaging
        if: matrix.platform == 'darwin' && matrix.arch == 'x64'
        run: |
          python -m pip install maturin==1.14.1
          python scripts/build-macos-recovery-wheels.py --output vendor/python
      - name: Preserve compiled dependencies independently of installer qualification
        if: matrix.platform == 'darwin' && matrix.arch == 'x64' && steps.mac-intel-wheels.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            vendor/python/nirs4all_io-*.whl
            vendor/python/nirs4all_core-*.whl
            vendor/python/macos-intel-native-wheels.json
          key: ${{ steps.mac-intel-wheels.outputs.cache-primary-key }}
      - name: Build Python recovery installer
        run: npm run release -- --platform ${{ matrix.build_platform }} --flavor cpu
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ github.token }}
      - name: Qualify installation and populated-profile upgrade
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SENTRY_DSN: ''
        run: |
          if [ '${{ matrix.platform }}' = linux ]; then
            xvfb-run -a node scripts/recovery-qualify-installer.cjs --platform '${{ matrix.platform }}' --release-root release --output 'qualification/${{ matrix.platform }}-${{ matrix.arch }}.json' --previous-version 0.11.7
          else
            node scripts/recovery-qualify-installer.cjs --platform '${{ matrix.platform }}' --release-root release --output 'qualification/${{ matrix.platform }}-${{ matrix.arch }}.json' --previous-version 0.11.7
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.deb
            release/*.dmg
            release/*.sha256
            qualification/
          if-no-files-found: error

  docker:
    needs: quality
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: recovery-library-wheel
          path: vendor/python/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: nirs4all-studio:0.11.8
          cache-from: type=gha,scope=python-recovery
          cache-to: type=gha,mode=max,scope=python-recovery
      - name: Verify Python backend health and version
        shell: bash
        run: |
          trap 'docker logs recovery || true' EXIT
          docker run -d --name recovery -p 8000:8000 -e SENTRY_DSN= nirs4all-studio:0.11.8
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/system/readiness > readiness.json && python -c 'import json; assert json.load(open("readiness.json"))["ml_ready"] and json.load(open("readiness.json"))["workspace_ready"]'; then break; fi
            test "$(docker inspect -f '{{.State.Running}}' recovery)" = true
            sleep 1
          done
          python -c 'import json; r=json.load(open("readiness.json")); assert r["ml_ready"] and r["workspace_ready"]'
          docker exec recovery python -c 'import nirs4all; assert nirs4all.__version__ == "1.0.2"'
          python3 scripts/qualify-python-docker.py > docker-qualification.json
          docker save nirs4all-studio:0.11.8 | gzip > recovery-docker.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-docker
          path: |
            recovery-docker.tar.gz
            docker-qualification.json
          if-no-files-found: error

  promote:
    if: inputs.candidate_run_id != ''
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require successful qualification of this exact commit
        run: |
          gh run view "$CANDIDATE_RUN_ID" --json conclusion,headSha,headBranch,workflowName,event > candidate-run.json
          python3 - <<'PYCODE'
          import json, os
          run = json.load(open('candidate-run.json'))
          assert run['conclusion'] == 'success', run
          assert run['headSha'] == os.environ['GITHUB_SHA'], run
          assert run['headBranch'] == 'recovery/python-studio', run
          assert run['workflowName'] == 'Python recovery installers', run
          assert run['event'] == 'workflow_dispatch', run
          assert json.load(open('package.json'))['version'] == '0.11.8'
          PYCODE
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
          pattern: recovery-*
          path: candidates
      - name: Verify installed-platform receipts and prepare installer checksums
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, pathlib, shutil
          root = pathlib.Path('candidates')
          assets = [p for p in root.rglob('*') if p.suffix in ('.exe', '.deb', '.dmg')]
          assert len(assets) == 4, assets
          reports = [json.loads(p.read_text()) for p in root.rglob('*.json') if p.parent.name == 'qualification']
          assert len(reports) == 4, reports
          assert {(r['platform'], r['arch']) for r in reports} == {('win32','x64'),('linux','x64'),('darwin','x64'),('darwin','arm64')}
          assert all(r['success'] and r['scope'] == 'installed_application' and r['migration']['success'] for r in reports)
          library_root = root / 'recovery-library-wheel'
          library_proof = json.loads((library_root / 'provenance.json').read_text())
          library_wheel = library_root / library_proof['wheel']
          assert hashlib.file_digest(library_wheel.open('rb'), 'sha256').hexdigest() == library_proof['wheel_sha256']
          assert library_proof['source_commit'] == json.loads(pathlib.Path('build/recovery-library.json').read_text())['source_commit']
          assert all(r['nirs4all_version'] == '1.0.2' and r['nirs4all_wheel_sha256'] == library_proof['wheel_sha256'] for r in reports)
          docker_report = json.loads((root / 'recovery-docker/docker-qualification.json').read_text())
          assert docker_report['success'] and docker_report['samples'] == 1000 and docker_report['features'] == 256
          verified = {r['installer_sha256'] for r in reports}
          output = pathlib.Path('release-assets'); output.mkdir()
          for asset in assets:
              assert 'portable' not in asset.name.lower() and 'all-in-one' not in asset.name.lower()
              digest = hashlib.file_digest(asset.open('rb'), 'sha256').hexdigest()
              assert digest in verified, asset
              # Match GitHub's public filename normalization before generating
              # checksums, so downloaded sidecars resolve the actual payload.
              public_name = asset.name.replace(' ', '.')
              assert not (output / public_name).exists(), public_name
              shutil.copy2(asset, output / public_name)
              (output / (public_name + '.sha256')).write_text(digest + '  ' + public_name + '\n')
          (output / 'qualification.json').write_text(json.dumps(reports, indent=2))
          (output / 'library-provenance.json').write_text(json.dumps(library_proof, indent=2))
          PYCODE
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the already-qualified Docker image
        run: |
          gunzip -c candidates/recovery-docker/recovery-docker.tar.gz | docker load
          docker tag nirs4all-studio:0.11.8 ghcr.io/gbeurier/nirs4all-studio:0.11.8
          docker tag nirs4all-studio:0.11.8 ghcr.io/gbeurier/nirs4all-studio:latest
          docker push ghcr.io/gbeurier/nirs4all-studio:0.11.8
          docker push ghcr.io/gbeurier/nirs4all-studio:latest
      - name: Publish the recovery release
        run: gh release create 0.11.8 --target "$GITHUB_SHA" --title 'Studio 0.11.8 — Python recovery' --notes-file RECOVERY_RELEASE.md --latest release-assets/*
