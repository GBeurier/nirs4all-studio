# Unified Release Workflow
# One installer format per OS: NSIS (Windows x64), DMG (macOS arm64), DEB
# (Linux x64). Windows and Linux are built twice: the standard installer and
# its offline variant (`-offline`), which also carries the Python runtime,
# the default package set, XGBoost and PyTorch (CPU). The macOS application embeds no
# wheels: Studio installs its required packages from the package index, and
# there is no macOS offline installer.
# Full E2E and application migration qualify locally. Each hosted installer
# leg runs two smokes on the unpacked application:
#   1. scripts/smoke-archive-standalone.cjs checks the payload: a script
#      creates an environment with the shipped uv from the shipped wheels
#      (offline leg: with the default recommended packages, then XGBoost
#      and PyTorch, and nothing from the network; macOS: from the package index), then
#      the application starts on it and serves its
#      Playground and dataset routes.
#   2. scripts/smoke-packaged-ui.cjs checks the application: on a fresh
#      profile Studio opens its setup page and creates the environment itself
#      with the packages it preselects, then the renderer runs a real training
#      and its SHAP analysis (shap and matplotlib come from the package index).
#   - Native Docker image (static frontend + Rust sidecar)
#
# Trigger: immutable numeric source tag or independently selectable delivery retry
# Phase 3 (CI/CD Hardening) + Phase 4 (Code Signing & macOS)
name: Release

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., 1.2.0)'
        required: true
        type: string
      publish_existing_tag:
        description: 'Publish a retry for an existing immutable tag using this workflow fix'
        required: false
        default: false
        type: boolean
      macos_arm64_only:
        description: 'Legacy macOS-only selection; publication still requires publish_existing_tag=true'
        required: false
        default: false
        type: boolean
      delivery_channel:
        description: 'Build, qualify and optionally publish only this delivery channel'
        required: false
        default: all
        type: choice
        options:
          - all
          - linux-standard
          - linux-offline
          - windows-standard
          - windows-offline
          - macos-arm64
          - docker
      skip_docker:
        description: 'Skip Docker image builds'
        required: false
        default: false
        type: boolean

env:
  APP_NAME: nirs4all Studio
  APP_ID: com.nirs4all.webapp
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.11'
  # Release archives/images must be reproducible. Keep these refs pinned to the
  # selected immutable releases and update them with the ecosystem release board.
  # Verified immutable SDK publication source and exact public wheel bytes.
  NIRS4ALL_PUBLICATION_STATUS: published-registry
  NIRS4ALL_LIBRARY_REF: fd5db4af9131f19477867650814f1090f2308d08
  DAG_ML_REF: d3608565a5fe27875d4b64e54035eb8b4c05b204
  DAG_ML_DATA_REF: 854d5bebd88e1de761283139189735c349a6226c
  NIRS4ALL_SOURCE_URL: https://github.com/GBeurier/nirs4all/archive/fd5db4af9131f19477867650814f1090f2308d08.tar.gz
  NIRS4ALL_WHEEL_URL: https://files.pythonhosted.org/packages/78/55/8c66138a976ff93b0ff2cf17f9c6945a9797b43692f6ee609a8ccbd32c29/nirs4all-1.6.1-py3-none-any.whl
  NIRS4ALL_WHEEL_SHA256: b331c2c2ea806afba9e7947dc9378dacee1bf1678482dac9a3325adf5543c084
  DAG_ML_SOURCE_URL: https://github.com/GBeurier/dag-ml/archive/d3608565a5fe27875d4b64e54035eb8b4c05b204.tar.gz
  DAG_ML_DATA_SOURCE_URL: https://github.com/GBeurier/dag-ml-data/archive/854d5bebd88e1de761283139189735c349a6226c.tar.gz

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Prepare: Extract version, validate, determine build matrix
  # ═══════════════════════════════════════════════════════════════════════════
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      skip_docker: ${{ steps.flags.outputs.skip_docker }}
      macos_arm64_only: ${{ steps.flags.outputs.macos_arm64_only }}
      delivery_channel: ${{ steps.flags.outputs.delivery_channel }}
      linux_matrix: ${{ steps.flags.outputs.linux_matrix }}
      windows_matrix: ${{ steps.flags.outputs.windows_matrix }}
      # Publication occurs for a tag push or an explicit existing-tag retry.
      # Other dispatches build and smoke without publishing.
      is_tag_release: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_existing_tag == true) }}
      # Signing detection computed once, here, from `secrets` — which can be read
      # in a step `env:` but never in a job-level `if:`. Build jobs consume these
      # via needs.prepare.outputs.* (reliable, unlike the old per-step env probe).
      has_windows_signing: ${{ steps.signing.outputs.has_windows_signing }}
      has_macos_signing: ${{ steps.signing.outputs.has_macos_signing }}
      # Resolve once to an immutable commit; every platform checks out the
      # identical source even if a tag is moved while jobs are queued.
      checkout_ref: ${{ steps.checkout_ref.outputs.checkout_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo '::error::Release tag must be a numeric immutable source version'
            exit 1
          fi
          VERSION="$TAG"

          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT

          echo "## Build Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: $TAG" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Prerelease**: $PRERELEASE" >> $GITHUB_STEP_SUMMARY

      - name: Resolve checkout ref
        id: checkout_ref
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # The default checkout is the event's commit, not a later tag value.
            REF="$(git rev-parse 'HEAD^{commit}')"
          elif git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 origin "refs/tags/${TAG}"
            REF="$(git rev-parse 'FETCH_HEAD^{commit}')"
          else
            if [[ '${{ inputs.publish_existing_tag }}' == 'true' ]]; then
              echo '::error::Publication retry requires an existing immutable tag'
              exit 1
            fi
            # workflow_dispatch against a tag that does not exist yet (smoke test):
            # fall back to the triggering commit so checkout always succeeds and
            # we never silently build the wrong branch under the tag's version.
            REF="$GITHUB_SHA"
            echo "::warning::Dispatch tag '${TAG}' does not exist as a ref; build jobs will use the triggering commit $GITHUB_SHA (version is still stamped as ${{ steps.version.outputs.version }})."
          fi
          if [[ ! "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Release source must resolve to an immutable commit SHA"
            exit 1
          fi
          echo "checkout_ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Resolved checkout SHA: $REF"
          echo "- **Checkout ref**: \`$REF\`" >> $GITHUB_STEP_SUMMARY

      - name: Validate pinned runtime dependency refs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-runtime-cohort.cjs
          if [[ "$NIRS4ALL_PUBLICATION_STATUS" != "published-registry" ]]; then
            echo "::error::Pinned nirs4all requires its exact published wheel"
            exit 1
          fi
          for value in "$NIRS4ALL_LIBRARY_REF" "$DAG_ML_REF" "$DAG_ML_DATA_REF"; do
            if [[ ! "$value" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Release runtime dependency refs must be immutable 40-char SHAs, got '$value'"
              exit 1
            fi
          done
          for url in "$NIRS4ALL_SOURCE_URL" "$DAG_ML_SOURCE_URL" "$DAG_ML_DATA_SOURCE_URL"; do
            if [[ "$url" == *"/refs/heads/"* ]]; then
              echo "::error::Release runtime source URL must not use a moving branch tarball: $url"
              exit 1
            fi
          done
          if [[ "$NIRS4ALL_SOURCE_URL" != "https://github.com/GBeurier/nirs4all/archive/$NIRS4ALL_LIBRARY_REF.tar.gz" ||
                "$NIRS4ALL_WHEEL_URL" != "https://files.pythonhosted.org/packages/78/55/8c66138a976ff93b0ff2cf17f9c6945a9797b43692f6ee609a8ccbd32c29/nirs4all-1.6.1-py3-none-any.whl" ]]; then
            echo "::error::SDK publication source and wheel URL must match the selected public artifact"
            exit 1
          fi
          if [[ ! "$NIRS4ALL_WHEEL_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Pinned nirs4all wheel digest must be a lowercase SHA-256"
            exit 1
          fi

      - name: Detect signing secrets
        id: signing
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$WINDOWS_CERT_BASE64" ] && [ -n "$WINDOWS_CERT_PASSWORD" ]; then
            echo "has_windows_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_windows_signing=false" >> "$GITHUB_OUTPUT"
            echo "Windows signing secrets incomplete (WINDOWS_CERT_BASE64 / WINDOWS_CERT_PASSWORD)."
          fi

          macos_missing=()
          for secret_name in APPLE_CERT_BASE64 APPLE_CERT_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!secret_name}" ]; then
              macos_missing+=("$secret_name")
            fi
          done
          if [ ${#macos_missing[@]} -eq 0 ]; then
            echo "has_macos_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_macos_signing=false" >> "$GITHUB_OUTPUT"
            echo "macOS signing/notarization secrets missing: ${macos_missing[*]}"
          fi

      - name: Determine build flags
        id: flags
        env:
          SELECTED_CHANNEL: ${{ inputs.delivery_channel || 'all' }}
          MACOS_ONLY: ${{ inputs.macos_arm64_only || 'false' }}
          SKIP_DOCKER: ${{ inputs.skip_docker || 'false' }}
        run: |
          node scripts/release-delivery-matrix.cjs

  # Run the required checks on the exact Studio commit and pinned library refs.
  # A tag or manual dispatch must not bypass the PR quality gate.
  quality:
    name: Qualify release commit
    if: needs.prepare.outputs.macos_arm64_only != 'true' || needs.prepare.outputs.is_tag_release == 'true'
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      delivery_source_only: true
      checkout_ref: ${{ needs.prepare.outputs.checkout_ref }}
      nirs4all_library_ref: fd5db4af9131f19477867650814f1090f2308d08
      dag_ml_ref: d3608565a5fe27875d4b64e54035eb8b4c05b204
      dag_ml_data_ref: 854d5bebd88e1de761283139189735c349a6226c

  # One serialized metadata writer prevents concurrent installer legs from
  # creating several drafts for the same tag. This does not publish any asset.
  release-draft:
    name: Prepare installer release draft
    needs: [prepare, quality]
    if: >-
      needs.prepare.outputs.is_tag_release == 'true' && needs.quality.result == 'success' &&
      needs.prepare.outputs.delivery_channel != 'docker'
    runs-on: ubuntu-latest
    concurrency:
      group: studio-release-draft-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconcile one immutable installer release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.checkout_ref }}
          RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: node scripts/prepare-release-draft.cjs

  # ═══════════════════════════════════════════════════════════════════════════
  # Installer: Linux x64 (Electron + Rust sidecar + uv + required wheels)
  # ═══════════════════════════════════════════════════════════════════════════
  installer-linux:
    name: Installer — Linux x64 (${{ matrix.variant }})
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.prepare.outputs.is_tag_release != 'true' || (needs.quality.result == 'success' && needs.release-draft.result == 'success')) &&
      (needs.prepare.outputs.delivery_channel == 'all' || startsWith(needs.prepare.outputs.delivery_channel, 'linux-'))
    needs: [prepare, quality, release-draft]
    concurrency:
      group: studio-installer-${{ needs.prepare.outputs.tag }}-linux-${{ matrix.variant }}
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.linux_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgirepository1.0-dev \
            libcairo2-dev \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1

      - name: Install npm dependencies
        run: npm ci

      - name: Build exact native Methods runtime
        uses: ./.github/actions/build-native-methods
        with:
          platform: linux
          arch: x64

      - name: Verify exact nirs4all-ui package
        run: npm run check:ui-package

      - name: Update package.json version
        run: npm version ${{ needs.prepare.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Build frontend (Electron mode)
        run: npm run build:electron

      - name: Write version.json
        run: |
          cat > version.json << EOF
          {
            "version": "${{ needs.prepare.outputs.version }}",
            "build_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ needs.prepare.outputs.checkout_ref }}"
          }
          EOF

      # Installers ship no Python: uv, the wheels of the required packages and
      # the document adapters let Studio create the user's environment.
      - name: Stage uv, required wheels and document adapters
        run: |
          node scripts/fetch-uv.cjs
          node scripts/build-wheelhouse.cjs
          node scripts/studio-document-adapters.cjs --install backend-dist/adapters

      - name: Stage offline payload
        if: matrix.variant == 'offline'
        run: node scripts/build-offline-payload.cjs

      - name: Build and smoke native sidecar
        run: |
          node scripts/build-native-sidecar.cjs --target x86_64-unknown-linux-gnu
          test -x backend-dist/native/studio-sidecar
          node scripts/native-runtime-contract.cjs --backend-root backend-dist --artifact-boundary-root backend-dist --platform linux --arch x64 --require-python-payload --require-bundled-methods
          backend-dist/native/studio-sidecar --smoke-readiness

      - name: Package with electron-builder
        run: npx electron-builder --config ${{ matrix.builder_config }} --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaged native sidecar
        run: |
          SIDECAR="$(find release -type f -path '*/resources/backend/native/studio-sidecar' -print -quit)"
          test -n "$SIDECAR"
          test -x "$SIDECAR"
          BACKEND_ROOT="$(dirname "$(dirname "$SIDECAR")")"
          ARTIFACT_BOUNDARY="$(dirname "$(dirname "$BACKEND_ROOT")")"
          node scripts/native-runtime-contract.cjs --backend-root "$BACKEND_ROOT" --artifact-boundary-root "$ARTIFACT_BOUNDARY" --platform linux --arch x64 --require-python-payload --require-bundled-methods
          "$SIDECAR" --smoke-readiness
          test -f "$ARTIFACT_BOUNDARY/chrome-sandbox"
          sudo chown root:root "$ARTIFACT_BOUNDARY/chrome-sandbox"
          sudo chmod 4755 "$ARTIFACT_BOUNDARY/chrome-sandbox"
          test "$(stat -c '%u:%g:%a' "$ARTIFACT_BOUNDARY/chrome-sandbox")" = '0:0:4755'

      - name: Generate checksums
        run: |
          cd release
          for f in *.deb; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done

      # Payload, then application: see the two smokes described at the top of this file.
      - name: Smoke the packaged payload and the application's first launch
        timeout-minutes: 60
        env:
          NIRS4ALL_QUALIFICATION_PERFORMANCE_POLICY: github-observational
          RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.checkout_ref }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          installers=(release/*.deb)
          test "${#installers[@]}" = 1
          xvfb-run -a node scripts/smoke-archive-standalone.cjs --extracted-root release/linux-unpacked --platform linux --timeout-ms 240000
          xvfb-run -a node scripts/smoke-packaged-ui.cjs --extracted-root release/linux-unpacked --platform linux --timeout-ms 240000 --installer "${installers[0]}" --output "$RUNNER_TEMP/packaged-ui-smoke.json"

      - name: Preserve packaged UI smoke proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-ui-linux-${{ matrix.variant }}-proof
          path: ${{ runner.temp }}/packaged-ui-smoke.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux-x64-${{ matrix.variant }}-payload
          path: |
            release/*.deb
            release/*.sha256
            release/*.yml
          retention-days: 5

      - name: Publish this qualified installer channel
        if: success() && needs.prepare.outputs.is_tag_release == 'true' && needs.quality.result == 'success'
        uses: ./.github/actions/publish-installer-channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          channel: linux-${{ matrix.variant }}
          version: ${{ needs.prepare.outputs.version }}
          tag: ${{ needs.prepare.outputs.tag }}
          source_sha: ${{ needs.prepare.outputs.checkout_ref }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}

  # ═══════════════════════════════════════════════════════════════════════════
  # Installer: Windows x64 (Electron + Rust sidecar + uv + required wheels)
  # ═══════════════════════════════════════════════════════════════════════════
  installer-windows:
    name: Installer — Windows x64 (${{ matrix.variant }})
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.prepare.outputs.is_tag_release != 'true' || (needs.quality.result == 'success' && needs.release-draft.result == 'success')) &&
      (needs.prepare.outputs.delivery_channel == 'all' || startsWith(needs.prepare.outputs.delivery_channel, 'windows-'))
    needs: [prepare, quality, release-draft]
    concurrency:
      group: studio-installer-${{ needs.prepare.outputs.tag }}-windows-${{ matrix.variant }}
      cancel-in-progress: false
    # Methods' release preset is intentionally bound to VS 17 / 2022.
    permissions:
      contents: write
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.windows_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Note — building an unsigned Windows installer (no signing secrets)
        if: needs.prepare.outputs.is_tag_release == 'true' && needs.prepare.outputs.has_windows_signing != 'true'
        shell: bash
        run: |
          echo "::warning::No Windows code-signing secrets set — publishing an UNSIGNED installer. Users see a SmartScreen prompt on first run (More info > Run anyway). This is fine for this project; add WINDOWS_CERT_BASE64 + WINDOWS_CERT_PASSWORD to sign."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python for native containment tests
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      - name: Build exact native Methods runtime
        uses: ./.github/actions/build-native-methods
        with:
          platform: win32
          arch: x64

      - name: Verify exact nirs4all-ui package
        run: npm run check:ui-package

      - name: Update package.json version
        run: npm version ${{ needs.prepare.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Build frontend (Electron mode)
        run: npm run build:electron

      - name: Write version.json
        shell: pwsh
        run: |
          @{
            version = "${{ needs.prepare.outputs.version }}"
            build_date = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            commit = "${{ needs.prepare.outputs.checkout_ref }}"
          } | ConvertTo-Json | Out-File -FilePath version.json -Encoding utf8

      # Installers ship no Python: uv, the wheels of the required packages and
      # the document adapters let Studio create the user's environment.
      - name: Stage uv, required wheels and document adapters
        shell: bash
        run: |
          node scripts/fetch-uv.cjs
          node scripts/build-wheelhouse.cjs
          node scripts/studio-document-adapters.cjs --install backend-dist/adapters

      - name: Stage offline payload
        if: matrix.variant == 'offline'
        shell: bash
        run: node scripts/build-offline-payload.cjs

      - name: Build and smoke native sidecar
        shell: pwsh
        run: |
          node scripts/build-native-sidecar.cjs --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sidecar = "backend-dist/native/studio-sidecar.exe"
          if (-not (Test-Path -LiteralPath $sidecar -PathType Leaf)) {
            throw "Native Studio sidecar not found: $sidecar"
          }
          node scripts/native-runtime-contract.cjs --backend-root backend-dist --artifact-boundary-root backend-dist --platform win32 --arch x64 --require-python-payload --require-bundled-methods
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $sidecar --smoke-readiness
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check and test Windows Job containment
        shell: pwsh
        run: |
          $env:N4M_LIBRARY_PATH = $env:NIRS4ALL_BUILD_METHODS_LIBRARY
          cargo fmt --manifest-path sidecar/crates/studio-windows-job/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path sidecar/crates/studio-windows-job/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path sidecar/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path sidecar/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ── Windows Code Signing (Phase 4 — P4-3) ──
      - name: Import code signing certificate
        if: needs.prepare.outputs.has_windows_signing == 'true'
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64)
          [IO.File]::WriteAllBytes("${{ runner.temp }}\cert.pfx", $certBytes)
          echo "CSC_LINK=${{ runner.temp }}\cert.pfx" >> $env:GITHUB_ENV
          echo "CSC_KEY_PASSWORD=$($env:WINDOWS_CERT_PASSWORD)" >> $env:GITHUB_ENV

      - name: Package with electron-builder
        run: npx electron-builder --config ${{ matrix.builder_config }} --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Payload execution is independent of Authenticode. The existing
      # secret-backed signature verification below remains authoritative.
      - name: Verify packaged native sidecar
        shell: pwsh
        run: |
          $sidecar = Get-ChildItem -Path release -Filter studio-sidecar.exe -File -Recurse |
            Where-Object { $_.FullName -match '[\\/]resources[\\/]backend[\\/]native[\\/]studio-sidecar\.exe$' } |
            Select-Object -First 1
          if (-not $sidecar) {
            throw "Packaged native Studio sidecar not found under release/"
          }
          $backendRoot = Split-Path -Parent (Split-Path -Parent $sidecar.FullName)
          $artifactBoundary = Split-Path -Parent (Split-Path -Parent $backendRoot)
          node scripts/native-runtime-contract.cjs --backend-root $backendRoot --artifact-boundary-root $artifactBoundary --platform win32 --arch x64 --require-python-payload --require-bundled-methods
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $sidecar.FullName --smoke-readiness
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Authenticode signature
        if: needs.prepare.outputs.has_windows_signing == 'true'
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem release -Include *.exe -Recurse
          if (-not $artifacts) {
            Write-Error "No .exe artifacts found to verify."
            exit 1
          }
          $failed = $false
          foreach ($exe in $artifacts) {
            $sig = Get-AuthenticodeSignature $exe.FullName
            Write-Host "$($exe.Name): $($sig.Status)"
            if ($sig.Status -ne 'Valid') {
              Write-Host "::error::Authenticode signature for $($exe.Name) is '$($sig.Status)', expected 'Valid'."
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Clean up certificate
        if: always()
        shell: pwsh
        run: Remove-Item "${{ runner.temp }}\cert.pfx" -ErrorAction SilentlyContinue

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem release -File -Filter '*.exe' | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii -NoNewline
          }

      # Payload, then application: see the two smokes described at the top of this file.
      - name: Smoke the packaged payload and the application's first launch
        timeout-minutes: 60
        env:
          NIRS4ALL_QUALIFICATION_PERFORMANCE_POLICY: github-observational
          RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.checkout_ref }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem release -File -Filter '*.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          node scripts/smoke-archive-standalone.cjs --extracted-root release/win-unpacked --platform win32 --timeout-ms 240000
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-packaged-ui.cjs --extracted-root release/win-unpacked --platform win32 --timeout-ms 240000 --installer $installers[0].FullName --output "$env:RUNNER_TEMP/packaged-ui-smoke.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve packaged UI smoke proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-ui-windows-${{ matrix.variant }}-proof
          path: ${{ runner.temp }}/packaged-ui-smoke.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows-x64-${{ matrix.variant }}-payload
          path: |
            release/*.exe
            release/*.sha256
            release/*.yml
          retention-days: 5

      - name: Publish this qualified installer channel
        if: success() && needs.prepare.outputs.is_tag_release == 'true' && needs.quality.result == 'success'
        uses: ./.github/actions/publish-installer-channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          channel: windows-${{ matrix.variant }}
          version: ${{ needs.prepare.outputs.version }}
          tag: ${{ needs.prepare.outputs.tag }}
          source_sha: ${{ needs.prepare.outputs.checkout_ref }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}

  # ═══════════════════════════════════════════════════════════════════════════
  # Installer: macOS arm64 (Apple Silicon) — Phase 4: signed + notarized
  # ═══════════════════════════════════════════════════════════════════════════
  installer-macos-arm64:
    name: Installer — macOS arm64
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.prepare.outputs.is_tag_release != 'true' || (needs.quality.result == 'success' && needs.release-draft.result == 'success')) &&
      (needs.prepare.outputs.delivery_channel == 'all' || needs.prepare.outputs.delivery_channel == 'macos-arm64')
    needs: [prepare, quality, release-draft]
    concurrency:
      group: studio-installer-${{ needs.prepare.outputs.tag }}-macos-arm64
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Note — building an unsigned macOS DMG (no Apple signing secrets)
        if: needs.prepare.outputs.is_tag_release == 'true' && needs.prepare.outputs.has_macos_signing != 'true'
        run: |
          echo "::warning::No Apple signing/notarization secrets set — publishing an UNSIGNED, un-notarized DMG. Users must right-click > Open on first launch (Gatekeeper). This is fine for this project; add APPLE_* secrets to sign + notarize."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install npm dependencies
        run: npm ci

      - name: Build exact native Methods runtime
        uses: ./.github/actions/build-native-methods
        with:
          platform: darwin
          arch: arm64

      - name: Verify exact nirs4all-ui package
        run: npm run check:ui-package

      - name: Update package.json version
        run: npm version ${{ needs.prepare.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Build frontend (Electron mode)
        run: npm run build:electron

      - name: Write version.json
        run: |
          cat > version.json << EOF
          {
            "version": "${{ needs.prepare.outputs.version }}",
            "build_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ needs.prepare.outputs.checkout_ref }}"
          }
          EOF

      # The macOS application ships no Python and no wheels (archives with
      # unsigned binaries fail notarisation): Studio installs its required
      # packages from the package index.
      - name: Stage uv and document adapters
        run: |
          node scripts/fetch-uv.cjs
          node scripts/studio-document-adapters.cjs --install backend-dist/adapters
          test ! -e backend-dist/wheels

      - name: Build and smoke native sidecar
        run: |
          node scripts/build-native-sidecar.cjs --target aarch64-apple-darwin
          test -x backend-dist/native/studio-sidecar
          node scripts/native-runtime-contract.cjs --backend-root backend-dist --artifact-boundary-root backend-dist --platform darwin --arch arm64 --require-python-payload --require-bundled-methods
          if [ "$(uname -m)" = "arm64" ]; then
            backend-dist/native/studio-sidecar --smoke-readiness
          else
            echo "Skipping arm64 sidecar execution on $(uname -m); packaging checks still apply."
          fi

      # ── macOS Code Signing (Phase 4 — P4-1) ──
      - name: Import Apple Developer certificate
        if: needs.prepare.outputs.has_macos_signing == 'true'
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH=${{ runner.temp }}/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERT_BASE64" | base64 --decode > ${{ runner.temp }}/cert.p12
          security import ${{ runner.temp }}/cert.p12 -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

          # Export for electron-builder (keychain-based signing, no file reference needed)
          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> $GITHUB_ENV

      - name: Package with electron-builder
        run: npx electron-builder --config electron-builder.installer.yml --mac --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # This validates the unpacked payload only. The existing secret-backed
      # DMG notarization, stapling, and signature checks remain authoritative.
      - name: Verify packaged native sidecar
        run: |
          SIDECAR="$(find release -type f -path '*/Contents/Resources/backend/native/studio-sidecar' -print -quit)"
          test -n "$SIDECAR"
          test -x "$SIDECAR"
          BACKEND_ROOT="$(dirname "$(dirname "$SIDECAR")")"
          ARTIFACT_BOUNDARY="$(dirname "$(dirname "$(dirname "$BACKEND_ROOT")")")"
          node scripts/native-runtime-contract.cjs --backend-root "$BACKEND_ROOT" --artifact-boundary-root "$ARTIFACT_BOUNDARY" --platform darwin --arch arm64 --require-python-payload --require-bundled-methods
          if [ "$(uname -m)" = "arm64" ]; then
            "$SIDECAR" --smoke-readiness
          else
            echo "Skipping packaged arm64 sidecar execution on $(uname -m)."
          fi

      # ── macOS Notarization (Phase 4 — P4-2) ──
      - name: Notarize macOS DMG
        if: needs.prepare.outputs.has_macos_signing == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG=$(ls release/*.dmg 2>/dev/null | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::No DMG found to notarize."
            exit 1
          fi
          echo "Notarizing $DMG..."
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 600

          echo "Stapling notarization ticket..."
          xcrun stapler staple "$DMG"
          echo "Notarization complete."

      - name: Verify signature and notarization
        if: needs.prepare.outputs.has_macos_signing == 'true'
        run: |
          DMG=$(ls release/*.dmg 2>/dev/null | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::No DMG found to verify."
            exit 1
          fi
          echo "Validating stapled ticket on $DMG..."
          xcrun stapler validate "$DMG"
          echo "Gatekeeper assessment of the disk image..."
          spctl --assess --type open --context context:primary-signature -vv "$DMG"

          echo "Mounting DMG to verify the app bundle..."
          MOUNT_DIR="$(mktemp -d)"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT_DIR"
          APP=$(ls -d "$MOUNT_DIR"/*.app 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            hdiutil detach "$MOUNT_DIR" || true
            echo "::error::No .app found inside the mounted DMG."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          # The notarization ticket is stapled to the DMG (above), not to the
          # inner .app, so `stapler validate "$APP"` would always fail here.
          # spctl assesses the app against the notary record (online) instead.
          spctl --assess --type exec -vv "$APP"
          hdiutil detach "$MOUNT_DIR"
          echo "Signature + notarization verified."

      - name: Cleanup keychain
        if: always()
        run: |
          KEYCHAIN_PATH=${{ runner.temp }}/build.keychain
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

      - name: Generate checksums
        run: |
          cd release
          for f in *.dmg; do
            [ -f "$f" ] && shasum -a 256 "$f" > "$f.sha256"
          done

      # Payload, then application: see the two smokes described at the top of
      # this file. Both install the required packages from the package index.
      - name: Smoke the packaged payload and the application's first launch
        timeout-minutes: 60
        env:
          NIRS4ALL_QUALIFICATION_PERFORMANCE_POLICY: github-observational
          RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.checkout_ref }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          installers=(release/*.dmg)
          test "${#installers[@]}" = 1
          export TMPDIR="$(cd "$RUNNER_TEMP" && pwd -P)"
          node scripts/smoke-archive-standalone.cjs --extracted-root release/mac-arm64 --platform darwin --timeout-ms 240000
          node scripts/smoke-packaged-ui.cjs --extracted-root release/mac-arm64 --platform darwin --timeout-ms 240000 --installer "${installers[0]}" --output "$RUNNER_TEMP/packaged-ui-smoke.json"

      - name: Preserve packaged UI smoke proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-ui-macos-arm64-proof
          path: ${{ runner.temp }}/packaged-ui-smoke.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos-arm64-payload
          path: |
            release/*.dmg
            release/*.sha256
            release/*.yml
          retention-days: 5

      - name: Publish this qualified installer channel
        if: success() && needs.prepare.outputs.is_tag_release == 'true' && needs.quality.result == 'success'
        uses: ./.github/actions/publish-installer-channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          channel: macos-arm64
          version: ${{ needs.prepare.outputs.version }}
          tag: ${{ needs.prepare.outputs.tag }}
          source_sha: ${{ needs.prepare.outputs.checkout_ref }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}

  # ═══════════════════════════════════════════════════════════════════════════
  # Docker: static frontend + loopback Rust sidecar
  # ═══════════════════════════════════════════════════════════════════════════
  docker:
    name: Native Docker Image
    needs: [prepare, quality]
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.prepare.outputs.is_tag_release != 'true' || needs.quality.result == 'success') &&
      needs.prepare.outputs.skip_docker != 'true' &&
      (needs.prepare.outputs.delivery_channel == 'all' || needs.prepare.outputs.delivery_channel == 'docker')
    outputs:
      image_id: ${{ steps.image.outputs.id }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify fail-closed Docker contract
        run: npm run test:docker-runtime-contract

      - name: Install browser access-test dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Build exact native Methods runtime
        uses: ./.github/actions/build-native-methods
        with:
          platform: linux
          arch: x64

      - name: Build and smoke native release candidate
        run: |
          node scripts/verify-runtime-cohort.cjs
          docker build \
            --build-arg STUDIO_VERSION=${{ needs.prepare.outputs.version }} \
            --build-arg STUDIO_REVISION=${{ needs.prepare.outputs.checkout_ref }} \
            --build-arg NIRS4ALL_METHODS_SHA256=${NIRS4ALL_BUILD_METHODS_SHA256} \
            --build-arg NIRS4ALL_METHODS_IDENTITY_PROFILE=${NIRS4ALL_BUILD_METHODS_IDENTITY_PROFILE} \
            --build-context methods-runtime="$(dirname "${NIRS4ALL_BUILD_METHODS_LIBRARY}")" \
            --label "org.opencontainers.image.title=nirs4all Studio" \
            --label "org.opencontainers.image.version=${{ needs.prepare.outputs.version }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ needs.prepare.outputs.checkout_ref }}" \
            --tag nirs4all-studio:native-release-candidate \
            .
          bash scripts/smoke-docker-native-runtime.sh nirs4all-studio:native-release-candidate
          node scripts/test-docker-access.cjs nirs4all-studio:native-release-candidate --browser

      - name: Preserve the tested image without publishing
        id: image
        run: |
          echo "id=$(docker image inspect --format '{{.Id}}' nirs4all-studio:native-release-candidate)" >> "$GITHUB_OUTPUT"
          docker save --output "$RUNNER_TEMP/studio-image.tar" nirs4all-studio:native-release-candidate

      - uses: actions/upload-artifact@v4
        with:
          name: docker-candidate
          path: ${{ runner.temp }}/studio-image.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 5

      - name: Login to GitHub Container Registry
        if: success() && needs.prepare.outputs.is_tag_release == 'true' && needs.quality.result == 'success'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested Docker image
        if: success() && needs.prepare.outputs.is_tag_release == 'true' && needs.quality.result == 'success'
        env:
          EXPECTED_IMAGE_ID: ${{ steps.image.outputs.id }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          test "$(docker image inspect --format '{{.Id}}' nirs4all-studio:native-release-candidate)" = "$EXPECTED_IMAGE_ID"
          IMAGE=ghcr.io/gbeurier/nirs4all-studio
          docker tag nirs4all-studio:native-release-candidate "$IMAGE:$RELEASE_VERSION"
          docker push "$IMAGE:$RELEASE_VERSION"
          if [ "$IS_PRERELEASE" != 'true' ]; then
            docker tag nirs4all-studio:native-release-candidate "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi


  # Reporting waits for all attempts; delivery itself never does.
  delivery-summary:
    name: Report independent delivery status
    needs: [prepare, quality, installer-linux, installer-windows, installer-macos-arm64, docker]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.is_tag_release == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: studio-delivery-status-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Report available, pending and failed delivery channels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.checkout_ref }}
          RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: node scripts/report-release-deliveries.cjs
