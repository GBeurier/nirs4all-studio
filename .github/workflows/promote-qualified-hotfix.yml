name: Promote qualified Studio hotfix

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Immutable qualified release commit (40-character SHA)
        required: true
        type: string
        default: a3f503587d1d6bf9a43ff3ec291966ae59b80657
      release_run_id:
        description: Release run providing all eight qualified desktop artifacts
        required: true
        type: string
        default: '35212938007'
      windows_validation_run_id:
        description: Successful real Windows installation and N-1 update run
        required: true
        type: string

permissions:
  actions: write
  contents: write
  packages: write

concurrency:
  group: promote-qualified-hotfix-0.11.5
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      WINDOWS_RUN_ID: ${{ inputs.windows_validation_run_id }}
      RELEASE_VERSION: '0.11.5'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify immutable candidate and tag identity
        run: |
          node <<'NODE'
          const {execFileSync}=require('node:child_process');
          const {SOURCE_SHA,RELEASE_RUN_ID,WINDOWS_RUN_ID,GH_REPO,RELEASE_VERSION}=process.env;
          if(!/^[a-f0-9]{40}$/.test(SOURCE_SHA)||!/^\d+$/.test(RELEASE_RUN_ID)||!/^\d+$/.test(WINDOWS_RUN_ID)) throw Error('Invalid immutable candidate inputs');
          const api=p=>JSON.parse(execFileSync('gh',['api',`repos/${GH_REPO}/${p}`],{encoding:'utf8'}));
          const run=api(`actions/runs/${RELEASE_RUN_ID}`);
          if(run.head_sha!==SOURCE_SHA||run.event!=='push'||run.path!=='.github/workflows/release-unified.yml'||run.head_branch!==RELEASE_VERSION) throw Error('Release run identity differs');
          if(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim()!==SOURCE_SHA) throw Error('Checkout differs');
          let object=api(`git/ref/tags/${RELEASE_VERSION}`).object;
          while(object.type==='tag') object=api(`git/tags/${object.sha}`).object;
          if(object.type!=='commit'||object.sha!==SOURCE_SHA) throw Error('Release tag differs');
          NODE
      - uses: docker/setup-buildx-action@v3
      - name: Verify fail-closed Docker contract
        run: npm run test:docker-runtime-contract
      - name: Install browser access-test dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Build exact native Methods runtime
        uses: ./.github/actions/build-native-methods
        with:
          platform: linux
          arch: x64
      - name: Qualify native Archive V2 replay
        run: npm run test:native-archive-v2
      - name: Build and smoke the exact release image immediately
        run: |
          docker build \
            --build-arg "STUDIO_VERSION=$RELEASE_VERSION" \
            --build-arg "STUDIO_REVISION=$SOURCE_SHA" \
            --build-arg "NIRS4ALL_METHODS_SHA256=$NIRS4ALL_BUILD_METHODS_SHA256" \
            --build-context "methods-runtime=$(dirname "$NIRS4ALL_BUILD_METHODS_LIBRARY")" \
            --label 'org.opencontainers.image.title=nirs4all Studio' \
            --label "org.opencontainers.image.version=$RELEASE_VERSION" \
            --label "org.opencontainers.image.source=https://github.com/$GH_REPO" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --tag nirs4all-studio:native-release-candidate .
          bash scripts/smoke-docker-native-runtime.sh nirs4all-studio:native-release-candidate
          node scripts/test-docker-access.cjs nirs4all-studio:native-release-candidate --browser
          docker image inspect --format '{{.Id}}' nirs4all-studio:native-release-candidate > "$RUNNER_TEMP/tested-image-id"
      - name: Await all desktop, quality, and actual Windows installation gates
        timeout-minutes: 61
        run: |
          node <<'NODE'
          const {execFileSync}=require('node:child_process');
          const {GH_REPO,RELEASE_RUN_ID,WINDOWS_RUN_ID,SOURCE_SHA,RELEASE_VERSION}=process.env;
          const api=p=>JSON.parse(execFileSync('gh',['api',`repos/${GH_REPO}/${p}`],{encoding:'utf8'}));
          const required=[
            'Prepare','Acquire pinned plugin wheels',
            'Qualify release commit / Frontend','Qualify release commit / Backend',
            'Qualify release commit / Native Docker Runtime',
            'Qualify release commit / Native Sidecar Windows Containment',
            'Qualify release commit / Electron Build Test',
            ...['Installer','All-in-one'].flatMap(kind=>['Linux x64','Windows x64','macOS x64','macOS arm64'].map(platform=>`${kind} — ${platform}`)),
          ];
          const deadline=Date.now()+60*60*1000;
          (async()=>{
            for(;;){
              const run=api(`actions/runs/${RELEASE_RUN_ID}`);
              if(run.head_sha!==SOURCE_SHA||run.path!=='.github/workflows/release-unified.yml'||run.event!=='push'||run.head_branch!==RELEASE_VERSION) throw Error('Release run identity changed');
              const jobs=api(`actions/runs/${RELEASE_RUN_ID}/jobs?per_page=100`).jobs;
              const selected=required.map(name=>{
                const matches=jobs.filter(job=>job.name===name);
                if(matches.length>1) throw Error(`Ambiguous required job: ${name}`);
                const job=matches[0];
                if(job?.status==='completed'&&job.conclusion!=='success') throw Error(`Required job failed: ${name}: ${job.conclusion}`);
                return job;
              });
              const windows=api(`actions/runs/${WINDOWS_RUN_ID}`);
              if(windows.event!=='workflow_dispatch'||windows.path!=='.github/workflows/windows-real-install-update.yml') throw Error('Unexpected Windows validation workflow');
              if(windows.status==='completed'&&windows.conclusion!=='success') throw Error(`Windows real install/update failed: ${windows.conclusion}`);
              if(selected.every(job=>job?.conclusion==='success')&&windows.conclusion==='success'){
                const windowsJobs=api(`actions/runs/${WINDOWS_RUN_ID}/jobs?per_page=100`).jobs;
                if(windowsJobs.length!==1||windowsJobs[0].conclusion!=='success') throw Error('Windows validation jobs differ');
                const log=execFileSync('gh',['api',`repos/${GH_REPO}/actions/jobs/${windowsJobs[0].id}/logs`],{encoding:'utf8',maxBuffer:32*1024*1024});
                if(!log.includes(`RELEASE_RUN_ID: ${RELEASE_RUN_ID}`)||!log.includes(`TARGET_VERSION: ${RELEASE_VERSION}`)) throw Error('Windows validation did not use this release candidate');
                console.log(`All ${required.length} required jobs and real Windows installation/update passed for ${SOURCE_SHA}`);
                break;
              }
              if(run.status==='completed'&&!selected.every(job=>job?.conclusion==='success')) throw Error('Source run completed before all required gates succeeded');
              if(Date.now()>=deadline) throw Error('Timed out awaiting qualified artifacts');
              console.log(`Waiting: ${selected.filter(job=>job?.conclusion==='success').length}/${required.length} release jobs; Windows ${windows.status}`);
              await new Promise(resolve=>setTimeout(resolve,30000));
            }
          })().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
      - name: Download exact qualified desktop artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.release_run_id }}
          path: artifacts
          pattern: '{installer,archive}-*'
          merge-multiple: false
      - name: Verify complete asset set and producer checksums
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const expected=['installer','archive'].flatMap(kind=>['linux-x64','windows-x64','macos-x64','macos-arm64'].map(platform=>`${kind}-${platform}`)).sort();
          const actual=fs.readdirSync('artifacts').sort();
          if(JSON.stringify(actual)!==JSON.stringify(expected)) throw Error(`Unexpected artifact set: ${actual}`);
          const names=new Set();
          function inspect(root){
            for(const entry of fs.readdirSync(root,{withFileTypes:true})){
              const file=`${root}/${entry.name}`;
              if(entry.isDirectory()){inspect(file);continue;}
              if(!/\.(AppImage|deb|exe|dmg|zip|tar\.gz|sha256)$/.test(entry.name)) continue;
              if(names.has(entry.name)) throw Error(`Duplicate release basename: ${entry.name}`);
              names.add(entry.name);
            }
          }
          inspect('artifacts');
          NODE
          mkdir -p release
          find artifacts -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.tar.gz' -o -name '*.sha256' \) -exec cp -n {} release/ \;
          node scripts/finalize-release-assets.cjs release "$RELEASE_VERSION" true
      - name: Verify tag, refuse existing publication, and stop redundant publisher
        run: |
          node <<'NODE'
          const {execFileSync,spawnSync}=require('node:child_process');
          const {GH_REPO,RELEASE_RUN_ID,SOURCE_SHA,RELEASE_VERSION}=process.env;
          const api=p=>JSON.parse(execFileSync('gh',['api',`repos/${GH_REPO}/${p}`],{encoding:'utf8'}));
          function verify(){
            let object=api(`git/ref/tags/${RELEASE_VERSION}`).object;
            while(object.type==='tag') object=api(`git/tags/${object.sha}`).object;
            if(object.type!=='commit'||object.sha!==SOURCE_SHA) throw Error('Tag no longer identifies qualified commit');
            const release=spawnSync('gh',['api',`repos/${GH_REPO}/releases/tags/${RELEASE_VERSION}`],{encoding:'utf8'});
            if(release.status===0) throw Error('Release already exists; refusing to overwrite assets or cancel its completed publisher');
            if(!release.stderr.includes('HTTP 404')) throw Error(`Cannot verify release absence: ${release.stderr}`);
          }
          (async()=>{
            verify();
            const run=api(`actions/runs/${RELEASE_RUN_ID}`);
            if(run.head_sha!==SOURCE_SHA) throw Error('Source run identity changed');
            const jobs=api(`actions/runs/${RELEASE_RUN_ID}/jobs?per_page=100`).jobs;
            for(const job of jobs.filter(j=>['Native Docker Image','Create Release'].includes(j.name))){
              const publicationStarted=(job.steps||[]).some(s=>/Publish the tested Docker image|Create GitHub Release/.test(s.name)&&(s.status==='in_progress'||(s.status==='completed'&&s.conclusion!=='skipped')));
              if(job.conclusion==='success'||publicationStarted) throw Error('Original publication already started; refusing duplicate publication');
            }
            if(run.status!=='completed') execFileSync('gh',['api','--method','POST',`repos/${GH_REPO}/actions/runs/${RELEASE_RUN_ID}/cancel`],{stdio:'inherit'});
            const deadline=Date.now()+120000;
            while(api(`actions/runs/${RELEASE_RUN_ID}`).status!=='completed'){
              if(Date.now()>deadline) throw Error('Original publisher did not stop');
              await new Promise(resolve=>setTimeout(resolve,5000));
            }
            verify();
          })().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish only the exact tested Docker image
        run: |
          test "$(docker image inspect --format '{{.Id}}' nirs4all-studio:native-release-candidate)" = "$(cat "$RUNNER_TEMP/tested-image-id")"
          IMAGE=ghcr.io/gbeurier/nirs4all-studio
          docker tag nirs4all-studio:native-release-candidate "$IMAGE:$RELEASE_VERSION"
          docker push "$IMAGE:$RELEASE_VERSION"
          docker tag nirs4all-studio:native-release-candidate "$IMAGE:latest"
          docker push "$IMAGE:latest"
      - name: Write qualified hotfix release notes
        run: |
          cat > release_notes.md <<'NOTES'
          ## Installation and dataset-loading hotfix

          - Verify the included CPU runtime and scientific packages at first launch, including SHAP and Matplotlib.
          - Fix developer mode activation before selecting a workspace and preserve it across restarts.
          - Keep Settings responsive while Python diagnostics run.
          - Respect local parsing overrides, ignore missing metadata values by default, and preserve repetition identifiers.
          - Reject incomplete Python environments and truncated downloads.

          Qualified installers and all-in-one archives are included for Windows x64, Linux x64, macOS Intel, and macOS Apple Silicon. Windows additionally passed a real NSIS installation and migration from 0.11.4 to this exact candidate. macOS distributions are unsigned unless signing credentials were available during their build.

          SHA256 sidecars accompany every download. Verify with `sha256sum -c <download>.sha256`, or `Get-FileHash <download> -Algorithm SHA256` on Windows.

          Docker: `ghcr.io/gbeurier/nirs4all-studio:0.11.5` is the exact image that passed native runtime and browser access checks.
          NOTES
          printf '\nQualified commit: `%s`\n\nRelease qualification run: https://github.com/%s/actions/runs/%s\n\nWindows installation/update proof: https://github.com/%s/actions/runs/%s\n' "$SOURCE_SHA" "$GH_REPO" "$RELEASE_RUN_ID" "$GH_REPO" "$WINDOWS_RUN_ID" >> release_notes.md
      - name: Create stable release without overwriting any prior release
        run: |
          gh release create "$RELEASE_VERSION" --verify-tag --latest --title "nirs4all Studio $RELEASE_VERSION" --notes-file release_notes.md release/*
