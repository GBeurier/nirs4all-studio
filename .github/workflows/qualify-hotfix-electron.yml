name: Qualify exact hotfix Electron artifact

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Immutable release commit to qualify
        required: true
        type: string
        default: a3f503587d1d6bf9a43ff3ec291966ae59b80657
      release_run_id:
        description: Exact release run providing the Linux archive
        required: true
        type: string
        default: '35212938007'

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prove exact archive identity and preceding Electron quality checks
        timeout-minutes: 11
        run: |
          node <<'NODE'
          const {execFileSync}=require('node:child_process');
          const {SOURCE_SHA,RELEASE_RUN_ID,GH_REPO}=process.env;
          if(!/^[a-f0-9]{40}$/.test(SOURCE_SHA)||!/^\d+$/.test(RELEASE_RUN_ID)) throw Error('Invalid immutable candidate');
          const api=p=>JSON.parse(execFileSync('gh',['api',`repos/${GH_REPO}/${p}`],{encoding:'utf8'}));
          const run=api(`actions/runs/${RELEASE_RUN_ID}`);
          if(run.head_sha!==SOURCE_SHA||run.event!=='push'||run.path!=='.github/workflows/release-unified.yml'||run.head_branch!=='0.11.5') throw Error('Unexpected release source');
          if(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim()!==SOURCE_SHA) throw Error('Checkout identity differs');
          (async()=>{
            const deadline=Date.now()+10*60*1000;
            for(;;){
              const jobs=api(`actions/runs/${RELEASE_RUN_ID}/jobs?per_page=100`).jobs;
              const electron=jobs.find(j=>j.name==='Qualify release commit / Electron Build Test');
              if(!electron||electron.status!=='completed') throw Error('Missing original Electron qualification evidence');
              const failures=electron.steps.filter(s=>s.conclusion==='failure');
              if(failures.length!==1||failures[0].name!=='Verify packaged Studio with fresh offline user state') throw Error('Original Electron job has another unresolved failure');
              const failureNumber=failures[0].number;
              if(electron.steps.some(s=>s.number<failureNumber&&s.conclusion!=='success'&&s.conclusion!=='skipped')) throw Error('Earlier Electron checks did not complete');
              const archives=jobs.filter(j=>j.name==='All-in-one — Linux x64');
              if(archives.length>1) throw Error('Ambiguous source archive job');
              const archive=archives[0];
              if(archive?.status==='completed'&&archive.conclusion!=='success') throw Error('Linux archive did not pass its own qualification');
              if(archive?.conclusion==='success') break;
              if(Date.now()>deadline) throw Error('Timed out waiting for qualified Linux archive');
              console.log('Waiting for exact Linux archive and its offline/self-update gates');
              await new Promise(resolve=>setTimeout(resolve,30000));
            }
          })().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgirepository1.0-dev \
            libcairo2-dev \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1

      - name: Install npm dependencies
        run: npm ci

      - name: Download canonical plugin wheels
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.release_run_id }}
          name: pinned-plugin-wheels
          path: _deps/pinned-plugin-wheels

      - name: Build exact native Methods runtime
        uses: ./.github/actions/build-native-methods
        with:
          platform: linux
          arch: x64

      - name: Qualify native Archive V2 replay
        run: npm run test:native-archive-v2

      - name: Verify exact nirs4all-ui package
        run: npm run check:ui-package

      - name: Update package.json version
        run: npm version 0.11.5 --no-git-tag-version --allow-same-version

      - name: Build frontend (Electron mode)
        run: npm run build:electron

      - name: Write version.json
        run: |
          cat > version.json << EOF
          {
            "version": "0.11.5",
            "build_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ inputs.source_sha }}"
          }
          EOF

      - name: Build pinned plugin-only CPython runtime
        run: node scripts/bake-python-plugin-runtime.cjs --plugin-wheel _deps/pinned-plugin-wheels/nirs4all-1.0.1-py3-none-any.whl --tools-wheel _deps/pinned-plugin-wheels/nirs4all_tools-0.0.7-py3-none-any.whl

      - name: Build and smoke native sidecar
        run: |
          node scripts/build-native-sidecar.cjs --target x86_64-unknown-linux-gnu
          test -x backend-dist/native/studio-sidecar
          node scripts/native-runtime-contract.cjs --backend-root backend-dist --artifact-boundary-root backend-dist --platform linux --arch x64 --require-bundled-python-plugin --require-bundled-methods
          backend-dist/native/studio-sidecar --smoke-readiness

      - name: Package with electron-builder
        run: npx electron-builder --config electron-builder.installer.yml --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure runner sandbox permissions before real product launch
        run: |
          mapfile -t HELPERS < <(find release -type f -name chrome-sandbox)
          test "${#HELPERS[@]}" -eq 1
          sudo chown root:root "${HELPERS[0]}"
          sudo chmod 4755 "${HELPERS[0]}"
          test "$(stat -c '%U:%G:%a' "${HELPERS[0]}")" = 'root:root:4755'

      - name: Add bounded diagnostics to the ephemeral UI test driver
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const file='scripts/smoke-first-launch-ui.cjs';
          let source=fs.readFileSync(file,'utf8');
          function replaceOnce(before,after){
            if(source.split(before).length!==2) throw Error(`Unexpected UI driver diagnostic anchor: ${before}`);
            source=source.replace(before,after);
          }
          replaceOnce('  const errors = [];',`  const errors = [];
            let processOutput = '';
            const browserDiagnostics = [];
            const captureProcess = (kind, data) => { processOutput = (processOutput + kind + String(data)).slice(-24000); };
            const captureBrowser = line => { browserDiagnostics.push(String(line).slice(0, 1600)); if (browserDiagnostics.length > 40) browserDiagnostics.shift(); };`);
          replaceOnce('    const page = await app.firstWindow({ timeout: config.timeoutMs });',`    app.process().stdout?.on('data', data => captureProcess('[stdout] ', data));
            app.process().stderr?.on('data', data => captureProcess('[stderr] ', data));
            app.process().on('exit', (code, signal) => captureProcess('[exit] ', JSON.stringify({code, signal})));
            const page = await app.firstWindow({ timeout: config.timeoutMs });
            page.on('console', message => { if (message.type() === 'error') captureBrowser('[console] ' + message.text()); });
            page.on('requestfailed', request => captureBrowser('[requestfailed] ' + request.method() + ' ' + request.url() + ' ' + JSON.stringify(request.failure())));
            page.on('response', response => { if (response.status() >= 400) captureBrowser('[http] ' + response.status() + ' ' + response.url()); });`);
          replaceOnce('    console.error("Renderer errors:", errors.join("\\n") || "none");',`    console.error('Bounded Electron process output:', processOutput || 'none');
            console.error('Bounded renderer network/console diagnostics:', browserDiagnostics.join('\\n') || 'none');
            console.error("Renderer errors:", errors.join("\\n") || "none");`);
          fs.writeFileSync(file,source);
          NODE
          node --check scripts/smoke-first-launch-ui.cjs

      - name: Verify packaged native sidecar
        timeout-minutes: 15
        run: |
          SIDECAR="$(find release -type f -path '*/resources/backend/native/studio-sidecar' -print -quit)"
          test -n "$SIDECAR"
          test -x "$SIDECAR"
          BACKEND_ROOT="$(dirname "$(dirname "$SIDECAR")")"
          ARTIFACT_BOUNDARY="$(dirname "$(dirname "$BACKEND_ROOT")")"
          node scripts/native-runtime-contract.cjs --backend-root "$BACKEND_ROOT" --artifact-boundary-root "$ARTIFACT_BOUNDARY" --platform linux --arch x64 --require-bundled-python-plugin --require-bundled-methods
          "$SIDECAR" --smoke-readiness
          test -f "$ARTIFACT_BOUNDARY/chrome-sandbox"
          sudo chown root:root "$ARTIFACT_BOUNDARY/chrome-sandbox"
          sudo chmod 4755 "$ARTIFACT_BOUNDARY/chrome-sandbox"
          test "$(stat -c '%u:%g:%a' "$ARTIFACT_BOUNDARY/chrome-sandbox")" = '0:0:4755'
          xvfb-run -a node scripts/smoke-archive-standalone.cjs --extracted-root "$ARTIFACT_BOUNDARY" --platform linux --timeout-ms 360000
          xvfb-run -a node scripts/smoke-first-launch-ui.cjs --extracted-root "$ARTIFACT_BOUNDARY" --platform linux --timeout-ms 360000

      - name: Generate checksums
        run: |
          cd release
          for f in *.AppImage *.deb; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux-x64
          path: |
            release/*.AppImage
            release/*.deb
            release/*.sha256
            release/*.yml
          retention-days: 5

      - name: Record exact candidate proof
        run: |
          node -e 'require("fs").writeFileSync("hotfix-electron-proof.json",JSON.stringify({schema:"studio.hotfix-electron-proof.v1",source_sha:process.env.SOURCE_SHA,release_run_id:process.env.RELEASE_RUN_ID,version:"0.11.5",platform:"linux-x64",standalone_sandbox_enabled:true,ui_harness:"original-assertions-with-bounded-diagnostics",scientific_smoke:true,first_launch_ui:true,installer_built:true},null,2))'
      - uses: actions/upload-artifact@v4
        with:
          name: hotfix-electron-proof
          path: hotfix-electron-proof.json
          if-no-files-found: error
          retention-days: 7
