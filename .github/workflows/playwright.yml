# Playwright E2E Tests
# Runs end-to-end tests with a real backend (Python + nirs4all) and frontend
name: Playwright E2E Tests

on:
  push:
    branches: [main, develop, 'rc/**']
  pull_request:
    branches: [main, develop, 'rc/**']

env:
  # Node 22 = the locally-validated toolchain (engines: >=20). On node 24 the
  # playwright browser download repeatedly hung right after the chrome zip hit
  # 100% (3 bounded attempts, identical signature), never reaching the tests.
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'
  NIRS4ALL_LIBRARY_REF: ${{ startsWith(github.head_ref || github.ref_name, 'rc/') && 'rc/v1-full-refactor-python' || 'main' }}
  DAG_ML_REF: ${{ startsWith(github.head_ref || github.ref_name, 'rc/') && 'rc/v1-full-refactor' || 'main' }}
  DAG_ML_DATA_REF: ${{ startsWith(github.head_ref || github.ref_name, 'rc/') && 'rc/v1-full-refactor' || 'main' }}

jobs:
  e2e:
    name: E2E Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Provide nirs4all-ui sibling
        uses: ./.github/actions/nirs4all-ui-sibling

      - name: Install npm dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Checkout nirs4all library
        uses: actions/checkout@v4
        with:
          repository: GBeurier/nirs4all
          ref: ${{ env.NIRS4ALL_LIBRARY_REF }}
          path: nirs4all-lib

      - name: Checkout dag-ml runtime
        uses: actions/checkout@v4
        with:
          repository: GBeurier/dag-ml
          ref: ${{ env.DAG_ML_REF }}
          path: dag-ml

      - name: Checkout dag-ml-data runtime
        uses: actions/checkout@v4
        with:
          repository: GBeurier/dag-ml-data
          ref: ${{ env.DAG_ML_DATA_REF }}
          path: dag-ml-data

      - name: Setup Rust for local dag-ml wheels
        uses: dtolnay/rust-toolchain@stable

      - name: Install local dag-ml runtime wheels
        run: pip install ./dag-ml/crates/dag-ml-py ./dag-ml-data/crates/dag-ml-data-py

      - name: Install nirs4all from source
        run: pip install ./nirs4all-lib

      # The browser download can crawl/hang on runner CDN bad days (observed
      # 29 minutes before hitting the job timeout). Cache the browsers by
      # Playwright version and bound the install step so a bad download fails
      # fast instead of consuming the whole job budget.
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        timeout-minutes: 15
        run: |
          # The CDN intermittently stalls mid-asset (observed: chrome zip in
          # <1s, then the next asset hung for the whole step budget). Bound
          # each attempt and retry — playwright revalidates partial downloads.
          install_cmd="npx playwright install --with-deps chromium"
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            install_cmd="npx playwright install-deps chromium"
          fi
          for attempt in 1 2 3; do
            if timeout 240 $install_cmd; then
              exit 0
            fi
            echo "::warning::Playwright install attempt $attempt stalled or failed; retrying"
          done
          exit 1

      - name: Verify Playwright setup
        run: npx playwright --version

      - name: Run Playwright tests (web-chromium)
        run: npx playwright test --project=web-chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
