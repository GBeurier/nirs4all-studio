name: Publish existing Studio installers

on:
  workflow_dispatch:
    inputs:
      macos_retry_run_id:
        description: Successful macOS runner retry for the immutable Studio 0.15.11 source
        required: true
        type: string

permissions:
  contents: write
  actions: read
  packages: write

concurrency:
  group: publish-existing-studio-installers-0.15.11
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: 0.15.11
      RELEASE_SHA: 41a984cfb904987ed5a772d2caaa0fa217a00a2c
      RELEASE_PRERELEASE: 'false'
      RELEASE_NOTES_PATH: release-notes.md
      MACOS_RETRY_RUN: ${{ inputs.macos_retry_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify retained build identities and successful platform checks
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const source = process.env.RELEASE_SHA;
            if (!/^\d+$/.test(process.env.MACOS_RETRY_RUN)) throw Error('Invalid retry run identifier');
            const run_id = Number(process.env.MACOS_RETRY_RUN);
            const original = (await github.rest.actions.getWorkflowRun({ owner, repo, run_id: 42845474685 })).data;
            const retry = (await github.rest.actions.getWorkflowRun({ owner, repo, run_id })).data;
            if (original.head_sha !== source || original.path !== '.github/workflows/release-unified.yml' || original.status !== 'completed') throw Error('Unexpected original release identity');
            if (retry.head_sha !== 'd22901cc0237c548029dd371f7416ef0e1f079fa' || retry.path !== '.github/workflows/release-unified.yml' || retry.status !== 'completed' || retry.conclusion !== 'success') throw Error('Unexpected macOS runner retry identity');
            let tag = (await github.rest.git.getRef({ owner, repo, ref: 'tags/0.15.11' })).data.object;
            while (tag.type === 'tag') tag = (await github.rest.git.getTag({ owner, repo, tag_sha: tag.sha })).data.object;
            if (tag.type !== 'commit' || tag.sha !== source) throw Error('Immutable application tag mismatch');
            const oldJobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { owner, repo, run_id: 42845474685, per_page: 100 });
            const newJobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { owner, repo, run_id, per_page: 100 });
            const one = (jobs, name) => { const rows = jobs.filter(job => job.name === name); if (rows.length !== 1) throw Error('Ambiguous or missing job: ' + name); return rows[0]; };
            for (const name of ['Qualify release commit / Frontend', 'Qualify release commit / Backend', 'Qualify release commit / Native Docker Runtime', 'Qualify release commit / Native Sidecar Windows Containment', 'Qualify release commit / Electron Build Test', 'Qualify release commit / CI Summary', 'Native Docker Image']) {
              if (one(oldJobs, name).conclusion !== 'success') throw Error('Required source qualification failed: ' + name);
            }
            for (const [jobs, name] of [[oldJobs, 'Installer — Linux x64'], [oldJobs, 'Installer — Windows x64'], [newJobs, 'Installer — macOS arm64']]) {
              const job = one(jobs, name);
              if (job.conclusion !== 'success') throw Error('Installer did not qualify: ' + name);
              for (const step of ['Smoke packaged UI and runtime contract', 'Upload artifacts']) {
                if (!job.steps.some(item => item.name === step && item.conclusion === 'success')) throw Error('Missing installer qualification: ' + name + ' / ' + step);
              }
            }
      - uses: actions/download-artifact@v4
        with:
          name: installer-linux-x64-payload
          run-id: 42845474685
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/linux
      - uses: actions/download-artifact@v4
        with:
          name: installer-windows-x64-payload
          run-id: 42845474685
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: installer-macos-arm64-payload
          run-id: ${{ inputs.macos_retry_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/macos
      - uses: actions/download-artifact@v4
        with:
          name: packaged-ui-linux-proof
          run-id: 42845474685
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: proofs/linux
      - uses: actions/download-artifact@v4
        with:
          name: packaged-ui-windows-proof
          run-id: 42845474685
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: proofs/windows
      - uses: actions/download-artifact@v4
        with:
          name: packaged-ui-macos-arm64-proof
          run-id: ${{ inputs.macos_retry_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: proofs/macos
      - name: Verify exact installers and their actual packaged SHAP evidence
        run: |
          mkdir release
          find artifacts -type f \( -name '*.deb' -o -name '*.exe' -o -name '*.dmg' -o -name '*.sha256' \) -exec cp {} release/ \;
          node scripts/finalize-release-assets.cjs release 0.15.11 false false
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { canonicalPublishedName, sha256File } = require('./scripts/finalize-release-assets.cjs');
          const cohort = require('./build/runtime-cohort.json');
          for (const [directory, platform] of [['linux', 'linux'], ['windows', 'win32'], ['macos', 'darwin']]) {
            const proof = JSON.parse(fs.readFileSync(`proofs/${directory}/packaged-ui-smoke.json`, 'utf8'));
            assert.equal(proof.success, true);
            assert.equal(proof.source_sha, process.env.RELEASE_SHA);
            assert.equal(proof.packaged_version.commit, process.env.RELEASE_SHA);
            assert.equal(proof.packaged_version.version, process.env.RELEASE_TAG);
            assert.equal(proof.platform, platform);
            assert.equal(proof.embedded_sdk.source_sha, cohort.sdk.source_sha);
            assert.equal(proof.embedded_sdk.wheel_sha256, cohort.sdk.wheel_sha256);
            assert.equal(proof.shap.success, true);
            assert(proof.shap.blocked_job_websockets > 0);
            assert.equal(proof.shap.restored_results, true);
            assert.equal(proof.shap.captured_prediction_additivity, true);
            assert.equal(proof.installer.sha256, sha256File(`release/${canonicalPublishedName(proof.installer.name)}`));
          }
          NODE
      - uses: actions/download-artifact@v4
        with:
          name: docker-candidate
          run-id: 42845474685
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: docker-candidate
      - name: Verify the original tested Docker image
        run: |
          docker load --input docker-candidate/studio-image.tar
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' nirs4all-studio:native-release-candidate)" = "$RELEASE_SHA"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' nirs4all-studio:native-release-candidate)" = "$RELEASE_TAG"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the same tested Docker image
        run: |
          IMAGE=ghcr.io/gbeurier/nirs4all-studio
          docker tag nirs4all-studio:native-release-candidate "$IMAGE:$RELEASE_TAG"
          docker push "$IMAGE:$RELEASE_TAG"
          docker tag nirs4all-studio:native-release-candidate "$IMAGE:latest"
          docker push "$IMAGE:latest"
      - name: Write release notes for these immutable artifacts
        run: |
          cat > release-notes.md <<'NOTES'
          Studio 0.15.11 fixes SHAP analyses stuck on "Starting" after missed job WebSocket events or interrupted submissions. Job progress and terminal results now reconcile with the backend, and restored results survive page reloads.

          The embedded public backend is nirs4all 1.4.16 with Core 0.5.0, DAG-ML 0.4.0, IO 0.3.1, Formats 0.2.16 and Methods 1.3.15 (ABI 2.22).

          Installers: Windows x64, Linux x64 and macOS Apple Silicon. Each includes a SHA256 sidecar. Intel Mac installers remain deferred. Windows and macOS are unsigned. On Windows, use More info > Run anyway if SmartScreen prompts; on macOS, use right-click > Open on first launch.

          Each packaged application passed an actual train/refit/SHAP regression with missed WebSocket events, interrupted-submission recovery, restored results and captured-prediction additivity. This focused regression is not a full qualification of every scientific workflow.

          Docker: ghcr.io/gbeurier/nirs4all-studio:0.15.11 (also latest). See docs/NATIVE_HTTP_ACCESS.md for deployment configuration.

          Immutable application source: 41a984cfb904987ed5a772d2caaa0fa217a00a2c. Source checks, Windows, Linux and Docker reuse run 42845474685. Its macOS job could not start because GitHub retired the macos-14 runner; the macOS retry uses the same application tag with only the workflow runner changed to macos-15. Successful binaries are published unchanged.
          NOTES
          printf '\nmacOS runner retry: https://github.com/GBeurier/nirs4all-studio/actions/runs/%s\n' "$MACOS_RETRY_RUN" >> release-notes.md
      - name: Publish the same verified installers
        run: node scripts/publish-qualified-release.cjs release 0.15.11 false false
