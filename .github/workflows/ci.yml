# Continuous Integration workflow
# Runs on every push and PR to validate the codebase.
#
# Incremental-hardening policy (see AUDIT_TECHNIQUE.md): CI runs on the live
# `master` branch and reports every gate, but only the gates that are CURRENTLY
# green are merge-blocking. Pre-existing-red gates (tsc, eslint, vitest, the
# full pytest suite, packaging) run with `continue-on-error: true` and a TODO so
# their status is visible without blocking pushes. As each gate is greened in a
# later cleanup phase, remove its `continue-on-error` to make it blocking.
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Frontend: Lint, Test, Build
  # ═══════════════════════════════════════════════════════════════════════════
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # TODO: remove continue-on-error once eslint is clean (37 pre-existing
        # errors as of the audit; the rest of the suite is green and blocking).
        continue-on-error: true
        run: npm run lint

      # Blocking gate (green): the node-registry schema must stay valid.
      - name: Validate node registry
        run: npm run validate:nodes

      # Blocking gate (green): 0 type errors.
      - name: Type check
        run: npx tsc --noEmit

      # Blocking gate (green): 717 passing vitest tests, e2e excluded via vite.config.ts.
      - name: Run tests
        run: npm run test -- --run

      # Blocking gate (green): full production build (validate:nodes + tsc -b + vite build).
      - name: Build frontend
        run: npm run build

      - name: Build Electron frontend
        run: npm run build:electron

      - name: Verify build outputs
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html not found"; exit 1; }
          test -d dist-electron || { echo "::error::dist-electron not found"; exit 1; }
          echo "Build outputs verified"

  # ═══════════════════════════════════════════════════════════════════════════
  # Backend: Lint, Validate, Test
  # ═══════════════════════════════════════════════════════════════════════════
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgirepository1.0-dev \
            libcairo2-dev \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          # The backend test suite (and most api/ modules) import the
          # scientific stack at module scope; installing nirs4all pulls in
          # numpy/scipy/scikit-learn transitively and lets the import-smoke
          # test exercise the full router graph. The import-smoke test still
          # degrades gracefully (skips heavy-dep modules) if this is dropped.
          pip install nirs4all

      - name: Verify imports
        run: |
          python -c "
          import fastapi
          import uvicorn
          print('FastAPI version:', fastapi.__version__)
          print('Uvicorn version:', uvicorn.__version__)
          print('All imports successful')
          "

      - name: Check syntax
        run: |
          python -m py_compile main.py
          for f in api/*.py api/jobs/*.py api/shared/*.py; do python -m py_compile "$f"; done
          echo "Syntax check passed"

      - name: Test CLI arguments
        run: |
          python main.py --help
          echo "CLI arguments work"

      # Blocking gate (green): imports every api/ router and resolves every
      # FastAPI endpoint, catching handlers wired to removed helpers (the
      # "dead endpoint" class of bug). This is the high-value new gate.
      - name: Run import-smoke test
        run: pytest tests/test_import_smoke.py -q

      # Blocking gate (green): the fast backend suite passes once requirements
      # (incl. orjson) + nirs4all are installed. The earlier "29 failures" were a
      # local env gap (missing orjson), not code.
      - name: Run backend tests
        run: pytest -m "not slow"

      - name: Lint (ruff)
        # TODO(audit): remove continue-on-error once ruff is clean across api/
        # (config in pyproject.toml; pre-existing findings outside the cleaned files).
        continue-on-error: true
        run: |
          pip install ruff
          ruff check .

      - name: Type check (mypy)
        # TODO(audit): non-blocking until types are ratcheted (config in pyproject.toml).
        continue-on-error: true
        run: |
          pip install mypy
          mypy api main.py

  # ═══════════════════════════════════════════════════════════════════════════
  # Electron: Build validation (Linux only for speed)
  # ═══════════════════════════════════════════════════════════════════════════
  electron-build:
    name: Electron Build Test
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgirepository1.0-dev \
            libcairo2-dev \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 \
            upx-ucl

      - name: Install npm dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Electron frontend
        # TODO(audit Phase 2/3): packaging steps are non-blocking until the build
        # and packaging debt (specs, deps, tsc) is cleared.
        continue-on-error: true
        run: npm run build:electron

      - name: Build Python backend
        continue-on-error: true
        run: |
          pyinstaller backend.spec --clean --noconfirm
          mkdir -p backend-dist
          cp dist/nirs4all-backend backend-dist/
          chmod +x backend-dist/nirs4all-backend

      - name: Verify backend executable
        continue-on-error: true
        run: |
          test -f backend-dist/nirs4all-backend || { echo "::error::Backend not built"; exit 1; }
          echo "Backend executable size: $(du -h backend-dist/nirs4all-backend | cut -f1)"

      - name: Test electron-builder (dry-run)
        continue-on-error: true
        run: |
          npx electron-builder --linux --dir
          echo "Electron build test passed"

  # ═══════════════════════════════════════════════════════════════════════════
  # Summary
  # ═══════════════════════════════════════════════════════════════════════════
  summary:
    name: CI Summary
    needs: [frontend, backend, electron-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          FRONTEND="${{ needs.frontend.result }}"
          BACKEND="${{ needs.backend.result }}"
          ELECTRON="${{ needs.electron-build.result }}"

          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | $([[ $FRONTEND == 'success' ]] && echo '✅' || echo '❌') $FRONTEND |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | $([[ $BACKEND == 'success' ]] && echo '✅' || echo '❌') $BACKEND |" >> $GITHUB_STEP_SUMMARY
          echo "| Electron Build | $([[ $ELECTRON == 'success' ]] && echo '✅' || echo '❌') $ELECTRON |" >> $GITHUB_STEP_SUMMARY

          if [[ "$FRONTEND" != "success" || "$BACKEND" != "success" || "$ELECTRON" != "success" ]]; then
            exit 1
          fi
