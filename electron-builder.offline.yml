# Offline installer: the standard installer plus the offline payload (the
# pinned Python runtime archive and the wheels of the default package set), so
# that Studio can create its environment without network access. Artifacts
# carry the `-offline` suffix; the in-app update check never selects them.
extends: electron-builder.installer.yml

extraResources:
  - from: backend-dist/
    to: backend/
    filter:
      - "offline/**/*"

win:
  artifactName: "${productName}-${version}-win-${arch}-offline.${ext}"

mac:
  artifactName: "${productName}-${version}-mac-${arch}-offline.${ext}"

linux:
  artifactName: "${productName}-${version}-linux-${arch}-offline.${ext}"
