# Offline installer (Windows and Linux): the standard installer plus the
# offline payload (the pinned Python runtime archive, the wheels of the
# default package set and those of the CPU build of PyTorch), so that Studio
# can create its environment, and add PyTorch on request, without network
# access. Artifacts carry the `-offline` suffix; the in-app update
# check never selects them. There is no macOS offline installer: a macOS
# application cannot embed wheels.
extends: electron-builder.installer.yml

extraResources:
  - from: backend-dist/
    to: backend/
    filter:
      - "offline/**/*"

win:
  artifactName: "${productName}-${version}-win-${arch}-offline.${ext}"

linux:
  artifactName: "${productName}-${version}-linux-${arch}-offline.${ext}"
